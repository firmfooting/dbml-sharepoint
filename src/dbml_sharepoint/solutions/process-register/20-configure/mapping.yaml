# Process register — physical mapping.
prefix: "PR_"

entities:
  BusinessProcess: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 100
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

calculated_formulas:
  BusinessProcess:
    DigitisationPriority: '=IF(OR(ISBLANK([Criticality]),ISBLANK([PainLevel])),"",IF([Criticality]="Low",1,IF([Criticality]="Medium",2,3))*IF([PainLevel]="Minor",1,IF([PainLevel]="Moderate",2,3)))'

# Security: the inventory is built by everyone who runs a process — Members
# and Owners hold Contribute; Full Control confined to the empty-by-default
# admin group.
groups:
  - name: "PR List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_operator_during_deploy: true

permission_levels: []

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "PR List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Contribute"
      - principal: { kind: associated_owner_group }
        level: "Contribute"

# UI hardening (tamper-resilience): site owners/admins bypass every ACL,
# so the realistic threat is well-meaning UI tampering. Sealed columns
# block schema edits and deletion of every deployed column through the
# UI even for site admins (display-name renames stay possible — drift,
# reverted on re-paste; the deployer unseals for its own runs and
# re-seals in Phase 4.1); prevent_list_deletion blocks UI deletion of the
# list objects (rollback.js clears it per list after you confirm that
# list's deletion). Friction + tamper-evidence, not enforcement — see
# "The shared security model" in templates/README.md.
seal_columns: true
prevent_list_deletion: true

# Backend internal names stay exactly as authored in the DBML (views,
# indexes and formulas all key on them); the deployer renames the display
# Title after create. Auto PascalCase splitting handles every column here
# except one: "SystemUrl" splits to "System Url", and a lowercased acronym
# in a column header reads as a mistake on every view.
display_names:
  mode: auto
  overrides:
    BusinessProcess:
      SystemUrl: "System URL"

# Column formatting: the fleet style standard (dbml-sharepoint
# website/docs/reference/style-guide.md). This template shipped with none
# at all, and it is the one that needed it most: the whole product is a
# table you read at a glance to decide what to digitise first.
#
# Tokens map by the ROLE a member plays. CurrentState is the honest answer
# to "how is this done today", so its colours run from severe (paper) to
# good (a system of record) — which is also, deliberately, a picture of the
# programme's remaining work. Not worth digitising is `muted`, not
# `blocked`: governance is explicit that deciding NOT to digitise is
# legitimate output, and painting it with the alarm colour would argue the
# opposite in every view.
#
# DigitisationPriority takes the theme's shared treatment: data-bar,
# explicit max, fill translated from the band column beside it so the bar
# and that column can never disagree. The band is PainLevel, because pain
# is what a tall bar here means — the direction is deliberately the
# opposite of the project pipeline's, where a tall bar is an opportunity
# and runs to good. Same mechanism, opposite subject matter.
column_formatting:
  BusinessProcess:
    Criticality: { style: severity, map: { Low: good, Medium: warning, High: severe } }
    CurrentState:
      style: severity
      map:
        "Paper / manual": severe
        "Email / ad hoc": warning
        "Spreadsheet": warning
        "Shared list / basic digital": low
        "System of record": good
    PainLevel: { style: severity, map: { Minor: good, Moderate: warning, Severe: severe } }
    DigitisationStatus:
      style: severity
      map:
        "Not assessed": neutral
        "Assessed": neutral
        "Planned": low
        "In progress": low
        "Digitised": good
        "Not worth digitising": muted
    DigitisationPriority:
      style: data-bar
      max: 9
      calculated: true
      color_by:
        field: PainLevel
        map: { Minor: good, Moderate: warning, Severe: severe }
    # The annual inventory refresh, escalating once it is past due. Guarded
    # on the two states where a refresh no longer means anything: a
    # digitised process and one ruled out are both settled, and a date that
    # keeps shouting after the decision trains people to ignore the colour.
    ReviewDate:
      style: overdue-date
      guard:
        field: DigitisationStatus
        not: ["Digitised", "Not worth digitising"]

# The identifying spine every lens repeats. Four views share it, above
# §1.9's three-repetition threshold.
field_sets:
  BusinessProcess:
    identity: [Title, Function, Owner]

# Declared views (deployed and reconciled by the views phase; undeclared
# views are never touched). "The worklist" is the default and is the
# product: everything not yet settled, ranked by the score. The three
# lenses are the programme's own cadence — the quarterly dashboard, the
# per-function workshop and review unit, and the slide leadership actually
# remembers.
#
# Widths are pixel ColumnWidth per view, keyed on INTERNAL names (the build
# rewrites them to display titles — ColumnWidth binds by display name, and
# internal names silently reset).
#
# Two formatters read columns other than their own, so every view carries
# what they read: the score bar's fill comes from PainLevel, and the review
# date's guard reads DigitisationStatus. A column formatter can only see
# columns the view displays.
views:
  BusinessProcess:
    - title: "The worklist"
      default: true
      fields: ["@identity", Criticality, CurrentState, PainLevel,
               DigitisationPriority, DigitisationStatus, ReviewDate]
      where:
        - { field: DigitisationStatus, op: not_in,
            value: ["Digitised", "Not worth digitising"] }
      sort:
        - { field: DigitisationPriority, direction: desc }
      widths:
        Title: 280
        Function: 130
        Owner: 160
        Criticality: 120
        CurrentState: 220
        PainLevel: 120
        DigitisationPriority: 150
        DigitisationStatus: 180
        ReviewDate: 170
    # SystemUrl is on this view for governance data-quality rule 3 —
    # "Digitised rows carry a SystemUrl". That rule is NOT enforceable at
    # save (see list_validation below), so the compensating control is
    # visual: collapse to the Digitised group and a missing link is an
    # empty cell in a column of links.
    - title: "Programme dashboard"
      fields: ["@identity", CurrentState, PainLevel, DigitisationPriority,
               DigitisationStatus, TargetState, SystemUrl]
      group_by: { field: DigitisationStatus, collapsed: true }
      sort:
        - { field: DigitisationPriority, direction: desc }
      widths:
        Title: 260
        Function: 130
        Owner: 160
        CurrentState: 220
        PainLevel: 120
        DigitisationPriority: 150
        DigitisationStatus: 180
        TargetState: 200
        SystemUrl: 180
    - title: "By function"
      fields: ["@identity", Criticality, CurrentState, PainLevel,
               DigitisationPriority, DigitisationStatus, ReviewDate]
      group_by: { field: Function, collapsed: true }
      sort:
        - { field: DigitisationPriority, direction: desc }
      widths:
        Title: 280
        Function: 130
        Owner: 160
        Criticality: 120
        CurrentState: 220
        PainLevel: 120
        DigitisationPriority: 150
        DigitisationStatus: 180
        ReviewDate: 170
    # Two columns, one filter: a bare list is all_of, so this is
    # "high-criticality AND still on paper or in a spreadsheet". PainNotes
    # is on it because the quarterly slide needs the sentence, not just the
    # row — "only one person knows how" is what leadership remembers.
    - title: "Key-person risk"
      fields: ["@identity", Criticality, CurrentState, PainLevel, PainNotes,
               DigitisationPriority, DigitisationStatus]
      where:
        - { field: CurrentState, op: in, value: ["Paper / manual", "Spreadsheet"] }
        - { field: Criticality, op: eq, value: "High" }
      sort:
        - { field: DigitisationPriority, direction: desc }
      widths:
        Title: 260
        Function: 130
        Owner: 160
        Criticality: 120
        CurrentState: 220
        PainLevel: 120
        PainNotes: 200
        DigitisationPriority: 150
        DigitisationStatus: 180

# Form layouts: a strapline header and a sectioned body. SharePoint renders
# per-field description hints inside sectioned forms on the NEW form only —
# the edit form suppresses column descriptions (platform limitation).
# Section field lists are authored with INTERNAL names; the build rewrites
# them to display titles.
#
# System is last and holds only DigitisationPriority, so on the New form it
# is a bare heading — calculated columns never render on entry forms.
# Cosmetic and expected, the same shape risk-register's System section has.
form_formatting:
  BusinessProcess:
    header: formatting/businessprocess-form-header.json
    body: formatting/businessprocess-form-body.json

# The inventory workshop is three minutes per process, timeboxed, and the
# facilitator is typing while people talk. What the workshop does not do is
# decide where anything ends up — governance is explicit that solving comes
# later, ranked — so the two fields that answer "where does it go" stay off
# the form until the status says somebody has decided.
#
# Deliberately NOT declared: any rule conditioned on DigitisationPriority.
# Conditional show/hide cannot read a calculated column — the formula stays
# syntactically valid, so it saves, the readback compares equal and the
# phase passes, but the form never reacts. The build refuses it, and the
# most natural rule here ("ask for a target state once the score is 6 or
# more") is exactly that trap. The rule below keys on the status instead,
# which is a real choice somebody makes rather than an arithmetic result.
form_visibility:
  BusinessProcess:
    columns:
      TargetState:
        when:
          - { field: DigitisationStatus, op: neq, value: "Not assessed" }
      SystemUrl:
        when:
          - { field: DigitisationStatus, op: in, value: ["In progress", "Digitised"] }

# Per-column save rules. Each column carries its own formula and its own
# message, and they all run — unlike list_validation, where a list has a
# single ValidationFormula and every cross-column rule shares one message.
column_validation:
  BusinessProcess:
    columns:
      # Governance sets a full inventory refresh annually. A review date
      # further out than that is not a slower cadence, it is a row that has
      # left the refresh: it never appears overdue and nobody is asked
      # whether it is still true. The blank arm is deliberate — a row
      # captured in a workshop and not yet given a review date is a normal
      # intermediate state, not an error.
      ReviewDate:
        when:
          any_of:
            - { field: ReviewDate, op: is_null }
            - { field: ReviewDate, op: leq, value: today+365 }
        message: "The inventory refresh is annual. Pick a review date within the next twelve months, or leave it blank until the row has been through a workshop."

# Save-time enforcement, stored on the LIST so it may reference any column.
list_validation:
  BusinessProcess:
    # ONE rule. Once somebody has decided to do something about a process,
    # the register has to say where it is going — otherwise "Planned" is a
    # status with no content and the programme dashboard counts intentions.
    # Written as an implication: `if A then B` is `any_of[not A, B]`, which
    # is why the branch starts with the states the rule does not apply to.
    when:
      any_of:
        - { field: DigitisationStatus, op: in,
            value: ["Not assessed", "Assessed", "Not worth digitising"] }
        - { field: TargetState, op: is_not_null }
    message: "A process that is Planned, In progress or Digitised needs a Target State — which system, which template, which form. Say where it is going before you say it is on its way."

# Demo rows (emitted as demo-data.js ONLY when built with --seed). Every
# Title starts "[DEMO] " — the marker rollback.js trusts to delete
# demo-only lists without the non-empty refusal. Dates are today±N so the
# review cadence lands on whatever day the demo runs; "@me" is the pasting
# operator. Coverage: every declared view returns rows, every member of
# every formatted column renders at least once — all five current states,
# all six digitisation statuses, all three criticality and pain bands — and
# two rows land in "Key-person risk", which is the slide the whole
# quarterly cadence is built around. The review date appears overdue (red)
# on a live row and long past but PLAIN on a digitised one, so the guard
# and its absence are both visible.
demo_items:
  BusinessProcess:
    - key: process-roster
      values:
        Title: "[DEMO] Build the fortnightly roster"
        Function: "Operations"
        Owner: "@me"
        Purpose: "Demo row. Turns the fortnight's demand and leave into a published roster the whole service works to."
        Criticality: "High"
        CurrentState: "Spreadsheet"
        PainLevel: "Severe"
        PainNotes: "Demo row. One workbook, one person who understands the award formulas in it, and no version anyone else can safely open. Two days' work every fortnight, and a fortnight of exposure whenever she takes leave."
        DigitisationStatus: "Planned"
        TargetState: "Rostering module in the workforce system"
        ReviewDate: "today-15"
    - key: process-visitors
      values:
        Title: "[DEMO] Register visitors at reception"
        Function: "Corporate services"
        Owner: "@me"
        Purpose: "Demo row. Records who is on site, so an evacuation list can be produced in under a minute."
        Criticality: "High"
        CurrentState: "Paper / manual"
        PainLevel: "Moderate"
        PainNotes: "Demo row. A paper book at each of four desks. The evacuation list is assembled by walking to the desks, which is exactly when nobody can."
        DigitisationStatus: "In progress"
        TargetState: "Visitor log template, one list per site"
        SystemUrl: "https://example.sharepoint.com/sites/demo/Lists/VL_Visit"
        ReviewDate: "today+40"
    - key: process-travel
      values:
        Title: "[DEMO] Approve staff travel"
        Function: "Corporate services"
        Owner: "@me"
        Purpose: "Demo row. Gets travel authorised against a budget before it is booked."
        Criticality: "Medium"
        CurrentState: "Email / ad hoc"
        PainLevel: "Moderate"
        PainNotes: "Demo row. Approvals live in the approver's mailbox, so nobody can answer 'was this approved' without asking them."
        DigitisationStatus: "Assessed"
        ReviewDate: "today+120"
    - key: process-onboarding
      values:
        Title: "[DEMO] Onboard a new starter"
        Function: "People"
        Owner: "@me"
        Purpose: "Demo row. Gets a new person accounts, access, equipment and an induction before their first day."
        Criticality: "Medium"
        CurrentState: "Shared list / basic digital"
        PainLevel: "Moderate"
        PainNotes: "Demo row. A shared checklist that works, but the IT and facilities steps are chased by email and slip about a third of the time."
        DigitisationStatus: "Not assessed"
        ReviewDate: "today+90"
    # Digitised, and its review date is long past. It renders PLAIN, not
    # red: the guard suppresses the escalation for settled rows.
    - key: process-incidents
      values:
        Title: "[DEMO] Record and investigate incidents"
        Function: "Quality"
        Owner: "@me"
        Purpose: "Demo row. Captures incidents, runs the investigation and tracks the corrective actions to closure."
        Criticality: "High"
        CurrentState: "System of record"
        PainLevel: "Minor"
        PainNotes: "Demo row. Running in the incident management template since last year. A monthly count of incidents recorded is the measure that would reveal a quiet reversion to email."
        DigitisationStatus: "Digitised"
        TargetState: "Incident management template"
        SystemUrl: "https://example.sharepoint.com/sites/demo/Lists/IM_Incident"
        ReviewDate: "today-200"
    - key: process-stationery
      values:
        Title: "[DEMO] Order stationery"
        Function: "Corporate services"
        Owner: "@me"
        Purpose: "Demo row. Keeps the stationery cupboard stocked."
        Criticality: "Low"
        CurrentState: "Email / ad hoc"
        PainLevel: "Minor"
        PainNotes: "Demo row. An email to the supplier once a month. It works, it costs nobody anything, and digitising it would cost more than it saves — recorded as a decision rather than left on the list forever."
        DigitisationStatus: "Not worth digitising"
        ReviewDate: "today+300"
