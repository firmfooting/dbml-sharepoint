        Discipline: "Other credentialed role"
        Role: "Sterilisation technician"
        ScopeSummary: "Demo row. Reprocessing of reusable instruments within the agreed procedure set."
        ScopeApprovedDate: "today-600"
        ScopeReviewDate: "today-5"
        Status: "Under review"
        Notes: "Demo row. Non-registered credentialed role, so no registration number; the pair is off the form entirely for this discipline. Background check lapsed; under review until the authority decides."
    - key: prac-dental
      values:
        Title: "[DEMO] Dental officer — ceased"
        Discipline: "Dental"
        Role: "Dental officer"
        RegistrationNumber: "[DEMO] DEN-1000005"
        RegistrationExpiry: "today-200"
        ScopeSummary: "Demo row. General dental practice; no conditions at cessation."
        ScopeApprovedDate: "today-1500"
