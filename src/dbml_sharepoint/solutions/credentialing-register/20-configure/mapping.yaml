        Notes: "Demo row. Left the service. Never deleted (the historical record is the register's legal value), and the stale dates stop being coloured, because at Ceased they are history rather than deadlines."
  Credential:
    - key: cred-medical-reg
      values:
        Title: "[DEMO] General registration"
