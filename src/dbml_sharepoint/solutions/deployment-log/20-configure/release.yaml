release: "1.0.0"
date: "2026-09-05"
deployer_version: "dbml-sharepoint/0.1.0"
schema_version: "1.1.0"
notes: |
  Central deployment log template. Deploy this to the logging site once;
  every other family's deploy then stamps the list it creates. Bump
  schema_version on any DBML/mapping change before redeploying, and check
  CENTRAL_LOG_COLUMNS in analysis/sidecars.py still names every column a
  cross-web stamp writes.

  1.1.0 carries the change feed as well as the stamps. A deploy that reaches
  this list writes its type-2 change rows here and creates no per-site
  sidecars, so the list gained the eight CHANGE_FIELDS columns and the
  drop-box posture that keeps a contributor from editing what it wrote.
