release: "2.1.1"
date: "2026-09-15"
deployer_version: "dbml-sharepoint/0.6.0"
schema_version: "2.1.1"
notes: |
  Breaking redesign: one Document library replaces the Topic list and SAQ library.
  SAQs are vendor downloads; a new SAQ for the same topic has a new period.
  REGs are references. Content stays in Excel and executive review is optional.
  Deploy a new library and migrate deliberately; existing containers are not removed.
  Remove platform-owner assignment, synthetic assessment references and due dates.
  Require SAQ status and a review decision at completion; clarify governance checks.
