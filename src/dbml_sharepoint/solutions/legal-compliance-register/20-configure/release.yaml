release: "2.3.0"
date: "2026-09-24"
deployer_version: "dbml-sharepoint/0.6.0"
schema_version: "2.3.0"
notes: |
  2.3.0 simplifies permissions to the site's own groups. Site Members edit
  without delete and site Owners hold Full Control, on the library only;
  division folders inherit from it. The Compliance Coordinators, Assessment
  Owners and per-division groups are no longer declared. To upgrade a 2.2.0
  site, first restore inheritance on every division folder (Delete Unique
  Permissions in its advanced permission settings): the deploy refuses to run
  while any folder keeps its own permissions, and never erases them itself.
  Then redeploy, which replaces the library's role assignments, and delete the
  unused groups by hand.

  2.2.0 and earlier. Breaking redesign: one Document library replaces the Topic list and SAQ library.
  SAQs are vendor downloads; a new SAQ for the same topic has a new period.
  REGs are references. Content stays in Excel and executive review is optional.
  Deploy a new library and migrate deliberately; existing containers are not removed.
  Remove platform-owner assignment, synthetic assessment references and due dates.
  Require SAQ status and a review decision at completion; clarify governance checks.
  Reject stale completion dates on reopened SAQs and remove assessment defaults.
  Show recently recorded assessments first.
  Name the library Legislative Compliance at LegislativeCompliance.
  Retain native file icons and add Folder View. Preserve cancelled review history.
  Add optional Oversight Committee choices and preserve cancelled portal-recording history.
  Take the library's folders from the division enum instead of a second list.
  Create one group per division, owned by the coordinators, and give each
  division folder its own permissions, so a division's own group edits only
  that division's files. Coordinators, assessment owners and the register's
  administrators keep edit rights across every folder.
