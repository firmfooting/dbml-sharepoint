# One library; publisher issue metadata never defaults from the upload date.

prefix: LC_

# Division folders and the DBML enum must be customised together.

entities:
  Document:
    title: Legislative Compliance
    internal_name: LegislativeCompliance
    kind: DocumentLibrary
    base_template: 101
    site_role: default
    folders: [Clinical services, Corporate services, Community services, Executive and governance]

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 200
    enable_minor_versions: false
  overrides: {}

enum_sources: {}

watched_lists: []

groups:
  - name: '{prefix} Compliance Coordinators'
    description: Platform owners file SAQs, assign the division executive and record completed assessments
      in the compliance platform.
    owner_group: Site Owners
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: '{prefix} Assessment Owners'
    description: Executives assign business owners and optionally review completed SAQs. Business owners
      complete them. Edit without delete.
    owner_group: Site Owners
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: dbml List Administrators
    description: Full Control for schema changes and redeploys. Empty by default; the deploy script enrols
      the running operator per run.
    owner_group: Site Owners
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: dbml Enterprise Readers
    description: Read-only accounts for aggregated cross-site reporting. Empty by default; membership
      is operator-owned.
    owner_group: Site Owners
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

permission_levels:
  - name: '{prefix} Contribute No Delete'
    description: Add and edit files and rows and read everything; no delete, no schema rights.
    base_permissions: [ViewListItems, AddListItems, EditListItems, OpenItems, ViewVersions, ViewFormPages,
      Open, ViewPages, BrowseUserInfo, UseClientIntegration, UseRemoteAPIs, CreateAlerts, ManagePersonalViews,
      EditMyUserInfo]

# Workflow roles share edit access; status transitions are not role-restricted.

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: {kind: group, name: '{prefix} Compliance Coordinators'}
        level: Contribute
      - principal: {kind: group, name: '{prefix} Assessment Owners'}
        level: '{prefix} Contribute No Delete'
      - principal: {kind: group, name: dbml List Administrators}
        level: Full Control
      - principal: {kind: associated_member_group}
        level: Read
      - principal: {kind: associated_owner_group}
        level: Read
      - principal: {kind: group, name: dbml Enterprise Readers}
        level: Read
  overrides: {}

seal_columns: true

prevent_list_deletion: true

display_names:
  mode: auto
  overrides:
    Document:
      ItemType: Type
      PortalTopicId: Portal topic ID
      ExternalRecorded: Recorded in portal
      TrackingNotes: Tracking notes

column_formatting:
  Document:
    Status:
      style: severity
      map:
        Required: neutral
        In progress: low
        Complete: good
        No longer required: muted

field_sets:
  Document:
    identity: [FileLeafRef, TopicName, Division, ExecutiveResponsible, BusinessOwner, Status]

# Assessment worklists exclude REGs; the flat platform-owner workspace includes all files.

views:
  Document:
    - title: Folder View
      scope: default
      fields: [FileLeafRef, ItemType, TopicName, Division, Modified]
      sort:
        - {field: FileLeafRef, direction: asc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
    - title: Platform owner
      scope: recursive
      fields: [FileLeafRef, ItemType, TopicName, PortalTopicId, Division,
        ExecutiveResponsible, BusinessOwner, Status, CompletedDate,
        ReviewRequirement, ReviewedDate, ExternalRecorded]
      sort:
        - {field: Modified, direction: desc}
      widths:
        FileLeafRef: 300
        ItemType: 100
        TopicName: 220
        PortalTopicId: 140
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
        CompletedDate: 140
        ReviewRequirement: 140
        ReviewedDate: 140
        ExternalRecorded: 160
    - title: Pending
      scope: recursive
      fields: ['@identity']
      where:
        - {field: ItemType, op: eq, value: SAQ}
        - {field: Status, op: in, value: [Required, In progress]}
      sort:
        - {field: Modified, direction: desc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
      default: true
    - title: My responsibility
      scope: recursive
      fields: ['@identity']
      where:
        - {field: ItemType, op: eq, value: SAQ}
        - {field: Status, op: in, value: [Required, In progress]}
        - {field: BusinessOwner, op: eq, value: me}
      sort:
        - {field: Modified, direction: desc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
    - title: My accountability
      scope: recursive
      fields: ['@identity', CompletedDate, ReviewRequirement, ReviewedDate]
      where:
        - {field: ItemType, op: eq, value: SAQ}
        - {field: ExecutiveResponsible, op: eq, value: me}
        - {field: Status, op: not_in, value: [No longer required]}
        - {field: ExternalRecorded, op: is_null}
      sort:
        - {field: Status, direction: asc}
        - {field: Modified, direction: desc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
        CompletedDate: 140
        ReviewRequirement: 140
        ReviewedDate: 140
    - title: Awaiting review
      scope: recursive
      fields: ['@identity', CompletedDate, ReviewRequirement, ReviewedDate]
      where:
        - {field: ItemType, op: eq, value: SAQ}
        - {field: Status, op: eq, value: Complete}
        - {field: ReviewRequirement, op: eq, value: Required}
        - {field: ReviewedDate, op: is_null}
        - {field: ExternalRecorded, op: is_null}
      sort:
        - {field: CompletedDate, direction: asc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
        CompletedDate: 140
        ReviewRequirement: 140
        ReviewedDate: 140
    - title: To record in the portal
      scope: recursive
      fields: ['@identity', CompletedDate, ReviewedDate, ExternalRecorded]
      where:
        - {field: ItemType, op: eq, value: SAQ}
        - {field: Status, op: eq, value: Complete}
        - {field: ExternalRecorded, op: is_null}
        - any_of:
            - {field: ReviewRequirement, op: eq, value: Not required}
            - {field: ReviewedDate, op: is_not_null}
      sort:
        - {field: CompletedDate, direction: asc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
        CompletedDate: 140
        ReviewedDate: 140
        ExternalRecorded: 160
    - title: Recorded assessments
      scope: recursive
      fields: ['@identity', CompletedDate, ExternalRecorded]
      where:
        - {field: ItemType, op: eq, value: SAQ}
        - {field: Status, op: eq, value: Complete}
        - {field: ExternalRecorded, op: is_not_null}
      sort:
        - {field: ExternalRecorded, direction: desc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
        CompletedDate: 140
        ExternalRecorded: 160
    - title: Reference regulations
      scope: recursive
      fields: [FileLeafRef, TopicName, PortalTopicId, IssuedYear, IssuedQuarter, Division]
      where:
        - {field: ItemType, op: eq, value: REG}
      sort:
        - {field: TopicName, direction: asc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        PortalTopicId: 140
        IssuedYear: 100
        IssuedQuarter: 120
        Division: 180
    - title: All assessments
      scope: recursive
      fields: ['@identity', IssuedYear, IssuedQuarter, CompletedDate, ExternalRecorded]
      where:
        - {field: ItemType, op: eq, value: SAQ}
      sort:
        - {field: TopicName, direction: asc}
        - {field: FileLeafRef, direction: asc}
      widths:
        FileLeafRef: 300
        TopicName: 220
        Division: 180
        ExecutiveResponsible: 180
        BusinessOwner: 160
        Status: 150
        IssuedYear: 100
        IssuedQuarter: 120
        CompletedDate: 140
        ExternalRecorded: 160

form_formatting:
  Document:
    header: formatting/document-form-header.json
    body: formatting/document-form-body.json

# REGs retain topic and issuance metadata without assessment workflow fields.

form_visibility:
  Document:
    columns:
      ExecutiveResponsible:
        when:
          - {field: ItemType, op: eq, value: SAQ}
      BusinessOwner:
        when:
          - {field: ItemType, op: eq, value: SAQ}
      Status:
        when:
          - {field: ItemType, op: eq, value: SAQ}
      CompletedDate:
        when:
          - {field: ItemType, op: eq, value: SAQ}
      ReviewRequirement:
        when:
          - {field: ItemType, op: eq, value: SAQ}
      ReviewedDate:
        when:
          - {field: ItemType, op: eq, value: SAQ}
      ExternalRecorded:
        when:
          - {field: ItemType, op: eq, value: SAQ}
      TrackingNotes:
        when:
          - {field: ItemType, op: eq, value: SAQ}

# Publisher issues can predate the assessment by several years.

column_validation:
  Document:
    columns:
      IssuedYear:
        when:
          any_of:
            - {field: IssuedYear, op: is_null}
            - all_of:
                - {field: IssuedYear, op: geq, value: 1900}
                - {field: IssuedYear, op: leq, value: 9999}
        message: Enter the publisher issuance year as four digits.

# Person assignments are checked by the platform owner and executive.

list_validation:
  Document:
    when:
      any_of:
        - {field: ItemType, op: eq, value: REG}
        - all_of:
            - {field: Status, op: is_not_null}
            - any_of:
                - {field: Status, op: not_in, value: [Required, In progress]}
                - {field: CompletedDate, op: is_null}
            - any_of:
                - {field: Status, op: not_in, value: [In progress, Complete]}
                - all_of:
                    - {field: TopicName, op: is_not_null}
                    - {field: Division, op: is_not_null}
            - any_of:
                - {field: Status, op: neq, value: Complete}
                - all_of:
                    - {field: CompletedDate, op: is_not_null}
                    - {field: ReviewRequirement, op: is_not_null}
            - any_of:
                - {field: ReviewedDate, op: is_null}
                - all_of:
                    - {field: Status, op: in, value: [Complete, No longer required]}
                    - {field: CompletedDate, op: is_not_null}
            - any_of:
                - {field: ExternalRecorded, op: is_null}
                - all_of:
                    - {field: Status, op: eq, value: Complete}
                    - {field: CompletedDate, op: is_not_null}
            - any_of:
                - {field: ExternalRecorded, op: is_null}
                - {field: ReviewRequirement, op: eq, value: Not required}
                - {field: ReviewedDate, op: is_not_null}
            - any_of:
                - {field: CompletedDate, op: is_null}
                - {field: CompletedDate, op: leq, value: today}
            - any_of:
                - {field: ReviewedDate, op: is_null}
                - {field: ReviewedDate, op: leq, value: today}
            - any_of:
                - {field: ExternalRecorded, op: is_null}
                - {field: ExternalRecorded, op: leq, value: today}
    message: SAQs need status. Required/In progress need blank completion dates. In progress/Complete
      need topic and division. Complete needs a date and review choice. Review needs Complete or
      No longer required; recording needs Complete; requested reviews need a date to record. Dates cannot be future.

