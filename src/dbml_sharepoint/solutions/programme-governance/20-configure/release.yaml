release: "3.2.0"
date: "2026-09-08"
deployer_version: "dbml-sharepoint/0.1.0"
schema_version: "3.2.0"
notes: |
  3.2.0 also puts the date a save rule requires on the views you set the
  status from. Reported live: marking an action Done from "My actions" was
  refused for a blank Completed Date, and the grid had no cell to put one in,
  so the only way through was to open the full form. Completed Date, Resolved
  Date and Decision Date now ride on the ten views whose own purpose is that
  transition, so one Quick Edit save satisfies the rule. The rules themselves
  are unchanged: an action finished on a date nobody can name is still In
  progress.

  Ten further views show a trigger without its requirement and are left that
  way deliberately; the mapping's views section says which and why.

  3.2.0 separates HOW FAR an involvement has got from HOW MUCH AUTHORITY it
  carries. Involvement (Agree, Consulted, Informed) is unchanged and still
  means authority. A new EngagementStatus (Identified, Scheduled, Engaged)
  and a NextContact date record whether the involvement has actually
  happened, and a new view, "Identified, not yet engaged", lists the ones
  that have not.

  The alternative was a fourth member on Involvement itself, which was asked
  for and rejected. It cannot say "we need this person to Agree and have not
  approached them yet", which is the sentence the programme needs, and it
  breaks the Consultation load view: that view filters Involvement in
  [Consulted, Agree] to reveal one stakeholder made Consulted on everything,
  so an identified would-be Agree on ten activities would have appeared in
  none of them. Two axes keep both readings.

  NOT breaking. Both columns are new and nothing existing changes meaning.

  ONE MANUAL STEP on a site that already holds involvements. SharePoint
  applies a column default to new items only, so every existing row reads
  BLANK for Engagement Status rather than Engaged. The backlog view filters
  on [Identified, Scheduled] and CAML matches no null, so blank rows stay
  OUT of it and the view is trustworthy from the first refresh. They will
  show blank in the two standing views until somebody fills them. Set them
  all to Engaged in one bulk edit after deploying; every row that predates
  this release is an involvement that has already happened.

  Also in this release, and independent of the above:

  - Involvement projects the stakeholder's Status, so an involvement still
    live against a retired stakeholder is visible on the row. Stakeholder
    retires by Status and is never deleted, and until now nothing carried
    that fact to where a view could read it.
  - The Involvement table note records that (Activity, Stakeholder) is NOT
    unique and cannot be made so: SharePoint has no composite unique
    constraint and a validation formula sees only the row being saved. The
    quarterly walk is what catches a duplicate.

  NOT added, deliberately: a save rule requiring NextContact while Scheduled.
  That is a comparison against a blank date, which is the exact shape of
  issue #156, an unmeasured live-site hazard already present in thirteen
  shipped templates. The column note carries the rule and the view surfaces
  a stall; a rule can follow once #156 is probed.

  3.1.0 gives every list's built-in Title column a display name that says
  what it holds: Workstream, Stakeholder, Activity, Input, Service Request,
  Risk, Action, Issue, Decision, Business Process. Each is the DBML note on
  that column shortened to a label. Involvement is "Input" rather than
  "Involvement" because that list already has a column of that name for the
  RACI role, and its Title holds the input the stakeholder brings.

  NOT breaking, and nothing needs migrating. Only the DISPLAY name moves.
  The internal name stays `Title` and cannot move: SP.Field exposes no
  setter for InternalName, and a live run on 2026-09-07
  (test/manual/title-rename-probe.js) renamed a base-template Title and read
  back InternalName="Title", StaticName="Title", with both addresses still
  resolving and an item POST carrying `Title` still creating a row. Views,
  Power Query, the SQL views, flows and every item write are untouched.

  The Power Query rename step and the form and view references move to the
  new names, which is what they were always going to do; before this release
  they moved while the column did not, and the tool refused the declaration
  for that reason.

  The one thing that does change is calculated formulas. SharePoint resolves
  a formula by DISPLAY name, so `Risk.LiveRiskTitle` and
  `Decision.LiveDecisionTitle` are emitted as `[Risk]` and `[Decision]`
  rather than `[Title]`. The deploy renames Title before it creates the
  calculated columns, so a redeploy converges on its own.

  3.0.0 renames Stakeholder.ServiceDeskAddress to ExternalContactDetails and
  removes the display_names override that gave it the title "External
  Contact Details". The override existed because UAT feedback (family
  issue #2) found the column reaches external bodies generally, not only
  service desks, and the internal name stayed because views, Power Query
  and SQL keyed on it. The operator has since deleted the column from the
  live site by hand, so it holds no data anywhere, and that is the one
  window in which the internal name can change for free.
  auto_display_name("ExternalContactDetails") returns "External Contact
  Details", the same string the override produced, so the rename changes
  nothing an operator sees.

  BREAKING for any site that still holds data under ServiceDeskAddress.
  The deploy creates a new, empty ExternalContactDetails column and stops
  managing ServiceDeskAddress entirely; the old column and whatever it
  holds are left untouched on the list. Nothing is migrated, and this tool
  never deletes a column. An operator with data in ServiceDeskAddress must
  copy it across by hand, before or after redeploying, then delete the old
  column with dbml-sharepoint columns-script. Anything reading the column
  by its internal name, a Power Query query, the SQL views, a Flow, a
  report built against the list, breaks and has to be repointed at
  ExternalContactDetails.

  This rename is not safe in general. It is safe here only because the
  column was already empty on the one site this change targets.

  2.4.0 makes BusinessProcess.NextReviewDue CALCULATED, twelve months after
  LastReviewedDate, and gives BusinessProcess a multi-value Stakeholders
  lookup.

  2.2.1 said on that column that you set the date yourself, because a backlog
  row carries no rating to derive a cadence from the way a risk does. It
  carries none and needs none: twelve months from the last sweep is a cadence
  a formula can hold, and the whole point of splitting the review date in
  2.2.0 was that a date somebody can type is a date somebody can push out.
  Blank LastReviewedDate still yields a blank due date, because inventing one
  from a sweep that never happened would bury the finding that nobody has
  looked. The month-end clamp is the same one 2.3.0 gave the other three.

  READ THIS IF YOU ARE ALREADY ON 2.2.x OR 2.3.0. SharePoint cannot turn a
  typed date into a calculated one in place. Delete the NextReviewDue column
  with the columns sidecar before redeploying, and the deploy will create the
  calculated one. A site on 2.1.0 or earlier has no NextReviewDue at all and
  needs nothing: the column is created calculated and no data moves. The save
  rule that capped the typed date at twelve months is gone, since nobody can
  type the column now.

  Stakeholders is the first multi-value lookup in any shipped family. It
  names everyone worth interviewing about how a process actually runs, which
  is what a mapping session needs and what the single Owner column could not
  hold. It is NOT indexed and cannot be: measured 2026-09-02, Indexed=true on
  a LookupMulti was refused HTTP 500 "This column type is not supported for
  indexing" and read back false, while a single-value control in the same run
  took the index. It costs one join like any other lookup, taking the list to
  3 of the ceiling of 12, so no view is at risk.

  2.3.0 clamps Activity.ConfirmationDue and Risk.NextReviewDue at month end.
  Adding months with DATE(Y, M+N, D) alone overflowed rather than clamping,
  so a confirmation recorded 31 August fell due 3 March rather than 28
  February: one to three days late, never early, and only when the baseline
  day is a 29th, 30th or 31st landing on a shorter month. Both formulas now
  take MIN of that date and DATE(Y, M+N+1, 0), the last day of the target
  month. risk-register's NextReviewDue takes the same shape in the same
  release, so the three copies stay one idiom.

  EVERY EXISTING ROW RECALCULATES on redeploy. Only rows whose baseline
  falls on a day the target month does not have will move, and each moves
  one to three days earlier. Export GOV_Activity and GOV_Risk before
  redeploying if the previous due dates need to be kept.

  2.2.1 says on BusinessProcess.NextReviewDue that you set the date yourself.
  The column is typed here and calculated on Risk, in one family, and the two
  were indistinguishable by name (#412). Description text only; no column,
  view, form or rule changes.

  2.2.0 splits ReviewDate into LastReviewedDate and NextReviewDue on both Risk
  and BusinessProcess. One hand-set date stood for both halves of a review, so
  moving it forward destroyed the evidence that a review had happened and
  nothing could tell an on-time review from a push-out by somebody who had not
  looked. Risk also carried no save rule at all while BusinessProcess next to
  it did, which had the guard on the register with the less consequence.

  Risk now matches risk-register. LastReviewedDate is required and defaults to
  today, because creating a risk is assessing it, and it cannot be dated in the
  future. NextReviewDue is CALCULATED from it and the residual rating: three
  months at High or Extreme, six where the response is Manage or Tolerate,
  twelve otherwise. Nobody can type it, so nobody can push a review out without
  claiming a review that did not happen. It carries the same month-end overflow
  as ConfirmationDue, unfixed here for the same reason.

  BusinessProcess is the deliberate exception on both counts. Its
  LastReviewedDate is optional with no default, because capturing a backlog row
  is not sweeping it and a default would claim a check that never happened;
  blank there means nobody has ever swept the row, which is a finding in the
  same way a blank Owner is. Its NextReviewDue stays a typed date capped at
  twelve months, because a backlog sweep has no rating to derive a cadence
  from.

  "Closed this quarter" filters and sorts on LastReviewedDate. It used to use
  the forward-looking date as a proxy, because closing a risk is a status
  change with no closure date; the review at which it was closed is now a
  column rather than a stand-in.

  Both ReviewDate columns are RETIRED, not deleted. They keep their values,
  drop off every view and the New form, and read "Review Date (retired)".
  Transfer the values, then delete each column with the columns sidecar.

  2.1.0 adds GOV_BusinessProcess, the register of project-adjacent processes
  worth mapping: what each is for, the order to take them in, and where the
  map ended up. The maps themselves are made elsewhere, in a diagramming tool,
  and MapUrl points at them; this list is the durable record of which processes
  the programme knows about.

  PriorityScore is criticality multiplied by frequency, one to nine, and it is
  advice. MappingPriority (Now, Next, Later) is the decision and is what the
  queue runs on, with PriorityNote carrying the reason whenever the two
  disagree. Reach was considered as the second factor and rejected: measured
  against the real population, every project-adjacent process reaches the whole
  organisation, so it scored every row alike.

  This is NOT process-register's inventory under another name. That register
  scores what to digitise, on criticality multiplied by pain, and asks how a
  process is done today. This one scores what to map, on criticality
  multiplied by frequency, and asks nothing about how the work is done because
  that is what the map is for. Rows do not move between them unchanged.

  Activity gains a nullable Process lookup, so who maps a process is an
  ordinary activity with one Responsible, one Accountable and an Involvement
  row per stakeholder consulted. Nothing else changes: the list is new, so a
  2.0.0 site adopts its nine existing lists untouched and gains a tenth.

  Programme governance. Ten lists on one site, merging a delivery layer
  with a standing accountability register and a service request queue for
  tenant-level change.

  2.0.0 gives every list its bare entity name under the family's new
  prefix, GOV_: GOV_Workstream, GOV_Stakeholder, GOV_Activity,
  GOV_Involvement, GOV_ServiceRequest, GOV_Risk, GOV_Action, GOV_Issue and
  GOV_Decision. The three family groups and the two permission levels take
  the same stem: GOV Programme Leads (previously ADOPT Program
  Governance), GOV Accountability Maintainers, GOV Request Handlers, GOV
  Submit Only and GOV Contribute No Delete. Each entity, group and level
  carries renamed_from, and previous_prefixes lists the two stems the live
  site holds (no list prefix, and ADOPT on the groups and levels), so the
  redeploy renames every list, group and level in place by its previous
  name and keeps rows, views, lookups, permissions, group membership and
  level assignments; a list URL keeps the slug it was created with. A
  previous name whose description does not carry this family's provenance
  marker for that name blocks the assessment and the preflight rather than
  being adopted.

  2.0.0 also makes the request list the request surface. TenantRequest
  becomes ServiceRequest and its row carries the whole lifecycle: Status
  gains In progress and Waiting on requester, AssignedTo names the handler,
  and MinutesSpent is the running total of handler effort, required at
  Closed and totalled on the Closed view. A third family group, GOV
  Request Handlers, holds Contribute No Delete on the list. Party becomes
  Stakeholder throughout: PartyKind becomes StakeholderKind on Stakeholder,
  Party becomes Stakeholder on Involvement, and every description, rule
  message and form header is in a plainer register, with the rule for
  choosing a person column over a stakeholder row stated on the forms.

  The migration, in this order. 1) Paste assess.js.txt and read the rename
  findings, one per list under rename:<title> and one per group and level
  under their equivalents: every previous name adopted under its new one,
  none blocked. 2) Paste deploy.js.txt, which renames the lists, groups
  and levels, creates the new columns and migrates the views, then
  verify.js.txt. 3) On each GOV_Stakeholder row copy Party Kind into
  Stakeholder Kind, and on each GOV_Involvement row set Stakeholder from
  the old Party value; both columns sit on the same edit form until step
  4. Stakeholder is required, so an Involvement row cannot be saved again
  until it is set. 4) Run columns-script on GOV_Action
  (RelatedTenantRequest), GOV_Stakeholder (PartyKind), GOV_Involvement
  (Party), GOV_Activity (DecisionRule) and GOV_ServiceRequest
  (IvantiReference) to delete the superseded columns, plus anything else
  its table shows that the schema no longer declares. 5) The three
  post-deploy steps below. 30-deploy/deploy.md has the same sequence with
  the detail.

  Three post-deploy steps the deployer cannot do. Populate GOV Programme
  Leads, GOV Accountability Maintainers and GOV Request Handlers, which are
  created empty and never reconciled (a renamed group keeps the members it
  had). Disable attachments on all
  ten lists, which is the one privacy control a redeploy does not reassert.
  Check the site home page and navigation against the new list titles.

  Bump schema_version on any DBML or mapping change before redeploying.
