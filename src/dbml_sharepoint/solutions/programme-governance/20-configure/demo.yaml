    - key: dec-licence-tier-revised
      values:
        Title: "[DEMO] We will licence fifty frontline accounts and tolerate the remaining gap"
        Status: "Endorsed"
        Activity: { demo_ref: act-decide-licensing }
        Workstream: { demo_ref: ws-teams }
        SupersedesDecision: { demo_ref: dec-licence-tier }
        RaisedDate: "today-20"
        DecisionDate: "today-12"
        DecidedBy: "@me"
        DecidedByForum: { demo_ref: stakeholder-steering }
        ResolutionSought: "Demo row. That the fifty-account uplift be funded from the contingency line without waiting for the next steering group."
        DecisionOutcome: "Demo row. The sponsor agreed it under delegation on the day it was asked, and the steering group endorsed it at the following meeting."
        Detail: "Demo row. This supersedes the narrower external-calls-only decision, authorises the fifty-account request, and tolerates the remaining unfunded gap until the next budget review."
    # The two-stage route: a working group recommends, the steering group
    # decides. Nothing at save checks that the deciding forum was entitled to
    # decide; the reconciliation reads these two columns against the activity.
    - key: dec-fax-cutover
      values:
        Title: "[DEMO] We will switch off the fax gateway after two clean weeks"
        Status: "Approved"
        Workstream: { demo_ref: ws-legacy }
        RaisedDate: "today-15"
        DecisionDate: "today-5"
        RecommendedByForum: { demo_ref: stakeholder-fax-forum }
        DecidedByForum: { demo_ref: stakeholder-steering }
        ResolutionSought: "Demo row. That the gateway be switched off once two consecutive weeks pass with no inbound fax traffic."
        DecisionOutcome: "Demo row. Approved on the working group's recommendation, with the clinical lead to confirm the two clean weeks before the switch."
        Detail: "Demo row. No standing activity, because the maintaining activity is retired. Decided by the steering group rather than by one person, which is why Decided By is blank and both forums are named instead."
        EndorsementRoute: "Demo row. Endorsed by the clinical lead at the fax working group (today-20, working-group minutes) and by the chair at the steering group (today-5, steering decision register). No stakeholder declined; neither response was chased further."
