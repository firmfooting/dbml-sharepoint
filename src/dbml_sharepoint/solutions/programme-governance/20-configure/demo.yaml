  Decision:
    - key: dec-one-site
      values:
        Title: "[DEMO] We will run the whole programme from one SharePoint site"
        Status: "Approved"
        Activity: { demo_ref: act-chair-steering }
        RaisedDate: "today-100"
        DecisionDate: "today-90"
        DecidedBy: "@me"
        DecidedByForum: { demo_ref: stakeholder-steering }
        ResolutionSought: "Demo row. That the steering group approve a single site for the whole programme rather than a site per workstream."
        DecisionOutcome: "Demo row. Approved as proposed, with a review at the end of the migration workstream."
        Detail: "Demo row. Programme-wide, so no workstream is set. The alternative was a site per workstream, which would have meant no cross-workstream view of risk, no single accountability register, and five sets of permissions to keep in step."
    - key: dec-request-surface
      values:
