# Demo rows for the programme-governance family.
#
# Split out of mapping.yaml because NOTHING IN THE DEPLOY READS IT. The
# generated deploy, rollback, assess and verify scripts never see these rows;
# only `build --seed` does, when it writes demo-data.js.txt. The seam is what
# consumes a section, not how long it is, the same rule reporting.yaml
# follows.
#
# mapping.yaml points here with `demo_source:`, and may not declare
# `demo_items` itself.

demo_items:
  # Six processes covering every member of every formatted column, so each
  # renders at least once and each declared view returns rows. The subjects
  # are the ones this register was built for: the project-adjacent processes
  # around identity, Teams and guests.
  BusinessProcess:
    - key: process-offboard
      values:
        Title: "[DEMO] Offboard a leaver"
        Function: "People and culture"
        Owner: "@me"
        Workstream: "ws-security"
        Purpose: "Demo row. Removes a departing person's access, reclaims their licences and decides what happens to the files they owned."
        Criticality: "High"
        Frequency: "Daily or weekly"
        MappingPriority: "Now"
        MappingStatus: "Mapping"
        Notes: "Demo row. Four teams act and none of them can name the order. A leaver kept mailbox access for three weeks in March because nobody owned the step after HR closed the record."
        Stakeholders: [{ demo_ref: stakeholder-digital-director }, { demo_ref: stakeholder-privacy }]
        LastReviewedDate: "today-40"
    - key: process-onboard
      values:
        Title: "[DEMO] Onboard a new starter"
        Function: "People and culture"
        Workstream: "ws-security"
        Purpose: "Demo row. Everything between an accepted offer and a person who can do their job on day one."
        Criticality: "High"
        Frequency: "Daily or weekly"
        MappingPriority: "Now"
        MappingStatus: "Ready to map"
        Notes: "Demo row. Owner deliberately blank: HR, IT and facilities each own a part and nobody owns the whole, which is the finding rather than a gap to fill in."
        Stakeholders: [{ demo_ref: stakeholder-champions }]
        LastReviewedDate: "today-30"
    - key: process-guest
      values:
        Title: "[DEMO] Grant a guest access to a Team"
        Function: "Digital"
        Owner: "@me"
        Workstream: "ws-security"
        Purpose: "Demo row. Lets somebody outside the organisation into a Team, and decides who approves it and when it lapses."
        Criticality: "High"
        Frequency: "Monthly"
        MappingPriority: "Now"
        PriorityNote: "Demo row. Scores 6, called Now: the security workstream cannot finish its guest-access policy until this is mapped."
        MappingStatus: "Ready to map"
        Notes: "Demo row. Currently a request by email to whoever is around. No expiry, so guests accumulate."
        LastReviewedDate: "today-60"
    - key: process-create-team
      values:
        Title: "[DEMO] Create a Team"
        Function: "Digital"
        Owner: "@me"
        Workstream: "ws-teams"
        Purpose: "Demo row. Takes a request for a new Team through naming, ownership, membership and the sensitivity label it carries."
        Criticality: "Medium"
        Frequency: "Daily or weekly"
        MappingPriority: "Next"
        MappingStatus: "Identified"
        Notes: "Demo row. Runs often enough that a map pays back quickly, but it mostly works today, so it waits behind the two that do not."
    - key: process-shared-mailbox
      values:
        Title: "[DEMO] Request a shared mailbox"
        Function: "Digital"
        Owner: "@me"
        Workstream: "ws-legacy"
        Purpose: "Demo row. Creates a shared mailbox, names its owner and grants the people who need to send from it."
        Criticality: "Medium"
        Frequency: "Monthly"
        MappingPriority: "Later"
        MappingStatus: "Mapped"
        MapUrl: "https://example.com/process-maps/demo-shared-mailbox"
        Notes: "Demo row. Mapped in March. The review date is long past and reads plain rather than red, because a mapped process is settled."
        LastReviewedDate: "today-200"
    - key: process-mobile
      values:
        Title: "[DEMO] Order a mobile phone"
        Function: "Corporate services"
        Owner: "@me"
        Purpose: "Demo row. Orders a handset and a plan against the directorate budget."
        Criticality: "Low"
        Frequency: "A few times a year"
        MappingPriority: "Later"
        MappingStatus: "Out of scope"
        Notes: "Demo row. Considered and ruled out: it touches no M365 surface the project is changing. Kept so the same question is not asked again in six months. No workstream, so it lands in the blank group under By workstream."
        LastReviewedDate: "today-15"

  Workstream:
    - key: ws-migration
      values:
        Title: "[DEMO] Move shared drives to SharePoint and OneDrive"
        Purpose: "Demo row. Retire the two remaining file servers, moving each directorate's working files to SharePoint and personal files to OneDrive."
        Phase: "Rollout"
        Sequence: 1
        StartDate: "today-200"
        TargetEndDate: "today+60"
    - key: ws-teams
      values:
        Title: "[DEMO] Move telephony and meetings to Teams"
        Purpose: "Demo row. Replace the desk phone estate and the legacy conferencing bridge with Teams calling and Teams meetings."
        Phase: "Pilot"
        Sequence: 2
        StartDate: "today-120"
        TargetEndDate: "today+120"
    - key: ws-security
      values:
        Title: "[DEMO] Baseline identity and device security"
        Purpose: "Demo row. Bring conditional access, device compliance and privileged access to the agreed baseline before any workload carries clinical content."
        Phase: "Discovery"
        Sequence: 3
        StartDate: "today-40"
        TargetEndDate: "today+200"
    - key: ws-power
      values:
        Title: "[DEMO] Retire the departmental databases onto Power Platform"
        Purpose: "Demo row. Replace the eleven surviving desktop databases with governed Power Platform apps in a managed environment."
        Phase: "Not started"
        Sequence: 4
        TargetEndDate: "today+300"
    - key: ws-comms
      values:
        Title: "[DEMO] Replace the intranet with Viva Connections"
        Purpose: "Demo row. Move the intranet to a modern communication site and give the champions network somewhere to publish."
        Phase: "Embedding"
        Sequence: 5
        StartDate: "today-300"
        TargetEndDate: "today+30"
    - key: ws-legacy
      values:
        Title: "[DEMO] Decommission the fax gateway"
        Purpose: "Demo row. Move the last referral and pathology routes off the fax gateway and switch it off."
        Phase: "Closed"
        Sequence: 6
        StartDate: "today-400"
        TargetEndDate: "today-30"
        ClosureNote: "Demo row. All six routes moved to secure email, the gateway was switched off after two clean weeks, and the contract was not renewed."
  Stakeholder:
    - key: stakeholder-provider
      values:
        Title: "[DEMO] Shared services provider service desk"
        StakeholderKind: "External"
        ExternalContactDetails: "servicedesk@provider.example"
        Status: "Active"
        Notes: "Demo row. Every tenant-level change reaches the provider as a service request on this site. The provider is never Accountable for a programme activity."
    - key: stakeholder-steering
      values:
        Title: "[DEMO] Adoption steering group"
        StakeholderKind: "Forum"
        Status: "Active"
        Notes: "Demo row. Meets monthly. Owns the programme's decisions and is the escalation route for anything the workstreams cannot settle."
    - key: stakeholder-digital-director
      values:
        Title: "[DEMO] Director of Digital"
        StakeholderKind: "Role"
        Contact: "@me"
        Status: "Active"
        Notes: "Demo row. Level 2 escalation for a stalled service request."
    - key: stakeholder-privacy
      values:
        Title: "[DEMO] Privacy officer"
        StakeholderKind: "Role"
        Contact: "@me"
        Status: "Active"
        Notes: "Demo row. Consulted on anything that moves personal data or changes who can read it."
    - key: stakeholder-champions
      values:
        Title: "[DEMO] Champions network"
        StakeholderKind: "Forum"
        Status: "Active"
        Notes: "Demo row. Roughly forty people across the directorates. Coverage itself is tracked elsewhere, not here."
    - key: stakeholder-clinical-lead
      values:
        Title: "[DEMO] Clinical informatics lead"
        StakeholderKind: "Individual"
        Contact: "@me"
        Status: "Active"
        Notes: "Demo row. The named clinical voice on anything that touches a care setting."
    - key: stakeholder-fax-forum
      values:
        Title: "[DEMO] Fax decommissioning working group"
        StakeholderKind: "Forum"
        Status: "Inactive"
        Notes: "Demo row. Disbanded when the gateway was switched off. Kept so anybody looking for who used to own this can see it, and see that it stopped."
  Activity:
    - key: act-lead-migration
      values:
        Title: "[DEMO] Lead the shared drive migration workstream"
        Workstream: { demo_ref: ws-migration }
        ActivityKind: "Task"
        ActivityRole: "Workstream lead"
        Criticality: "High"
        Detail: "Demo row. Runs the migration workstream: sequencing directorates, holding the cutover dates and reporting to the steering group."
        Responsible: "@me"
        Accountable: "@me"
        AccountableForum: { demo_ref: stakeholder-steering }
        EscalationRoute: "The adoption steering group at its next monthly sitting; urgent cases to the Director of Digital."
        ReviewStatus: "Current"
        LastConfirmed: "today-30"
        ConfirmedBy: "@me"
    - key: act-lead-teams
      values:
        Title: "[DEMO] Lead the Teams telephony workstream"
        Workstream: { demo_ref: ws-teams }
        ActivityKind: "Task"
        ActivityRole: "Workstream lead"
        Criticality: "High"
        Detail: "Demo row. Runs the telephony workstream, including the number port and the desk phone retirement schedule."
        Responsible: "@me"
        Accountable: "@me"
        AccountableForum: { demo_ref: stakeholder-steering }
        EscalationRoute: "The adoption steering group; anything contractual with the carrier goes to the Director of Digital."
        ReviewStatus: "Current"
        LastConfirmed: "today-60"
        ConfirmedBy: "@me"
    - key: act-unconfirmed
      values:
        Title: "[DEMO] A newly listed activity nobody has confirmed yet"
        Workstream: { demo_ref: ws-security }
        ActivityKind: "Task"
        ActivityRole: "Workstream deputy"
        Criticality: "Routine"
        Detail: "Demo row. Brand new, so the first confirmation has not happened. The blank Confirmed By is what the Never confirmed view exists to catch."
        Responsible: "@me"
        Accountable: "@me"
        EscalationRoute: "The workstream lead."
        ReviewStatus: "Current"
    - key: act-deputy-security
      values:
        Title: "[DEMO] Deputise for the identity and device security workstream"
        Workstream: { demo_ref: ws-security }
        ActivityKind: "Task"
        ActivityRole: "Workstream deputy"
        Criticality: "Routine"
        Detail: "Demo row. Covers the security workstream when its lead is unavailable, with the same standing authority for the duration."
        Responsible: "@me"
        Accountable: "@me"
        EscalationRoute: "The workstream lead on return, or the Director of Digital if the decision cannot wait."
        ReviewStatus: "Current"
        LastConfirmed: "today-700"
        ConfirmedBy: "@me"
    - key: act-chair-steering
      values:
        Title: "[DEMO] Chair the adoption steering group"
        ActivityKind: "Task"
        ActivityRole: "Program owner"
        Criticality: "High"
        Detail: "Demo row. Programme-wide, so it carries no workstream. Sets the agenda, holds the decision log and is accountable for the programme as a whole."
        Responsible: "@me"
        Accountable: "@me"
        AccountableForum: { demo_ref: stakeholder-steering }
        EscalationRoute: "The programme sponsor, then the executive."
        ReviewStatus: "Current"
        LastConfirmed: "today-200"
        ConfirmedBy: "@me"
    # Statutory, so the cadence is 6 months and today-400 is well past due.
    # Drives the row wash, the overdue ConfirmationDue cell, the "Needs
    # review" view and the severe Criticality token all at once.
    - key: act-approve-tenant-change
      values:
        Title: "[DEMO] Approve a tenant-level configuration change"
        Workstream: { demo_ref: ws-security }
        ActivityKind: "Approval"
        Criticality: "Statutory"
        Detail: "Demo row. Internal authorisation for any change to a tenant-wide setting, before a handler at the provider picks it up. Does not cover changes inside a single site."
        Responsible: "@me"
        Accountable: "@me"
        AccountableForum: { demo_ref: stakeholder-steering }
        EscalationRoute: "The adoption steering group; a refusal the workstream disputes goes to the Director of Digital."
        DecisionRoute: { demo_ref: stakeholder-steering }
        ReviewStatus: "Needs review"
        LastConfirmed: "today-400"
        ConfirmedBy: "@me"
    - key: act-decide-licensing
      values:
        Title: "[DEMO] Decide the licensing model for frontline staff"
        ActivityKind: "Decision"
        Criticality: "High"
        Detail: "Demo row. Which frontline roles are uplifted, and which stay on the base entitlement. Programme-wide, because the budget is."
        Responsible: "@me"
        Accountable: "@me"
        AccountableForum: { demo_ref: stakeholder-steering }
        EscalationRoute: "The programme sponsor, who holds the budget line, at the next steering group."
        DecisionRoute: { demo_ref: stakeholder-steering }
        ReviewStatus: "Current"
        LastConfirmed: "today-200"
        ConfirmedBy: "@me"
    - key: act-privacy-review
      values:
        Title: "[DEMO] Review adoption communications before they are published"
        Workstream: { demo_ref: ws-comms }
        ActivityKind: "Task"
        Criticality: "Routine"
        Detail: "Demo row. Reads each pack for anything identifiable before it goes on the intranet. Ordinary work with no standing position, so it needs no escalation route."
        Responsible: "@me"
        Accountable: "@me"
        ReviewStatus: "Current"
        LastConfirmed: "today-60"
        ConfirmedBy: "@me"
    - key: act-retired-fax
      values:
        Title: "[DEMO] Maintain the fax gateway routing table"
        Workstream: { demo_ref: ws-legacy }
        ActivityKind: "Task"
        Criticality: "Routine"
        Detail: "Demo row. Retired when the gateway was switched off. Kept so that anybody looking for who used to do this can see it, and see that it stopped."
        Responsible: "@me"
        Accountable: "@me"
        ReviewStatus: "Retired"
        LastConfirmed: "today-500"
        ConfirmedBy: "@me"
  Involvement:
    - key: inv-privacy-tenant
      values:
        Title: "[DEMO] Whether the change moves personal data outside its current boundary"
        Activity: { demo_ref: act-approve-tenant-change }
        Stakeholder: { demo_ref: stakeholder-privacy }
        Involvement: "Consulted"
        EngagementStatus: "Engaged"
        Channel: "Email"
        Notes: "Demo row. Must be asked before the request is authorised, not after the provider has built it."
    - key: inv-provider-tenant
      values:
        Title: "[DEMO] Whether the change can be delivered inside the requested window"
        Activity: { demo_ref: act-approve-tenant-change }
        Stakeholder: { demo_ref: stakeholder-provider }
        Involvement: "Consulted"
        EngagementStatus: "Engaged"
        Channel: "Ad hoc"
        Notes: "Demo row. Asked on the service request itself. The provider is consulted here and is never Accountable."
    - key: inv-steering-licensing
      values:
        Title: "[DEMO] Whether the licensing model fits the funded establishment"
        Activity: { demo_ref: act-decide-licensing }
        Stakeholder: { demo_ref: stakeholder-steering }
        Involvement: "Consulted"
        EngagementStatus: "Engaged"
        Channel: "Standing agenda item"
        Notes: "Demo row. The steering group is consulted on the model and the sponsor decides the budget."
    - key: inv-champions-migration
      values:
        Title: "[DEMO] What frontline teams will need on the day their drives move"
        Activity: { demo_ref: act-lead-migration }
        Stakeholder: { demo_ref: stakeholder-champions }
        Involvement: "Consulted"
        EngagementStatus: "Engaged"
        Channel: "Meeting"
        Notes: "Demo row. The champions are the only people who know what each team actually opens first thing in the morning."
    - key: inv-clinical-cutover
      values:
        Title: "[DEMO] When the migration cutover date for each care setting is fixed"
        Activity: { demo_ref: act-lead-migration }
        Stakeholder: { demo_ref: stakeholder-clinical-lead }
        Involvement: "Informed"
        EngagementStatus: "Engaged"
        Channel: "Report or dashboard"
        Notes: "Demo row. Told, not asked: the date is set by the workstream and the clinical lead needs to know it."
    - key: inv-privacy-comms
      values:
        Title: "[DEMO] Whether a communications pack names any individual"
        Activity: { demo_ref: act-privacy-review }
        Stakeholder: { demo_ref: stakeholder-privacy }
        Involvement: "Consulted"
        EngagementStatus: "Engaged"
        Channel: "Email"
        Notes: "Demo row. The second row consulting the privacy officer, which is what the Consultation load view exists to surface."
    - key: inv-director-tenant
      values:
        Title: "[DEMO] Whether a tenant-wide setting may change at all this quarter"
        Activity: { demo_ref: act-approve-tenant-change }
        Stakeholder: { demo_ref: stakeholder-digital-director }
        Involvement: "Agree"
        EngagementStatus: "Engaged"
        Channel: "Standing agenda item"
        Notes: "Demo row. The only Agree here: the approval does not proceed without it, which is the difference from the two Consulted rows on the same activity."
    - key: inv-clinical-licensing
      values:
        Title: "[DEMO] Whether the licensing model leaves clinical systems short"
        Activity: { demo_ref: act-decide-licensing }
        Stakeholder: { demo_ref: stakeholder-clinical-lead }
        Involvement: "Agree"
        EngagementStatus: "Identified"
        Channel: "Meeting"
        Notes: "Demo row, and the reason Engagement Status is its own column. The licensing decision does not proceed without this sign-off, and nobody has approached them yet. Read the two columns together: high authority, no contact."
    - key: inv-steering-migration
      values:
        Title: "[DEMO] Whether the cutover sequence fits the board's reporting cycle"
        Activity: { demo_ref: act-lead-migration }
        Stakeholder: { demo_ref: stakeholder-steering }
        Involvement: "Consulted"
        EngagementStatus: "Scheduled"
        NextContact: "today+14"
        Channel: "Standing agenda item"
        Notes: "Demo row. Identified, a date set, not yet held. Both this row and the one above it are what the Identified, not yet engaged view lists."

  ServiceRequest:
    - key: tr-guest-access
      values:
        Title: "[DEMO] Enable guest access on the migration collaboration sites"
        Workstream: { demo_ref: ws-migration }
        RequestType: "Tenant-wide setting"
        Justification: "Demo row. Two directorates share working files with an external partner. Without guest access the files are emailed instead, which is the outcome the migration exists to stop."
        RequestedBy: "@me"
        InternalAccountable: "@me"
        Status: "In progress"
        AuthorisedBy: "@me"
        AuthorisedDate: "today-20"
        AssignedTo: "@me"
        MinutesSpent: 45
        NeededBy: "today+7"
    - key: tr-conditional-access
      values:
        Title: "[DEMO] Add the frontline device group to the conditional access policy"
        Workstream: { demo_ref: ws-security }
        RequestType: "Conditional access policy"
        Justification: "Demo row. The frontline devices are outside the current policy scope, so the security baseline cannot be signed off while they are excluded."
        RequestedBy: "@me"
        InternalAccountable: "@me"
        Status: "Waiting on requester"
        AuthorisedBy: "@me"
        AuthorisedDate: "today-45"
        AssignedTo: "@me"
        MinutesSpent: 130
        NeededBy: "today-5"
        EscalationLevel: "3 Contractual"
        EscalatedDate: "today-4"
        EscalatedBy: "@me"
        EscalatedTo: "Provider account lead"
    - key: tr-power-environment
      values:
        Title: "[DEMO] Create a managed Power Platform environment for the programme"
        Workstream: { demo_ref: ws-power }
        RequestType: "Power Platform environment"
        Justification: "Demo row. The departmental databases cannot be rebuilt in the default environment, which has no data loss prevention policy of its own."
        RequestedBy: "@me"
        InternalAccountable: "@me"
        Status: "Authorised"
        AuthorisedBy: "@me"
        AuthorisedDate: "today-3"
        NeededBy: "today+40"
    - key: tr-licence-uplift
      values:
        Title: "[DEMO] Uplift fifty frontline accounts to a licence including Teams Phone"
        Workstream: { demo_ref: ws-teams }
        RequestType: "Licensing"
        Justification: "Demo row. Fifty staff answer external calls on a desk phone that is being removed. Without the uplift the telephony pilot cannot extend past the pilot group."
        RequestedBy: "@me"
        InternalAccountable: "@me"
        Status: "Authorised"
        AuthorisedBy: "@me"
        AuthorisedDate: "today-9"
        AuthorisingDecision: { demo_ref: dec-licence-tier-revised }
        NeededBy: "today+10"
    - key: tr-entra-group
      values:
        Title: "[DEMO] Create an Entra group for the champions network"
        Workstream: { demo_ref: ws-comms }
        RequestType: "Entra group"
        Justification: "Demo row. The champions are currently maintained as a distribution list nobody owns, so a leaver stays on it indefinitely."
        RequestedBy: "@me"
        InternalAccountable: "@me"
        Status: "Drafted"
        NeededBy: "today+25"
    - key: tr-dlp-exemption
      values:
        Title: "[DEMO] Allow the programme channel to share files with the provider"
        Workstream: { demo_ref: ws-security }
        RequestType: "DLP policy"
        Justification: "Demo row. The outbound policy blocks the migration evidence pack, so the evidence is being sent to the provider one screenshot at a time."
        RequestedBy: "@me"
        InternalAccountable: "@me"
        Status: "Closed"
        AuthorisedBy: "@me"
        AuthorisedDate: "today-120"
        AssignedTo: "@me"
        MinutesSpent: 210
        NeededBy: "today-90"
        EscalationLevel: "1 Program"
        EscalatedDate: "today-100"
        EscalatedBy: "@me"
        EscalatedTo: "Provider service desk lead"
    - key: tr-telemetry
      values:
        Title: "[DEMO] Grant read access to the tenant adoption telemetry"
        Workstream: { demo_ref: ws-comms }
        RequestType: "Reporting or telemetry access"
        Justification: "Demo row. Withdrawn after the provider offered the same figures through the existing Power BI report, so no new access was needed."
        RequestedBy: "@me"
        InternalAccountable: "@me"
        Status: "Withdrawn"
        NeededBy: "today-30"
  Risk:
    - key: risk-provider-lead-time
      values:
        Title: "[DEMO] Provider lead times push the security baseline past its funding deadline"
        Workstream: { demo_ref: ws-security }
        Detail: "Demo row. Two of the three baseline changes are tenant-level and none of them is inside the health service's control. The funding milestone is not moveable."
        Likelihood: "Almost Certain"
        Consequence: "Business Critical"
        RiskOwner: "@me"
        RiskResponse: "Manage"
        Status: "Open"
        LastReviewedDate: "today-110"
    - key: risk-adoption
      values:
        Title: "[DEMO] Frontline teams keep using the shared drives after cutover"
        Workstream: { demo_ref: ws-migration }
        Detail: "Demo row. The benefit case depends on the new location being used, not installed. Nothing about a cutover makes people change where they save."
        Likelihood: "Very Likely"
        Consequence: "Substantial"
        RiskOwner: "@me"
        RiskResponse: "Manage"
        Status: "Open"
        LastReviewedDate: "today-85"
    - key: risk-licensing
      values:
        Title: "[DEMO] The licensing uplift is not funded for the whole frontline"
        Workstream: { demo_ref: ws-teams }
        Detail: "Demo row. The pilot group is funded from the programme budget. Extending to every frontline role needs a recurrent line nobody has committed."
        Likelihood: "Likely"
        Consequence: "Major"
        RiskOwner: "@me"
        RiskResponse: "Tolerate"
        ToleranceDecision: { demo_ref: dec-licence-tier-revised }
        Status: "Open"
        LastReviewedDate: "today-15"
    - key: risk-champion-churn
      values:
        Title: "[DEMO] The champions network loses its most active members"
        Workstream: { demo_ref: ws-comms }
        Detail: "Demo row. Roughly a third of the network does the visible work, and none of it is in anybody's job description."
        Likelihood: "Unlikely"
        Consequence: "Moderate"
        RiskOwner: "@me"
        RiskResponse: "Accept"
        Status: "Open"
        LastReviewedDate: "today-30"
    - key: risk-identity
      values:
        Title: "[DEMO] Conditional access locks staff out of unmanaged devices at go-live"
        Workstream: { demo_ref: ws-security }
        Detail: "Demo row. The policy is correct and the device inventory may not be. A wrong inventory reads to a member of staff as an outage."
        Likelihood: "Likely"
        Consequence: "Substantial"
        RiskOwner: "@me"
        RiskResponse: "Manage"
        Status: "Open"
        LastReviewedDate: "today-9"
    - key: risk-fax
      values:
        Title: "[DEMO] The fax gateway is switched off before its replacement is proven"
        Workstream: { demo_ref: ws-legacy }
        Detail: "Demo row. Referral routes were the last thing on the gateway, and a lost referral is a clinical event rather than an inconvenience."
        Likelihood: "Rare"
        Consequence: "Moderate"
        RiskOwner: "@me"
        RiskResponse: "Terminate"
        Status: "Closed"
        LastReviewedDate: "today-20"
        ClosureNote: "Demo row. Every route was moved and monitored for two clean weeks before the gateway was switched off, and the two clinics still sending were contacted individually. The risk can no longer happen."
  Action:
    - key: act-rehearse-migration
      values:
        Title: "[DEMO] Rehearse the migration on a copy of one directorate's files"
        Workstream: { demo_ref: ws-migration }
        AssignedTo: "@me"
        DueDate: "today+7"
        Status: "Open"
        RelatedRisk: { demo_ref: risk-adoption }
        RelatedIssue: { demo_ref: iss-mapped-drives }
        Notes: "Demo row. The whole of the migration risk response. Until this is done the rating does not move."
    - key: act-chase-guest-access
      values:
        Title: "[DEMO] Chase the guest access request with its handler"
        Workstream: { demo_ref: ws-migration }
        AssignedTo: "@me"
        DueDate: "today-6"
        Status: "Open"
        RelatedServiceRequest: { demo_ref: tr-guest-access }
        Notes: "Demo row. Overdue and still Open. Its date is red everywhere it appears, and it names the request that is blocking it rather than describing it in prose."
