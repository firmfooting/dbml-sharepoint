        Stakeholder: { demo_ref: stakeholder-privacy }
        Involvement: "Consulted"
        EngagementStatus: "Engaged"
        Channel: "Email"
        Lead: "@me"
        ContactDate: "today-7"
        EngagementPlan: "Ask the privacy officer to review the proposed data boundary before authorisation."
        Notes: "The privacy officer confirmed the proposed boundary and requested a check before implementation."
    - key: inv-provider-tenant
      values:
