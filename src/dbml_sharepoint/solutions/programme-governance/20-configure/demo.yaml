        Status: "Approved"
        RaisedDate: "today-70"
        DecisionDate: "today-60"
        DecidedBy: "@me"
        Detail: "Demo row. No standing activity, and the blank is deliberate: this was settled in the programme's first fortnight, before the accountability register existed. One request lifecycle on one row, with its handler and the minutes spent on it, beats a second record kept by hand beside somebody else's queue."
