# Programme governance: physical mapping. Ten lists on one site, merging a
# programme delivery layer (raid-log) with a standing accountability layer
# (raci-matrix) and a service request queue for tenant-level change.
# GOV names what the lists are, governance, which is the level the other
# families name at (RR, RACI, RAID), rather than the programme instance.
# Groups and levels take the stem through the {prefix} placeholder.
prefix: "GOV_"
# The live site was provisioned with no list prefix while its groups and
# levels were typed under ADOPT, so both stems are previous ones: each list
# is renamed in place from its bare title, each group and level from its
# ADOPT name.
previous_prefixes: ["", "ADOPT_"]

entities:
  Workstream:     { kind: List, base_template: 100, site_role: default }
  # renamed_from reaches back to the titles on the live site, which was
  # provisioned unprefixed from a pre-1.1.0 copy, so one redeploy renames
  # each list in place instead of creating a second one beside it.
  Stakeholder:    { kind: List, base_template: 100, site_role: default,
                    renamed_from: [ProgramStakeholders, ProgramParty] }
  Activity:       { kind: List, base_template: 100, site_role: default,
                    renamed_from: [ProgramActivity] }
  Involvement:    { kind: List, base_template: 100, site_role: default,
                    renamed_from: [ProgramInvolvement] }
  ServiceRequest: { kind: List, base_template: 100, site_role: default,
                    renamed_from: [TenantRequest] }
  # The RelatedRisk picker shows LiveRiskTitle, which is calculated and so
  # cannot be indexed. raid-log's trade, taken for the same reason.
  Risk:           { kind: List, base_template: 100, site_role: default,
                    display_column: LiveRiskTitle,
                    accept_unindexable_display_column: true,
                    renamed_from: [ProgramRisk] }
  Action:         { kind: List, base_template: 100, site_role: default,
                    renamed_from: [ProgramAction] }
  Issue:          { kind: List, base_template: 100, site_role: default,
                    renamed_from: [ProgramIssue] }
  # Same trade again, for the same reason: every picker onto the decision log
  # shows LiveDecisionTitle, so a proposal nobody approved cannot be cited as
  # authority. A lookup picker cannot be filtered, and a calculated column
  # cannot be indexed.
  Decision:       { kind: List, base_template: 100, site_role: default,
                    display_column: LiveDecisionTitle,
                    accept_unindexable_display_column: true,
                    renamed_from: [ProgramDecision] }
  # New in 2.1.0, so no renamed_from: no site was ever provisioned with it.
  BusinessProcess: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

# The reporting pack carries Created By, Created, Modified By and Modified
# on every list, and a _Users dimension every person column joins.
# 50-govern/reporting-joins.md reads both: "an edit is not a confirmation"
# is LastConfirmed against Modified, and the RACI counts by person need
# department and job title from the user list.
reporting:
  system_columns: true
  users_table: true

# 200 on the three accountability lists because version history is this
# family's audit for self-service confirmation: anyone named Responsible or
# Accountable may correct their own row, and the quarterly review reads the
# history of every row changed since the last one. raci-matrix's number.
versioning:
  default:
    enable_versioning: true
    major_version_limit: 100
    enable_minor_versions: false
  overrides:
    Activity:    { major_version_limit: 200 }
    Stakeholder:       { major_version_limit: 200 }
    Involvement: { major_version_limit: 200 }

enum_sources: {}

# Every (entity, column) pair the four phase-2 flows bind to, declared now,
# while no flow exists. Power Automate binds by INTERNAL name, so a rename is
# a new column to the deployer: the old one becomes undeclared drift, the new
# one is empty, and the flow keeps running and reads nothing. Declared here, a
# rename leaves an entry naming a column that no longer renders and the build
# fails with watched_column_not_rendered.
#
# Display titles are changed through display_names.overrides instead, which
# leaves the internal name alone.
#
# Flow A (Monday digest) reads Action and Activity; B (request
# recorded) and C (stalled request queue) read ServiceRequest; D (severe issue)
# reads and stamps Issue.
watched_lists:
  - { entity: Action, column: Title }
  - { entity: Action, column: Workstream }
  - { entity: Action, column: AssignedTo }
  - { entity: Action, column: DueDate }
  - { entity: Action, column: Status }
  - { entity: Activity, column: Title }
  # Not in flow A's read list, but in its payload ("title, due or confirmation
  # date, workstream, and a link"), so the flow binds it.
  - { entity: Activity, column: Workstream }
  - { entity: Activity, column: Responsible }
  - { entity: Activity, column: Accountable }
  - { entity: Activity, column: Criticality }
  - { entity: Activity, column: ReviewStatus }
  - { entity: Activity, column: ConfirmationDue }
  - { entity: ServiceRequest, column: Title }
  - { entity: ServiceRequest, column: Workstream }
  - { entity: ServiceRequest, column: RequestType }
  - { entity: ServiceRequest, column: RequestedBy }
  - { entity: ServiceRequest, column: InternalAccountable }
  - { entity: ServiceRequest, column: Status }
  - { entity: ServiceRequest, column: NeededBy }
  # Flow C reads who holds a stalled request, so it binds the handler.
  - { entity: ServiceRequest, column: AssignedTo }
  - { entity: ServiceRequest, column: EscalationLevel }
  - { entity: Issue, column: Title }
  - { entity: Issue, column: Workstream }
  - { entity: Issue, column: Owner }
  - { entity: Issue, column: Severity }
  # The guard on flow D's created-or-modified trigger. Machine-owned, hidden
  # from both forms, and rendered only because a watched column must be.
  - { entity: Issue, column: NotifiedAt }

# The 5x5 matrix, carried from raid-log unchanged (rows = likelihood
# Rare..Almost Certain; columns = consequence Minor..Business Critical):
#
#                 Minor   Moderate  Substantial  Major    Business Critical
#  Rare           Low     Low       Low          Medium   Medium
#  Unlikely       Low     Low       Medium       Medium   High
#  Likely         Low     Medium    Medium       High     High
#  Very Likely    Medium  Medium    High         High     Extreme
#  Almost Certain Medium  High      High         Extreme  Extreme
#
# RiskScore is the matrix score 1-25, for sorting. Both formulas are keyed to
# EXACTLY the five Likelihood and five Consequence members in the schema, in
# that order: the nested IFs map the first four by name and treat everything
# else as the fifth, so an added, renamed or reordered member silently rates as
# the worst case rather than failing. The matrix is 5x5, so changing the enums
# means rewriting the 25 cells anyway.
#
# ConfirmationDue carries raci-matrix's known month-end overflow (its issue
# #5): DATE(YEAR(d), MONTH(d)+N, DAY(d)) overflows rather than clamping, so a
# confirmation recorded on 31 August falls due on 3 March rather than 28
# February. Not fixed here on purpose. Fixing it in one of three families that
# share the formula forks a defect that should be fixed once, upstream.
calculated_formulas:
  # Criticality x frequency, on process-register's 1-to-9 shape but NOT its
  # factors. That register scores what to digitise, where pain is the driver;
  # this one scores what to map, where the return is per run.
  BusinessProcess:
    PriorityScore: '=IF(OR(ISBLANK([Criticality]),ISBLANK([Frequency])),"",IF([Criticality]="Low",1,IF([Criticality]="Medium",2,3))*IF([Frequency]="A few times a year",1,IF([Frequency]="Monthly",2,3)))'
  Risk:
    ResidualRiskRating: '=IF(OR(ISBLANK([Likelihood]),ISBLANK([Consequence])),"",CHOOSE((IF([Likelihood]="Rare",1,IF([Likelihood]="Unlikely",2,IF([Likelihood]="Likely",3,IF([Likelihood]="Very Likely",4,5))))-1)*5+IF([Consequence]="Minor",1,IF([Consequence]="Moderate",2,IF([Consequence]="Substantial",3,IF([Consequence]="Major",4,5)))),"Low","Low","Low","Medium","Medium","Low","Low","Medium","Medium","High","Low","Medium","Medium","High","High","Medium","Medium","High","High","Extreme","Medium","High","High","Extreme","Extreme"))'
    RiskScore: '=IF(OR(ISBLANK([Likelihood]),ISBLANK([Consequence])),"",CHOOSE((IF([Likelihood]="Rare",1,IF([Likelihood]="Unlikely",2,IF([Likelihood]="Likely",3,IF([Likelihood]="Very Likely",4,5))))-1)*5+IF([Consequence]="Minor",1,IF([Consequence]="Moderate",2,IF([Consequence]="Substantial",3,IF([Consequence]="Major",4,5)))),1,4,6,13,15,2,5,11,14,21,3,9,12,19,22,7,10,17,20,24,8,16,18,23,25))'
    # The RelatedRisk picker shows this column. Blank for Closed means the
    # picker offers only live risks: below the 5,000-item threshold a blank
    # calculated label is simply omitted from the picker.
    LiveRiskTitle: '=IF([Status]="Closed","",[Title])'
  Decision:
    # Every picker onto this list shows this column. Approved and Ratified are
    # the two states that carry authority; a Proposed, Rejected, Withdrawn or
    # Noted row is blank here and so is not offered.
    LiveDecisionTitle: '=IF(OR([Status]="Approved",[Status]="Ratified"),[Title],"")'
  Activity:
    ConfirmationDue: '=IF(OR(ISBLANK([LastConfirmed]),[ReviewStatus]="Retired"),"",DATE(YEAR([LastConfirmed]),MONTH([LastConfirmed])+IF([Criticality]="Statutory",6,IF([Criticality]="High",12,24)),DAY([LastConfirmed])))'

# Projections cost no join. Each RelatedRisk lookup projects the target's real
# Title onto the source list as a read-only dependent field
# (RelatedRiskTitle): the picker shows LiveRiskTitle, blank once a risk is
# Closed, while views show the projected Title, so a closed risk still reads
# by name.
#
# Action.Workstream projects Phase as WorkstreamPhase. A lookup picker
# cannot be filtered, so an action cannot be PREVENTED from being filed
# against a closed workstream; rendering the phase beside it makes the mistake
# visible in every action view instead. A calculated LiveWorkstreamTitle
# blanking closed workstreams was rejected: Workstream is not null on four
# lists, and a required field showing nothing on the Edit form of an old row
# reads as a bug.
#
# The four decision lookups project Title for the same reason the risk lookups
# do. The picker shows LiveDecisionTitle so only a decision that was actually
# made can be selected, while the projected Title keeps the row readable if
# that decision is later withdrawn and its live title goes blank.
lookup_projections:
  Action:
    RelatedRisk: [Title]
    Workstream: [Phase]
    AuthorisingDecision: [Title]
  Issue:
    RelatedRisk: [Title]
  ServiceRequest:
    AuthorisingDecision: [Title]
  Risk:
    ToleranceDecision: [Title]
  Decision:
    SupersedesDecision: [Title]

# Group membership is neither declared nor reconciled by the deployer, so
# populating these is a documented post-deploy step with a release-checklist
# line. require_empty_at_deploy is deliberately NOT set on any family
# group: the next deployment would reject a correctly populated group.
groups:
  - name: "{prefix} Programme Leads"
    # The live site holds this group under its old base name; the redeploy
    # renames it in place and keeps its members.
    renamed_from: ["{prefix} Program Governance"]
    description: "The programme owner, the governance lead and executive support. Contribute on every list, and the principal that authorises a service request."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  # Deliberately wide: everyone currently named Responsible or Accountable,
  # plus governance. SharePoint cannot express "edit only your own row"
  # against an arbitrary person column (its item-level setting keys on Created
  # By, and an accountability row is typically created by a maintainer, not by
  # the person it names), so the mechanism is a wide group with no delete and
  # no version pruning, and version history read quarterly as the audit.
  - name: "{prefix} Accountability Maintainers"
    description: "Everyone named Responsible or Accountable on an activity, plus governance. Confirms and corrects their own rows; cannot delete a row or prune its history."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  # The provider staff who work the requests. Contribute No Delete on
  # ServiceRequest only: a handler edits the request they hold and nothing
  # else on the site, and a deleted request is an authorisation record gone.
  - name: "{prefix} Request Handlers"
    description: "The provider staff who work service requests. Add and edit on Service Request only: assign, progress, hand back, close and record the minutes spent; no deleting."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "dbml List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: "dbml Enterprise Readers"
    description: "Read-only accounts for aggregated cross-site reporting. Empty by default; membership is operator-owned."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

# Both levels are family-prefixed so the permission-level adoption gate cannot
# collide with a level already present on the site.
#
# Submit Only is change-register's measured eight permissions, unchanged.
# Contribute No Delete is that set plus EditListItems and OpenItems, and
# is NOT itself a measured precedent: it is composed from one, and
# 50-govern/governance.md carries the two-account probe it needs.
# DeleteListItems is absent so the never-delete posture on stakeholders, decisions
# and service requests has a mechanism rather than a habit; DeleteVersions is absent
# because version history is this family's audit and an audit somebody can
# prune is not one; ManageLists is absent because it carries structural
# authority.
permission_levels:
  - name: "{prefix} Submit Only"
    description: "Record a service request and read every list; no editing, no deleting, no schema rights. Corrections to a request go through governance."
    base_permissions:
      - AddListItems
      - ViewListItems
      - ViewVersions
      - ViewFormPages
      - Open
      - ViewPages
      - BrowseUserInfo
      - UseRemoteAPIs
  - name: "{prefix} Contribute No Delete"
    description: "Add and edit items, and read version history; no deleting an item, no pruning its history, no schema rights. The audit for self-service confirmation."
    base_permissions:
      - AddListItems
      - EditListItems
      - ViewListItems
      - OpenItems
      - ViewVersions
      - ViewFormPages
      - Open
      - ViewPages
      - BrowseUserInfo
      - UseRemoteAPIs

# Five classes. The default is class B, the delivery layer, which
# Risk, Action and Issue use: everybody records, because
# an issue somebody could not type is a lost issue, and delete stays available
# because these three are the working surface.
#
# Every override below is a COMPLETE policy rather than an addition to the
# default. reconcile: exact means the ACL phase removes anything not named
# here, which is also what would silently kill a phase-2 flow granted access
# by hand.
list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "{prefix} Programme Leads" }
        level: "Contribute"
      - principal: { kind: associated_member_group }
        level: "Contribute"
      - principal: { kind: associated_owner_group }
        level: "Contribute"
      - principal: { kind: group, name: "dbml List Administrators" }
        level: "Full Control"
      - principal: { kind: group, name: "dbml Enterprise Readers" }
        level: "Read"
  overrides:
    # Class A, the spine. The programme's decomposition is a governance
    # record: phase, ordering, dates and closure are not everybody's to
    # change, and the tax is better paid at data entry than later in a
    # disputed phase status.
    Workstream:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Programme Leads" }
          level: "Contribute"
        - principal: { kind: associated_member_group }
          level: "Read"
        - principal: { kind: associated_owner_group }
          level: "Contribute"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"
    # Class D, accountability. Broad edit through the maintainer group so the
    # people a row names can confirm and correct it; no delete and no version
    # pruning, so the worst a disagreement produces is a row that changed,
    # visibly, twice.
    Activity:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Programme Leads" }
          level: "Contribute"
        - principal: { kind: group, name: "{prefix} Accountability Maintainers" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: associated_member_group }
          level: "Read"
        - principal: { kind: associated_owner_group }
          level: "Contribute"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"
    Stakeholder:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Programme Leads" }
          level: "Contribute"
        - principal: { kind: group, name: "{prefix} Accountability Maintainers" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: associated_member_group }
          level: "Read"
        - principal: { kind: associated_owner_group }
          level: "Contribute"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"
    Involvement:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Programme Leads" }
          level: "Contribute"
        - principal: { kind: group, name: "{prefix} Accountability Maintainers" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: associated_member_group }
          level: "Read"
        - principal: { kind: associated_owner_group }
          level: "Contribute"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"
    # Class E, the request surface. Anyone on the site may record a request;
    # only governance and the handlers may change one afterwards. If only the
    # programme owner could raise a request, workstream leads would route
    # around the bottleneck and the record would stop being complete. Paired
    # with the New-form visibility rules below: neither half is the control
    # on its own. Handlers hold Contribute No Delete because a request is an
    # authorisation record once governance has moved it, and Withdrawn is how
    # one ends.
    ServiceRequest:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Programme Leads" }
          level: "Contribute"
        - principal: { kind: group, name: "{prefix} Request Handlers" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: associated_member_group }
          level: "{prefix} Submit Only"
        - principal: { kind: associated_owner_group }
          level: "Contribute"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"
    # Class C, the durable record. Broad creation is kept, because a decision
    # nobody could type is a decision that gets relitigated; deletion is
    # withheld from everybody short of an administrator, because the log's
    # whole value is that it survives. Governance and the owner group hold
    # Contribute No Delete for the same reason maintainers do on
    # Activity: the people most likely to tidy the list are the ones
    # whose deletions would be hardest to notice, and a Withdrawn status
    # already covers the honest case.
    Decision:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Programme Leads" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: associated_member_group }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: associated_owner_group }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"

# UI hardening (tamper-resilience): site owners and administrators bypass
# every ACL, so the realistic threat is well-meaning UI tampering. Sealed
# columns block schema edits and column deletion through the UI even for site
# admins; prevent_list_deletion blocks UI deletion of the list objects
# (rollback.js clears it per list after you confirm that list's deletion).
# Friction and tamper-evidence, not enforcement.
#
# Attachments are the gap these two do not close. There is no attachments key
# in mapping.yaml and the deployer neither sets nor reconciles the setting, so
# disabling attachments on all ten lists is a manual go-live step in
# 30-deploy/deploy.md. It is the only privacy control a redeploy does not
# reassert.
seal_columns: true
prevent_list_deletion: true

display_names:
  mode: auto
  overrides:
    Stakeholder:
      # UAT live-run feedback (family issue #2): the column reaches external
      # bodies generally, not only service desks. The internal name stays
      # ServiceDeskAddress; views, Power Query and SQL key on it.
      ServiceDeskAddress: "External Contact Details"

# Column formatting: the fleet style standard (website/docs/reference/
# style-guide.md), SharePoint's own severity boxes and icons, tokens resolved
# by the style library.
#
# Deliberate omissions. ActivityKind and ActivityRole are axes rather than
# states (what the activity IS, and what standing position it confers), and
# raci-matrix leaves the first unformatted for that reason; colouring them
# would hand the fleet's severity vocabulary a second meaning. RiskResponse is
# a taxonomy of strategies, same reason. RaisedDate, ResolvedDate,
# AuthorisedDate, EscalatedDate and DecisionDate record when something
# HAPPENED and are not deadlines. Decision carries formatting on Status
# only, and that column is a lifecycle rather than a severity: a decision is
# not more or less severe, but a proposal nobody has answered yet reads
# differently from one that was approved.
column_formatting:
  BusinessProcess:
    Criticality: { style: severity, map: { Low: good, Medium: warning, High: severe } }
    # Not a severity: how often a thing runs is a fact, not a problem. Read as
    # weight, which is what it contributes to the score.
    Frequency:
      style: severity
      map:
        "A few times a year": neutral
        "Monthly": low
        "Daily or weekly": warning
    MappingPriority:
      style: severity
      map:
        "Now": severe
        "Next": warning
        "Later": neutral
    MappingStatus:
      style: severity
      map:
        "Identified": neutral
        "Ready to map": low
        "Mapping": low
        "Mapped": good
        "Out of scope": muted
    PriorityScore:
      style: data-bar
      max: 9
      calculated: true
      # Coloured by criticality rather than the score, so a critical process
      # still reads red when a low frequency drags its number down.
      color_by:
        field: Criticality
        map: { Low: good, Medium: warning, High: severe }
    # Guarded on the two states where a sweep no longer means anything: a
    # mapped process and one ruled out are both settled, and a date that keeps
    # shouting after the decision trains people to ignore the colour.
    NextReviewDue:
      style: overdue-date
      guard:
        field: MappingStatus
        not: ["Mapped", "Out of scope"]
  Workstream:
    Phase: { style: pill,
             map: { "Not started": muted, Discovery: neutral, Pilot: low,
                    Rollout: low, Embedding: good, Closed: muted } }
    TargetEndDate: { style: overdue-date, guard: { field: Phase, not: [Closed] } }
  Stakeholder:
    StakeholderKind: { style: pill,
                 map: { Individual: neutral, Role: neutral, Forum: low, External: muted } }
    Status: { style: severity, map: { Active: low, Inactive: muted } }
  Activity:
    Criticality: { style: severity, map: { Statutory: severe, High: warning, Routine: good } }
    ReviewStatus: { style: severity,
                    map: { Current: low, "Needs review": warning, Retired: muted } }
    ConfirmationDue: { style: overdue-date, calculated: true,
                       guard: { field: ReviewStatus, not: [Retired] } }
  Involvement:
    Involvement: { style: pill,
                   map: { Agree: warning, Consulted: low, Informed: neutral } }
  ServiceRequest:
    # Warning is "with the provider" and severe is "blocked on us": a request
    # handed back is the one the health service has to act on.
    Status: { style: severity,
              map: { Drafted: neutral, Authorised: low, "In progress": warning,
                     "Waiting on requester": severe, Closed: good, Withdrawn: muted } }
    EscalationLevel: { style: severity,
                       map: { "1 Program": low, "2 Directorate": warning,
                              "3 Contractual": severe, "4 Executive": blocked } }
    NeededBy: { style: overdue-date, guard: { field: Status, not: [Closed, Withdrawn] } }
  Risk:
    Status: { style: severity, map: { Open: low, Closed: good } }
    ResidualRiskRating: { style: severity, calculated: true,
                          map: { Low: good, Medium: warning, High: severe, Extreme: blocked } }
    # Data-bar with the fill translated from the rating column via the
    # severity tokens, the same map the rating column declares, so bar and
    # rating cell can never disagree.
    RiskScore: { style: data-bar, max: 25, calculated: true,
                 color_by: { field: ResidualRiskRating, calculated: true,
                             map: { Low: good, Medium: warning, High: severe,
                                    Extreme: blocked } } }
    NextReviewDue: { style: overdue-date, guard: { field: Status, not: [Closed] } }
  Action:
    Status: { style: severity,
              map: { Open: low, "In progress": low, Done: good, Dropped: muted } }
    DueDate: { style: overdue-date, guard: { field: Status, not: [Done, Dropped] } }
  Issue:
    Severity: { style: severity,
                map: { Minor: low, Moderate: warning, Major: severe, Critical: blocked } }
    Status: { style: severity,
              map: { Open: low, "In progress": low, Resolved: good, Closed: muted } }
  Decision:
    # Lifecycle, not severity. Proposed is the only value that is not an
    # outcome, so it is the one that has to stand out in the queue.
    Status: { style: severity,
              map: { Proposed: warning, Approved: good, Ratified: good,
                     Rejected: muted, Withdrawn: muted, Noted: neutral } }

# Every action view and every issue view opens with the same identifying
# columns and then its own payload, so each spine is declared once.
# WorkstreamPhase is the projected read-only phase of the action's workstream:
# it is in the spine because an action filed against a closed workstream is
# the failure the projection exists to reveal.
field_sets:
  Action:
    action: [Title, Workstream, WorkstreamPhase, AssignedTo, DueDate, Status]
  Issue:
    issue: [Title, Workstream, Severity, Status, Owner, RaisedDate]

# Declared views (deployed and reconciled by the views phase; undeclared views
# are never touched). Widths are pixel ColumnWidth per view and the keys are
# INTERNAL names. The build rewrites them to display titles, because
# ColumnWidth binds by display name and an internal name silently resets.
#
# Each list's default is the view its readers open it on: the question that
# list answers, asked in the first person where the reader is a person.
views:
  BusinessProcess:
    # The queue. MappingPriority leads because it is the decision; the score
    # only breaks ties within a band. Sorting by score alone would show the
    # advice as though it were the plan.
    - title: "The mapping queue"
      default: true
      fields: [Title, Function, MappingPriority, PriorityScore, Criticality,
               Frequency, MappingStatus, Owner, Workstream]
      where:
        - { field: MappingStatus, op: not_in, value: ["Mapped", "Out of scope"] }
      sort:
        - { field: MappingPriority, direction: asc }
        - { field: PriorityScore, direction: desc }
      widths:
        Title: 300
        Function: 150
        MappingPriority: 110
        PriorityScore: 110
        Criticality: 110
        Frequency: 150
        MappingStatus: 140
        Owner: 160
        Workstream: 160
    # A project-adjacent process nobody owns is the finding this register
    # exists to surface, so it gets its own view rather than a filter somebody
    # has to remember to apply.
    - title: "Unowned"
      fields: [Title, Function, Criticality, Frequency, PriorityScore, MappingStatus]
      where:
        - { field: Owner, op: is_null }
      sort:
        - { field: PriorityScore, direction: desc }
      widths:
        Title: 320
        Function: 160
        Criticality: 110
        Frequency: 150
        PriorityScore: 110
        MappingStatus: 140
    # Which workstream has claimed a process, and which have not been claimed.
    # A blank group is the finding.
    - title: "By workstream"
      fields: [Title, Function, MappingPriority, PriorityScore, MappingStatus, Owner]
      sort:
        - { field: PriorityScore, direction: desc }
      group_by: { field: Workstream, collapsed: false }
      widths:
        Title: 320
        Function: 150
        MappingPriority: 110
        PriorityScore: 110
        MappingStatus: 140
        Owner: 160
    # The record of what was mapped, with the link to each map. The register's
    # whole durable value once the mapping work is done.
    - title: "Mapped"
      fields: [Title, Function, Owner, Workstream, MapUrl,
               LastReviewedDate, NextReviewDue]
      where:
        - { field: MappingStatus, op: eq, value: "Mapped" }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 300
        Function: 150
        Owner: 160
        Workstream: 160
        MapUrl: 220
        LastReviewedDate: 170
        NextReviewDue: 150

  Workstream:
    # The whole programme on one screen, five to eight rows, read first at the
    # monthly steering group.
    - title: "The programme"
      default: true
      fields: [Title, Sequence, Phase, StartDate, TargetEndDate, Purpose]
      sort:
        - { field: Sequence, direction: asc }
      widths:
        Title: 300
        Sequence: 100
        Phase: 130
        StartDate: 160
        TargetEndDate: 160
        Purpose: 280
  Stakeholder:
    # Carries Contact AND ServiceDeskAddress on purpose: an External stakeholder
    # with no service desk address and a non-Forum internal stakeholder with no
    # contact are both quarterly checks that no save rule can make, because
    # person operands are refused in validation formulas. A blank has to be
    # visible while somebody is reading.
    - title: "Active stakeholders"
      renamed_from: ["Active parties"]
      default: true
      fields: [Title, StakeholderKind, Contact, ServiceDeskAddress, Notes]
      where:
        - { field: Status, op: eq, value: "Active" }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 280
        StakeholderKind: 130
        Contact: 160
        ServiceDeskAddress: 240
        Notes: 200
    - title: "By kind"
      fields: [Title, StakeholderKind, Contact, ServiceDeskAddress, Notes]
      where:
        - { field: Status, op: eq, value: "Active" }
      group_by: { field: StakeholderKind, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 280
        StakeholderKind: 130
        Contact: 160
        ServiceDeskAddress: 240
        Notes: 200
    - title: "Retired stakeholders"
      renamed_from: ["Retired parties"]
      fields: [Title, StakeholderKind, Contact, Status, Notes]
      where:
        - { field: Status, op: eq, value: "Inactive" }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 280
        StakeholderKind: 130
        Contact: 160
        Status: 110
        Notes: 200
    # Quarterly step 9 renders Modified and Editor, most recent first, so the
    # reviewer can read down to the last review.
    - title: "Changed since last review"
      fields: [Title, Modified, Editor]
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 300
        Modified: 170
        Editor: 170
  Activity:
    # The weekly personal read, and the default because "what do I answer
    # for?" is the question this list exists to answer. Both obligations are
    # in the filter: reading only Accountable halves the readership of the
    # layer most at risk of rotting.
    - title: "My accountabilities"
      default: true
      fields: [Title, Workstream, ActivityKind, ActivityRole, Criticality,
               Responsible, Accountable, ReviewStatus, ConfirmationDue]
      where:
        - any_of:
            - { field: Responsible, op: eq, value: me }
            - { field: Accountable, op: eq, value: me }
        - { field: ReviewStatus, op: neq, value: "Retired" }
      sort:
        - { field: ConfirmationDue, direction: asc }
      # ONE row-level signal in the whole family, reserved for the state
      # nothing else shouts about: a human has said this row is wrong, which
      # is worse than a date having passed. The wash reads ReviewStatus, so
      # that column must stay in this view's fields.
      formatting: formatting/row-needs-review.json
      widths:
        Title: 280
        Workstream: 180
        ActivityKind: 120
        ActivityRole: 170
        Criticality: 160
        Responsible: 160
        Accountable: 160
        ReviewStatus: 160
        ConfirmationDue: 170
    # Quarterly step 1. Everything falling due within thirty days or already
    # past. The per-row cadence is the floor, not the review schedule.
    - title: "Confirmation due"
      fields: [Title, Workstream, Criticality, Accountable, ConfirmedBy,
               LastConfirmed, ConfirmationDue, ReviewStatus]
      where:
        - { field: ReviewStatus, op: neq, value: "Retired" }
        - { field: ConfirmationDue, op: leq, value: today+30 }
      sort:
        - { field: ConfirmationDue, direction: asc }
      widths:
        Title: 280
        Workstream: 180
        Criticality: 160
        Accountable: 160
        ConfirmedBy: 160
        LastConfirmed: 170
        ConfirmationDue: 170
        ReviewStatus: 160
    # The catch for a row whose confirmation has never actually happened.
    # Confirmation due counts from LastConfirmed, so a never-confirmed row
    # falls outside that view's thirty-day horizon; this one lists them by
    # the blank ConfirmedBy instead.
    - title: "Never confirmed"
      fields: [Title, Workstream, Criticality, Responsible, Accountable,
               ReviewStatus, LastConfirmed]
      where:
        - { field: ConfirmedBy, op: is_null }
        - { field: ReviewStatus, op: neq, value: "Retired" }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        Criticality: 160
        Responsible: 160
        Accountable: 160
        ReviewStatus: 160
        LastConfirmed: 170
    # Quarterly step 2. The highest-value rows in the register: somebody has
    # said this one is wrong. They should not survive two consecutive reviews.
    - title: "Needs review"
      fields: [Title, Workstream, Criticality, Responsible, Accountable,
               LastConfirmed, ConfirmedBy]
      where:
        - { field: ReviewStatus, op: eq, value: "Needs review" }
      sort:
        - { field: LastConfirmed, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        Criticality: 160
        Responsible: 160
        Accountable: 160
        LastConfirmed: 170
        ConfirmedBy: 160
    # Quarterly step 3. Each workstream lead reads their own accountabilities
    # as a block. Programme-wide rows have no workstream and group together.
    - title: "By workstream"
      fields: [Title, ActivityKind, ActivityRole, Criticality, Responsible,
               Accountable, ReviewStatus, ConfirmationDue]
      where:
        - { field: ReviewStatus, op: neq, value: "Retired" }
      group_by: { field: Workstream, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      formatting: formatting/row-needs-review.json
      widths:
        Title: 280
        ActivityKind: 120
        ActivityRole: 170
        Criticality: 160
        Responsible: 160
        Accountable: 160
        ReviewStatus: 160
        ConfirmationDue: 170
    # Quarterly step 4. Exactly one current lead per workstream. A workstream
    # with two shows as two rows under one heading; a workstream with NONE is
    # invisible, because an absent group has no heading, so the check is
    # against Workstream's own row count and not against this view
    # alone. Nothing enforces it at save: validation reads one row.
    - title: "Workstream leads"
      fields: [Title, Responsible, Accountable, AccountableForum,
               EscalationRoute, LastConfirmed, ConfirmedBy]
      where:
        - { field: ActivityRole, op: eq, value: "Workstream lead" }
        - { field: ReviewStatus, op: eq, value: "Current" }
      group_by: { field: Workstream, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 280
        Responsible: 160
        Accountable: 160
        AccountableForum: 180
        EscalationRoute: 240
        LastConfirmed: 170
        ConfirmedBy: 160
    # Quarterly step 5, the governance pack. Two lenses merged on purpose: a
    # decisions list and a by-forum grouping are each half a view. Also where
    # an External stakeholder holding an accountability becomes visible as its own
    # group heading, since no save rule can catch it.
    - title: "Decisions and approvals"
      fields: [Title, ActivityKind, Criticality, Responsible, Accountable,
               EscalationRoute, ConfirmationDue]
      where:
        - { field: ActivityKind, op: neq, value: "Task" }
        - { field: ReviewStatus, op: neq, value: "Retired" }
      group_by: { field: AccountableForum, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 260
        ActivityKind: 120
        Criticality: 160
        Responsible: 160
        Accountable: 160
        EscalationRoute: 240
        ConfirmationDue: 170
    - title: "Retired"
      fields: [Title, Workstream, Responsible, Accountable, LastConfirmed,
               ConfirmedBy]
      where:
        - { field: ReviewStatus, op: eq, value: "Retired" }
      sort:
        - { field: LastConfirmed, direction: desc }
      widths:
        Title: 300
        Workstream: 180
        Responsible: 160
        Accountable: 160
        LastConfirmed: 170
        ConfirmedBy: 160
    # Quarterly step 9 renders Modified and Editor, most recent first, so the
    # reviewer can read down to the last review.
    - title: "Changed since last review"
      fields: [Title, Modified, Editor]
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 300
        Modified: 170
        Editor: 170
  Involvement:
    # The matrix read: each group is one activity's consulted and informed
    # list, which is the shape a RACI is normally drawn in.
    - title: "By activity"
      default: true
      fields: [Title, Activity, Stakeholder, Involvement, Channel, Notes]
      group_by: { field: Activity, collapsed: false }
      sort:
        - { field: Involvement, direction: asc }
      widths:
        Title: 280
        Activity: 240
        Stakeholder: 180
        Involvement: 130
        Channel: 180
        Notes: 200
    - title: "By stakeholder"
      renamed_from: ["By party"]
      fields: [Title, Stakeholder, Activity, Involvement, Channel]
      group_by: { field: Stakeholder, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 280
        Stakeholder: 180
        Activity: 240
        Involvement: 130
        Channel: 180
    # Quarterly step 6, the overload detector. Grouped by stakeholder rather than by
    # activity on purpose: the failure it exists to reveal is one stakeholder made
    # Consulted (or, worse, Agree) on everything, and that is invisible in any
    # activity-first view. Involvement is shown so a reader can tell the two apart.
    - title: "Consultation load"
      fields: [Title, Stakeholder, Involvement, Activity, Channel, Notes]
      where:
        - { field: Involvement, op: in, value: ["Consulted", "Agree"] }
      group_by: { field: Stakeholder, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 280
        Stakeholder: 180
        Involvement: 130
        Activity: 240
        Channel: 180
        Notes: 200
    # Quarterly step 9 renders Modified and Editor, most recent first, so the
    # reviewer can read down to the last review.
    - title: "Changed since last review"
      fields: [Title, Modified, Editor]
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 300
        Modified: 170
        Editor: 170
  ServiceRequest:
    # The default, read at the fortnightly: what the provider holds. Waiting
    # on requester is in scope because a handed-back request is still open
    # and is the one the health service has to move. AssignedTo shows who
    # holds it, and a blank there on an In progress row is the fortnightly
    # check that stands in for a save rule, since person operands are
    # refused.
    - title: "In progress"
      default: true
      renamed_from: ["Raised with the provider"]
      fields: [Title, Workstream, RequestType, Status, AssignedTo, NeededBy,
               InternalAccountable, MinutesSpent, EscalationLevel]
      where:
        - { field: Status, op: in, value: ["In progress", "Waiting on requester"] }
      sort:
        - { field: NeededBy, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        RequestType: 200
        Status: 160
        AssignedTo: 160
        NeededBy: 160
        InternalAccountable: 160
        MinutesSpent: 120
        EscalationLevel: 160
    # The guard on the hand-off: a request authorised here that nobody has
    # picked up is one the provider is not yet working, and nothing on their
    # side would notice. Read at the fortnightly, and it is where a handler
    # is named before the request moves.
    - title: "Authorised, not yet picked up"
      renamed_from: ["Authorised, not yet raised"]
      fields: [Title, Workstream, RequestType, RequestedBy,
               InternalAccountable, AuthorisedBy, AuthorisedDate, NeededBy]
      where:
        - { field: Status, op: eq, value: "Authorised" }
      sort:
        - { field: AuthorisedDate, direction: asc }
      widths:
        Title: 280
        Workstream: 180
        RequestType: 200
        RequestedBy: 160
        InternalAccountable: 160
        AuthorisedBy: 160
        AuthorisedDate: 160
        NeededBy: 160
    # The handler's queue: everything they hold that is still open, soonest
    # needed first.
    - title: "My assigned requests"
      fields: [Title, Workstream, RequestType, Status, NeededBy, RequestedBy,
               MinutesSpent]
      where:
        - { field: AssignedTo, op: eq, value: me }
        - { field: Status, op: not_in, value: ["Closed", "Withdrawn"] }
      sort:
        - { field: NeededBy, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        RequestType: 200
        Status: 160
        NeededBy: 160
        RequestedBy: 160
        MinutesSpent: 120
    # The effort record. The Sum total under Minutes Spent is what the
    # agreement review reads beside the escalation count.
    - title: "Closed"
      fields: [Title, Workstream, RequestType, AssignedTo, MinutesSpent,
               AuthorisedDate, Modified]
      where:
        - { field: Status, op: eq, value: "Closed" }
      sort:
        - { field: Modified, direction: desc }
      totals:
        MinutesSpent: sum
      widths:
        Title: 300
        Workstream: 180
        RequestType: 200
        AssignedTo: 160
        MinutesSpent: 120
        AuthorisedDate: 160
        Modified: 170
    # The annual evidence at the shared-service agreement review is a count of
    # requests that reached levels 3 or 4. EscalationLevel is the HIGHEST
    # level reached, not a history; the sequence is in version history.
    - title: "Escalated"
      fields: [Title, Workstream, Status, EscalationLevel, EscalatedDate,
               EscalatedBy, EscalatedTo, AssignedTo]
      where:
        - { field: EscalationLevel, op: is_not_null }
      sort:
        - { field: EscalatedDate, direction: desc }
      widths:
        Title: 280
        Workstream: 180
        Status: 160
        EscalationLevel: 160
        EscalatedDate: 160
        EscalatedBy: 160
        EscalatedTo: 220
        AssignedTo: 160
    # The ageing question, answered by a horizon rather than by a calculated
    # column: SharePoint calculated columns cannot reference [Today], so a
    # live "days open so far" was never buildable. Drafted is deliberately in
    # scope, because a request still being composed a fortnight before it is
    # needed is the same failure one state earlier.
    - title: "Needed soon or overdue"
      fields: [Title, Workstream, Status, NeededBy, InternalAccountable,
               AssignedTo, EscalationLevel]
      where:
        - { field: Status, op: not_in, value: ["Closed", "Withdrawn"] }
        - { field: NeededBy, op: leq, value: today+14 }
      sort:
        - { field: NeededBy, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        Status: 160
        NeededBy: 160
        InternalAccountable: 160
        AssignedTo: 160
        EscalationLevel: 160
    # "Did the request I raised get seen, and where is it now?" RequestedBy,
    # not Author: a lead may compose a request on someone else's behalf.
    - title: "My raised items"
      fields: [Title, Workstream, Status, NeededBy, InternalAccountable,
               AssignedTo]
      where:
        - { field: RequestedBy, op: eq, value: me }
      sort:
        - { field: NeededBy, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        Status: 160
        NeededBy: 160
        InternalAccountable: 160
        AssignedTo: 160
    # Quarterly step 9 renders Modified and Editor, most recent first, so the
    # reviewer can read down to the last review.
    - title: "Changed since last review"
      fields: [Title, Modified, Editor]
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 300
        Modified: 170
        Editor: 170
  Risk:
    - title: "Open"
      default: true
      fields: [Title, Workstream, Likelihood, Consequence, ResidualRiskRating,
               RiskScore, RiskOwner, RiskResponse, NextReviewDue]
      where:
        - { field: Status, op: eq, value: "Open" }
      sort:
        - { field: RiskScore, direction: desc }
      # The second row-level signal, reserved for Extreme and carried from
      # raid-log. The wash reads ResidualRiskRating, so it must stay in this
      # view's fields: view formatting can only read columns the view shows.
      formatting: formatting/row-extreme.json
      widths:
        Title: 280
        Workstream: 180
        Likelihood: 140
        Consequence: 160
        ResidualRiskRating: 160
        RiskScore: 140
        RiskOwner: 160
        RiskResponse: 140
        NextReviewDue: 160
    - title: "Review due"
      fields: [Title, Workstream, ResidualRiskRating, RiskScore, RiskOwner,
               RiskResponse, LastReviewedDate, NextReviewDue]
      where:
        - { field: Status, op: eq, value: "Open" }
        - { field: NextReviewDue, op: leq, value: today+14 }
      sort:
        - { field: NextReviewDue, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        ResidualRiskRating: 160
        RiskScore: 140
        RiskOwner: 160
        RiskResponse: 140
        LastReviewedDate: 170
        NextReviewDue: 160
    # Read monthly. There is no closure date, because closing a risk is a
    # status change, so this filters on the review at which it was closed.
    # That used to be a proxy read off a forward-looking column; since the
    # split, LastReviewedDate is the dated event itself. Every row here should
    # carry a closure note, which is a HUMAN check. ClosureNote is rich text
    # and SharePoint validation formulas refuse multi-line operands, so no
    # save rule can ask for it.
    - title: "Closed this quarter"
      fields: [Title, Workstream, ResidualRiskRating, RiskOwner,
               LastReviewedDate, ClosureNote]
      where:
        - { field: Status, op: eq, value: "Closed" }
        - { field: LastReviewedDate, op: geq, value: today-90 }
      sort:
        - { field: LastReviewedDate, direction: desc }
      widths:
        Title: 280
        Workstream: 180
        ResidualRiskRating: 160
        RiskOwner: 160
        LastReviewedDate: 170
        ClosureNote: 240
  Action:
    # The weekly personal read and the default: what do I owe? AssignedTo is a
    # person column, which is what the current-user sentinel exists for.
    - title: "My actions"
      default: true
      fields: ["@action", RelatedRiskTitle, Notes]
      where:
        - { field: AssignedTo, op: eq, value: me }
        - { field: Status, op: in, value: ["Open", "In progress"] }
      sort:
        - { field: DueDate, direction: asc }
      widths:
        Title: 280
        Workstream: 180
        WorkstreamPhase: 130
        AssignedTo: 160
        DueDate: 160
        Status: 120
        RelatedRiskTitle: 220
        Notes: 200
    # Read FIRST at the fortnightly, so the exception is not buried in the
    # whole list.
    - title: "Overdue"
      fields: ["@action", RelatedRiskTitle]
      where:
        - { field: Status, op: in, value: ["Open", "In progress"] }
        - { field: DueDate, op: lt, value: today }
      sort:
        - { field: DueDate, direction: asc }
      widths:
        Title: 300
        Workstream: 180
        WorkstreamPhase: 130
        AssignedTo: 160
        DueDate: 160
        Status: 120
        RelatedRiskTitle: 220
    - title: "Open by person"
      fields: ["@action", RelatedRiskTitle, Notes]
      where:
        - { field: Status, op: in, value: ["Open", "In progress"] }
      group_by: { field: AssignedTo, collapsed: true }
      sort:
        - { field: DueDate, direction: asc }
      widths:
        Title: 280
        Workstream: 180
        WorkstreamPhase: 130
        AssignedTo: 160
        DueDate: 160
        Status: 120
        RelatedRiskTitle: 220
        Notes: 200
    - title: "Done and dropped"
      fields: ["@action", CompletedDate, Notes]
      where:
        - { field: Status, op: in, value: ["Done", "Dropped"] }
      sort:
        - { field: CompletedDate, direction: desc }
      widths:
        Title: 280
        Workstream: 180
        WorkstreamPhase: 130
        AssignedTo: 160
        DueDate: 160
        Status: 120
        CompletedDate: 160
        Notes: 200
  Issue:
    # Read first at the fortnightly: facts before possibilities. Grouped by
    # workstream so each lead's broken things arrive together.
    - title: "Open"
      default: true
      fields: ["@issue", RelatedRiskTitle, Detail]
      where:
        - { field: Status, op: in, value: ["Open", "In progress"] }
      group_by: { field: Workstream, collapsed: false }
      sort:
        - { field: RaisedDate, direction: desc }
      # The third row-level signal, reserved for Critical. Severity is in the
      # field set, so the wash can read it.
      formatting: formatting/row-critical.json
      widths:
        Title: 280
        Workstream: 180
        Severity: 130
        Status: 120
        Owner: 160
        RaisedDate: 160
        RelatedRiskTitle: 220
        Detail: 260
    # Phase 1's answer to a severe issue, and phase 2 flow D's fallback: both
    # exist, and the view works with the flow off.
    - title: "Severe and open"
      fields: ["@issue", RelatedRiskTitle, Detail]
      where:
        - { field: Severity, op: in, value: ["Major", "Critical"] }
        - { field: Status, op: in, value: ["Open", "In progress"] }
      sort:
        - { field: RaisedDate, direction: desc }
      formatting: formatting/row-critical.json
      widths:
        Title: 280
        Workstream: 180
        Severity: 130
        Status: 120
        Owner: 160
        RaisedDate: 160
        RelatedRiskTitle: 220
        Detail: 260
    - title: "By owner"
      fields: ["@issue", RelatedRiskTitle]
      where:
        - { field: Status, op: in, value: ["Open", "In progress"] }
      group_by: { field: Owner, collapsed: false }
      sort:
        - { field: RaisedDate, direction: desc }
      widths:
        Title: 280
        Workstream: 180
        Severity: 130
        Status: 120
        Owner: 160
        RaisedDate: 160
        RelatedRiskTitle: 220
    - title: "Resolved and closed"
      fields: ["@issue", ResolvedDate, Resolution]
      where:
        - { field: Status, op: in, value: ["Resolved", "Closed"] }
      sort:
        - { field: ResolvedDate, direction: desc }
      widths:
        Title: 280
        Workstream: 180
        Severity: 130
        Status: 120
        Owner: 160
        RaisedDate: 160
        ResolvedDate: 160
        Resolution: 260
    # The triage owner's queue: any new issue nobody has picked up yet.
    # Workstream and Owner are the two fields an occasional raiser cannot
    # answer, so the view surfaces wherever either is still blank.
    - title: "Needs triage"
      fields: ["@issue", RelatedRiskTitle, Detail]
      where:
        - any_of:
            - { field: Workstream, op: is_null }
            - { field: Owner, op: is_null }
      sort:
        - { field: RaisedDate, direction: asc }
      widths:
        Title: 280
        Workstream: 180
        Severity: 130
        Status: 120
        Owner: 160
        RaisedDate: 160
        RelatedRiskTitle: 220
        Detail: 260
    # "Did the thing I reported get seen, and where is it now?" Author is the
    # built-in Created By column; an issue has no separate raiser column.
    - title: "My raised items"
      fields: ["@issue", RelatedRiskTitle, Detail]
      where:
        - { field: Author, op: eq, value: me }
      sort:
        - { field: RaisedDate, direction: desc }
      widths:
        Title: 280
        Workstream: 180
        Severity: 130
        Status: 120
        Owner: 160
        RaisedDate: 160
        RelatedRiskTitle: 220
        Detail: 260
  Decision:
    # The queue comes first and the log second, because the list now holds
    # both and only one of them is work. Status is the only thing separating
    # them, which is why it is indexed and why it carries the one formatter on
    # this list.
    - title: "Awaiting decision"
      default: true
      fields: [Title, Status, RaisedDate, Activity, Workstream,
               ResolutionSought, Author]
      where:
        - { field: Status, op: eq, value: Proposed }
      sort:
        - { field: RaisedDate, direction: asc }
      widths:
        Title: 300
        Status: 120
        RaisedDate: 150
        Activity: 220
        Workstream: 180
        ResolutionSought: 280
        Author: 170
    - title: "Decision log"
      fields: [Title, Status, DecisionDate, Workstream, DecidedBy,
               DecidedByForum, RecommendedByForum, SupersedesDecisionTitle,
               DecisionOutcome, Detail]
      where:
        - { field: Status, op: neq, value: Proposed }
      sort:
        - { field: DecisionDate, direction: desc }
      widths:
        Title: 300
        Status: 120
        DecisionDate: 150
        Workstream: 180
        DecidedBy: 160
        DecidedByForum: 180
        RecommendedByForum: 180
        SupersedesDecisionTitle: 220
        DecisionOutcome: 260
        Detail: 260
    # Six weeks is the outer edge of two monthly meeting cycles: a proposal
    # older than that has missed both, so it is stuck rather than pending.
    - title: "Stalled proposals"
      fields: [Title, Status, RaisedDate, Activity, Workstream,
               ResolutionSought, Author]
      where:
        - { field: Status, op: eq, value: Proposed }
        - { field: RaisedDate, op: lt, value: today-42 }
      sort:
        - { field: RaisedDate, direction: asc }
      widths:
        Title: 300
        Status: 120
        RaisedDate: 150
        Activity: 220
        Workstream: 180
        ResolutionSought: 280
        Author: 170

    # Quarterly step 9 renders Modified and Editor, most recent first, so the
    # reviewer can read down to the last review.
    - title: "Changed since last review"
      fields: [Title, Modified, Editor]
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 300
        Modified: 170
        Editor: 170

# Form layouts: a strapline header and a sectioned body per list. Section
# field lists are authored with INTERNAL names; the build rewrites them to
# display titles.
#
# The issue, risk and service-request headers carry the healthcare sentence
# ("Nothing patient-identifiable belongs in any field on this form"). It is
# GUIDANCE, not a control: nothing checks it, and a static header is read once
# and then stops being read. The controls that back it are the permission
# model, the payload restrictions on the phase-2 flows, and the quarterly
# sampling of narrative fields.
form_formatting:
  BusinessProcess:
    header: formatting/businessprocess-form-header.json
    body: formatting/businessprocess-form-body.json
  Workstream:
    header: formatting/workstream-form-header.json
    body: formatting/workstream-form-body.json
  Stakeholder:
    header: formatting/stakeholder-form-header.json
    body: formatting/stakeholder-form-body.json
  Activity:
    header: formatting/activity-form-header.json
    body: formatting/activity-form-body.json
  Involvement:
    header: formatting/involvement-form-header.json
    body: formatting/involvement-form-body.json
  ServiceRequest:
    header: formatting/servicerequest-form-header.json
    body: formatting/servicerequest-form-body.json
  Risk:
    header: formatting/risk-form-header.json
    body: formatting/risk-form-body.json
  Action:
    header: formatting/action-form-header.json
    body: formatting/action-form-body.json
  Issue:
    header: formatting/issue-form-header.json
    body: formatting/issue-form-body.json
  Decision:
    header: formatting/decision-form-header.json
    body: formatting/decision-form-body.json

# Each rule below pairs a field with the save rule under it: the field is on
# screen exactly when it is mandatory, rather than firing a refusal about a
# field the author cannot see. A visibility condition NARROWER than its rule
# produces a form that will not save and will not say why, and no gate this
# project runs catches it.
#
# Moving a status back does NOT clear a date already entered (SharePoint has
# no such mechanism), so these fields hide while keeping their values.
#
# Deliberately NOT declared: any rule conditioned on ConfirmationDue,
# ResidualRiskRating or RiskScore. Conditional show/hide cannot read a
# calculated column. The formula stays syntactically valid, so it saves, the
# readback compares equal and the phase passes, but the form never reacts.
# The build refuses it.
form_visibility:
  BusinessProcess:
    columns:
      # Only worth writing when the call disagrees with the score, which is
      # the only time it needs defending.
      PriorityNote:
        when:
          - { field: MappingPriority, op: neq, value: "Later" }
      MapUrl:
        when:
          - { field: MappingStatus, op: in, value: ["Mapping", "Mapped"] }
  Workstream:
    columns:
      ClosureNote:
        new: false
        when:
          - { field: Phase, op: eq, value: "Closed" }
  Activity:
    columns:
      # Defaults to today and is corrected on the Edit form when the row is
      # actually re-confirmed. An edit is not a confirmation.
      LastConfirmed: { new: false }
      # Widened from raci-matrix's two conditions to three, to match the
      # third branch of the save rule below. Edit the two together.
      EscalationRoute:
        when:
          any_of:
            - { field: ActivityKind, op: neq, value: "Task" }
            - { field: Criticality, op: eq, value: "Statutory" }
            - { field: ActivityRole, op: is_not_null }
  ServiceRequest:
    columns:
      # The half of the internal-authorisation control that the permission
      # level cannot do. A submitter who can pick their own status can
      # authorise their own request; hiding Status cannot break a save,
      # because it is not null with a default of Drafted.
      Status: { new: false }
      # The visible set covers EVERY state the save rule fires in, not just
      # Authorised. Listing only the first decided state hides the field the
      # moment the record moves downstream, and a governance user moving
      # straight to Closed would be refused for a missing field with nothing
      # on screen to supply it.
      AuthorisedBy:
        new: false
        when:
          - { field: Status, op: in,
              value: ["Authorised", "In progress", "Waiting on requester", "Closed"] }
      AuthorisedDate:
        new: false
        when:
          - { field: Status, op: in,
              value: ["Authorised", "In progress", "Waiting on requester", "Closed"] }
      AuthorisingDecision:
        new: false
        when:
          - { field: Status, op: in,
              value: ["Authorised", "In progress", "Waiting on requester", "Closed"] }
      # Off the New form so a submitter cannot assign their own request, and
      # on the Edit form in every state so governance can name a handler at
      # Authorised, before anything moves.
      AssignedTo: { new: false }
      # Shown from the first handler state onwards, which covers Closed, the
      # one state the save rule below fires in.
      MinutesSpent:
        new: false
        when:
          - { field: Status, op: in,
              value: ["In progress", "Waiting on requester", "Closed"] }
      # Unconditionally off the New form and unconditionally on the existing
      # one. A rule keyed on EscalationLevel would be circular, and escalation
      # is a governance act on a record that already exists. Hiding the block
      # cannot break a save: branches 4 and 5 only fire once one of these is
      # set, which cannot happen on a form that does not show them.
      EscalationLevel: { new: false }
      EscalatedDate: { new: false }
      EscalatedBy: { new: false }
      EscalatedTo: { new: false }
  Risk:
    columns:
      ToleranceDecision:
        when:
          - { field: RiskResponse, op: eq, value: "Tolerate" }
      ClosureNote:
        new: false
        when:
          - { field: Status, op: eq, value: "Closed" }
  Action:
    columns:
      CompletedDate:
        when:
          - { field: Status, op: eq, value: "Done" }
  Issue:
    columns:
      # Left on the New form on purpose: an issue that was raised, fixed and
      # is only being written up afterwards is a real case.
      ResolvedDate:
        when:
          - { field: Status, op: in, value: ["Resolved", "Closed"] }
      Resolution:
        when:
          - { field: Status, op: in, value: ["Resolved", "Closed"] }
      # Machine-owned: flow D stamps it and nothing else writes it. Rendered
      # on All Items only because watched_lists requires a watched column to
      # be rendered.
      NotifiedAt: { new: false, existing: false }

# Per-column save rules. Each column carries its own formula and its own
# message, and they all run, unlike list_validation, where a list has ONE
# ValidationFormula and every cross-column rule shares one message.
column_validation:
  BusinessProcess:
    columns:
      LastReviewedDate:
        when:
          - { field: LastReviewedDate, op: leq, value: today }
        message: "A sweep cannot have happened in the future. Use the date somebody actually checked this row, or leave it blank until one has."
      NextReviewDue:
        when:
          any_of:
            - { field: NextReviewDue, op: is_null }
            - { field: NextReviewDue, op: leq, value: today+365 }
        message: "The register is swept annually. Pick a review date within the next twelve months, or leave it blank until somebody has actually looked at this process."
  Activity:
    columns:
      LastConfirmed:
        when:
          - { field: LastConfirmed, op: leq, value: today }
        message: "A confirmation cannot be dated in the future. Use the date you actually re-read the row."
  ServiceRequest:
    columns:
      AuthorisedDate:
        when:
          - { field: AuthorisedDate, op: leq, value: today }
        message: "An authorisation cannot be dated in the future. Use the date it was actually authorised."
      EscalatedDate:
        when:
          - { field: EscalatedDate, op: leq, value: today }
        message: "An escalation cannot be dated in the future. Use the date it was actually raised."
      # A running total only ever grows, so a negative number is a typo.
      MinutesSpent:
        when:
          - { field: MinutesSpent, op: geq, value: 0 }
        message: "Minutes spent cannot be negative. Enter the running total of whole minutes spent on the request so far."
  Risk:
    columns:
      LastReviewedDate:
        when:
          - { field: LastReviewedDate, op: leq, value: today }
        message: "A review cannot have happened in the future. Use the date you actually reviewed this risk, or today's date."
      # Capped, not scheduled: this refuses a review pushed years out and
      # leaves the cadence to the programme. Neither rule can compare the two
      # columns to each other, because a condition's value is a literal or a
      # today token and the DSL has no field reference, so "the next review
      # cannot precede the last one" is a governance check instead.
      NextReviewDue:
        when:
          any_of:
            - { field: NextReviewDue, op: is_null }
            - { field: NextReviewDue, op: leq, value: today+365 }
        message: "A risk reviewed less than once a year is not being reviewed. Pick a next review date within the next twelve months."
  Action:
    columns:
      # A forward-dated completion sorts to the top of "Done and dropped" and
      # reads as the most recent thing the programme finished.
      CompletedDate:
        when:
          - { field: CompletedDate, op: leq, value: today }
        message: "An action cannot have been completed in the future. Use the date the work was actually finished."
  Issue:
    columns:
      ResolvedDate:
        when:
          - { field: ResolvedDate, op: leq, value: today }
        message: "An issue cannot have been resolved in the future. Use the date it actually stopped happening."
  Decision:
    columns:
      DecisionDate:
        when:
          - { field: DecisionDate, op: leq, value: today }
        message: "A decision cannot have been made in the future. Use the date the forum actually decided, and leave it blank while the proposal is still Proposed."

# Save-time enforcement, stored on the LIST so it may reference any column.
# Each rule is written as an implication: `if A then B` is `any_of[not A, B]`,
# which is why every branch opens with the case the rule does not cover.
#
# A list has one ValidationFormula, so all branches on one list share one
# message. That is why the ServiceRequest message names every obligation it
# enforces rather than any single one.
#
# NOT declared, and it cannot be: "a closed risk carries a closure note".
# ClosureNote is rich text and SharePoint validation formulas refuse
# multi-line operands outright. It is a monthly human check instead, read on
# the "Closed this quarter" view. The same limit rules out any rule reading
# Purpose, Detail, Justification, Resolution or Notes, and any rule reading a
# person or lookup column, which is why "the provider is never the
# Accountable" and "an External stakeholder names a service desk address" are
# quarterly checks rather than save rules.
list_validation:
  # NO RULE for BusinessProcess. "Mapped needs a link to its map" is the one
  # worth enforcing, and it cannot be: MapUrl is a hyperlink column, which
  # SharePoint refuses inside a validation formula. The build says so
  # (condition_operand_type_unsupported) rather than emitting a rule that
  # would save, read back and never fire. It is a human check in the annual
  # sweep, and governance.md carries it as one.
  Activity:
    when:
      - any_of:
          - { field: ActivityKind, op: neq, value: "Decision" }
          - { field: EscalationRoute, op: is_not_null }
      - any_of:
          - { field: Criticality, op: neq, value: "Statutory" }
          - { field: EscalationRoute, op: is_not_null }
      # The third branch, new with ActivityRole. A standing position with no
      # tie-break is the position that stalls at the worst moment. The
      # form-visibility condition above is widened to match it.
      - any_of:
          - { field: ActivityRole, op: is_null }
          - { field: EscalationRoute, op: is_not_null }
    message: "This activity needs an Escalation Route. A Decision must say where it goes when Responsible and Accountable cannot agree, and so must anything Statutory and anything carrying an Activity Role."
  # FOUR branches, not the six the design tabulates. "Authorised onwards
  # requires AuthorisedBy" and "In progress onwards requires AssignedTo"
  # cannot be built: both are person columns and SharePoint validation
  # formulas refuse person operands, which the build rejects as
  # condition_operand_type_unsupported (2026-08-28). AuthorisedDate is the
  # enforceable half of the authorisation obligation and is kept, and the two
  # fields appear together in exactly the states the rule fires in, so
  # somebody entering the date is looking at the person field. "An
  # authorisation names a person" and "a request being worked names its
  # handler" are fortnightly human checks across the "Authorised, not yet
  # picked up" and "In progress" views, alongside the closure-note check on
  # Risk and for the same reason: the register can ask for it, the
  # list cannot.
  ServiceRequest:
    when:
      - any_of:
          - { field: Status, op: not_in,
              value: ["Authorised", "In progress", "Waiting on requester", "Closed"] }
          - { field: AuthorisedDate, op: is_not_null }
      # The effort record: a request cannot close without its minutes, and
      # zero is an answer.
      - any_of:
          - { field: Status, op: neq, value: "Closed" }
          - { field: MinutesSpent, op: is_not_null }
      - any_of:
          - { field: EscalationLevel, op: is_null }
          - { field: EscalatedDate, op: is_not_null }
      - any_of:
          - { field: EscalatedDate, op: is_null }
          - { field: EscalationLevel, op: is_not_null }
    message: "An authorised request needs the date it was authorised; a closed request records the minutes spent on it; and an escalation records both a level and a date."
  Action:
    when:
      any_of:
        - { field: Status, op: neq, value: "Done" }
        - { field: CompletedDate, op: is_not_null }
    message: "An action marked Done needs a completed date. If it is finished but you cannot say when, it is still In progress."
  Issue:
    when:
      any_of:
        - { field: Status, op: not_in, value: ["Resolved", "Closed"] }
        - { field: ResolvedDate, op: is_not_null }
    message: "An issue marked Resolved or Closed needs a resolved date. If it has stopped happening but you cannot say when, it is still In progress."
  # One branch. "The forum that decided is the forum entitled to decide" is not
  # here and cannot be: it compares two lookups across two lists, which
  # SharePoint validation formulas cannot read. That reconciliation is a report.
  Decision:
    when:
      any_of:
        - { field: Status, op: in, value: ["Proposed", "Withdrawn"] }
        - { field: DecisionDate, op: is_not_null }
    message: "A decision that has been made needs the date it was made. If the forum has not decided yet, leave it Proposed."

# Demo rows (emitted as demo-data.js ONLY when built with --seed). Every Title
# starts "[DEMO] " so sample data stays visible in every view and form, and
# because every phase-2 flow carries a trigger condition excluding those
# titles: demo-data.js writes over REST and to a flow they are ordinary
# creates. Rollback requires per-list confirmation before every delete. Dates
# are today+/-N so the date-derived views land correctly on whatever day the
# demo runs, and "@me" is the pasting operator.
#
# Coverage: six workstreams spanning all six phases; seven stakeholders covering
# all four kinds and both statuses; nine activities across every criticality,
# every review status and all three activity roles, two of them carrying a
# decision route and rule; seven involvements, three of them consulting the
# same stakeholder so "Consultation load" has something to show and one of them the
# single Agree; seven service requests across all six statuses with two
# escalations, three of them assigned with minutes logged; six risks spanning all four rating bands and both statuses;
# seven actions across every status including one overdue and still open;
# seven issues across every severity and every status, one untriaged with no
# owner or workstream; and seven decisions, three of them programme-wide, one
# still Proposed and old enough to be stalled, one Ratified under delegation,
# and one carrying the recommend-then-decide pair of forums.
# ReviewDate was one hand-set date standing for both halves of a review,
# so moving it forward destroyed the evidence that a review had happened.
# Split into LastReviewedDate and NextReviewDue. The column stays declared and
# deployer-managed until its values have been transferred and it is deleted
# with the columns sidecar; deleting the declaration instead would leave a
# live column the schema no longer knows about, reported as user-added drift
# on every report refresh.
retired_columns:
  BusinessProcess:
    ReviewDate:
      retired: "2026-09-04"
      superseded_by: NextReviewDue
      reason: "Split into LastReviewedDate and NextReviewDue"
  Risk:
    ReviewDate:
      retired: "2026-09-04"
      superseded_by: NextReviewDue
      reason: "Split into LastReviewedDate and NextReviewDue"

demo_items:
