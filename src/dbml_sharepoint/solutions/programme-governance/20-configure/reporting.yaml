# Reporting pack configuration for the programme-governance family.
#
# Split out of mapping.yaml because NOTHING IN THE DEPLOY READS IT. The
# generated deploy, rollback, assess and verify scripts never see these two
# sections; only the reporting pack does. The seam is what consumes a
# section, not how long it is.
#
# mapping.yaml points here with `reporting_source:`, and may not declare
# either section itself.

# The reporting pack carries Created By, Created, Modified By and Modified
# on every list, and a _Users dimension every person column joins.
# 50-govern/reporting-joins.md reads both: "an edit is not a confirmation"
# is LastConfirmed against Modified, and the RACI counts by person need
# department and job title from the user list.
reporting:
  system_columns: true
  users_table: true
  # The site's IANA zone. Every list query then carries this zone's
  # daylight-saving transitions, so a derived column can convert a UTC
  # timestamp to the site's date with AsSiteDate rather than truncate it.
  time_zone: Australia/Melbourne

# 200 on the three accountability lists because version history is this
# family's audit for self-service confirmation: anyone named Responsible or
# Accountable may correct their own row, and the quarterly review reads the
# history of every row changed since the last one.
# Reporting-only columns, computed in the generated Power Query and nowhere
# else. NOTHING HERE IS DEPLOYED: no SharePoint field is created, no list
# carries one, and a site shows no trace of them. They exist so a report is
# built from the pack rather than from a second layer maintained beside it,
# which is where these lived until now and where a pack change broke them
# silently: release 3.1.0 renamed each list's Title, six of them went on
# asking for the old name, and thirteen queries failed at refresh.
#
# Names are the INTERNAL ones the schema declares, here and inside every
# expression. A column read out of ANOTHER list is translated by the
# generator to whatever that list's query renames it to, so an author never
# writes a display title. Order matters: an entry may read what an entry
# above it produced, and several do.
derived_columns:
  Risk:
    - kind: lookup
      from: Decision
      via: ToleranceDecision
      pick:
        ToleranceDecisionStatus: Status
      types:
        ToleranceDecisionStatus: text
      hidden: true
    - kind: count
      from: Action
      via: RelatedRisk
      name: LinkedActionCount
      aggregate: count
      type: Int64
    - kind: count
      from: Action
      via: RelatedRisk
      name: LinkedActionDoneCount
      aggregate: count
      type: Int64
      where: '[Status] = "Done"'
    - kind: count
      from: Issue
      via: RelatedRisk
      name: RelatedIssueCount
      aggregate: count
      type: Int64
    - kind: count
      from: Issue
      via: RelatedRisk
      name: FirstIssueRaisedDate
      aggregate: min
      type: date
      column: RaisedDate
    - kind: expr
      name: IsOpen
      type: logical
      m: '[Status] = "Open"'
    - kind: expr
      name: IsRated
      type: logical
      m: '[RiskScore] <> null'
    - kind: expr
      name: ResidualRiskRatingSort
      type: Int64
      m: 'if [RiskScore] = null then null else if [RiskScore] <= 6 then 1 else if [RiskScore] <= 15 then 2 else if [RiskScore] <= 22 then 3 else 4'
      hidden: true
    - kind: expr
      name: MatrixCell
      type: text
      m: 'Text.From([Likelihood] ?? "") & " x " & Text.From([Consequence] ?? "")'
    - kind: expr
      name: ReviewCadenceMonths
      type: Int64
      m: 'if List.Contains({"High", "Extreme"}, [ResidualRiskRating]) then 3 else if List.Contains({"Manage", "Tolerate"}, [RiskResponse]) then 6 else 12'
    - kind: expr
      name: NextReviewDue
      type: date
      m: 'if [NextReviewDue] <> null then [NextReviewDue] else if [LastReviewedDate] = null or [ResidualRiskRating] = null then null else Date.AddMonths([LastReviewedDate], [ReviewCadenceMonths])'
      replace: true
    - kind: expr
      name: IsToleratedWithoutDecision
      type: logical
      m: '[RiskResponse] = "Tolerate" and [ToleranceDecision Key] = null'
    - kind: expr
      name: ClosedWithoutNote
      type: logical
      m: '[Status] = "Closed" and Text.Length(Text.Trim([ClosureNote] ?? "")) = 0'
    - kind: expr
      name: NeedsAction
      type: logical
      m: '[Status] = "Open" and List.Contains({"Manage", "Transfer", "Terminate"}, [RiskResponse])'
    - kind: expr
      name: ToleranceDecisionIsAuthority
      type: logical
      m: 'List.Contains({"Approved", "Ratified"}, [ToleranceDecisionStatus])'
    # Reads 'Closed without a note' when a closed risk has no closure note; blank otherwise.
    - kind: expr
      name: ClosureCheck
      type: text
      m: 'if [ClosedWithoutNote] then "Closed without a note" else null'
      description: 'Reads ''Closed without a note'' when a closed risk has no closure note; blank otherwise.'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Review'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Review"'
      description: 'A constant link label (''Review''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  Action:
    - kind: lookup
      from: Risk
      via: RelatedRisk
      pick:
        RelatedRiskScore: RiskScore
      types:
        RelatedRiskScore: number
    - kind: expr
      name: IsOpen
      type: logical
      m: 'List.Contains({"Open", "In progress"}, [Status])'
    - kind: expr
      name: HasRelatedRisk
      type: logical
      m: '[RelatedRisk Key] <> null'
    - kind: expr
      name: HasRelatedIssue
      type: logical
      m: '[RelatedIssue Key] <> null'
    - kind: expr
      name: HasRelatedServiceRequest
      type: logical
      m: '[RelatedServiceRequest Key] <> null'
    - kind: expr
      name: HasAuthorisingDecision
      type: logical
      m: '[AuthorisingDecision Key] <> null'
    - kind: expr
      name: ActionSource
      type: text
      m: 'if [AuthorisingDecision Key] <> null then "Decision" else if [RelatedRisk Key] <> null then "Risk" else if [RelatedIssue Key] <> null then "Issue" else if [RelatedServiceRequest Key] <> null then "Service Request" else "None"'
    - kind: expr
      name: IsOnClosedWorkstream
      type: logical
      m: '[WorkstreamPhase] = "Closed"'
    - kind: expr
      name: DaysLateAtCompletion
      type: Int64
      m: 'if [CompletedDate] = null then null else Duration.Days([CompletedDate] - [DueDate])'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Update'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Update"'
      description: 'A constant link label (''Update''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  Issue:
    - kind: lookup
      from: Risk
      via: RelatedRisk
      pick:
        RelatedRiskRating: ResidualRiskRating
        RelatedRiskScore: RiskScore
        RelatedRiskResponse: RiskResponse
        RiskCreatedDate: Created
      types:
        RelatedRiskRating: text
        RelatedRiskScore: number
        RelatedRiskResponse: text
        RiskCreatedDate: date
    - kind: count
      from: Action
      via: RelatedIssue
      name: LinkedActionCount
      aggregate: count
      type: Int64
    - kind: expr
      name: IsOpen
      type: logical
      m: 'List.Contains({"Open", "In progress"}, [Status])'
    - kind: expr
      name: IsSevere
      type: logical
      m: 'List.Contains({"Major", "Critical"}, [Severity])'
    - kind: expr
      name: NeedsTriage
      type: logical
      m: '[Workstream Key] = null or [Owner Key] = null'
    - kind: expr
      name: IsMaterialisedRisk
      type: logical
      m: '[RelatedRisk Key] <> null'
    - kind: expr
      name: WarningLeadDays
      type: Int64
      m: 'if [RiskCreatedDate] = null then null else Duration.Days([RaisedDate] - [RiskCreatedDate])'
    - kind: expr
      name: DaysToResolve
      type: Int64
      m: 'if [ResolvedDate] = null then null else Duration.Days([ResolvedDate] - [RaisedDate])'
    - kind: expr
      name: RaisedBySomeoneElse
      type: logical
      m: '[Owner Key] <> null and [Owner Key] <> [Created By Key]'
    - kind: expr
      name: Under-ratedMaterialisedRisk
      type: logical
      m: '[RelatedRisk Key] <> null and List.Contains({"Low", "Medium"}, [RelatedRiskRating]) and List.Contains({"Major", "Critical"}, [Severity])'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Update'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Update"'
      description: 'A constant link label (''Update''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
    - kind: lookup
      from: _Users
      via: Owner
      pick:
        OwnerAccount: UserName
        OwnerEmail: EMail
      types:
        OwnerAccount: text
        OwnerEmail: text
      hidden: true
    # The issue owner's sign-in name, derived the same way as Person[Sign-in Name], for the Raise an action flow to set Assigned To.
    - kind: expr
      name: OwnerSign-in
      type: text
      m: 'Text.Lower(if [OwnerEmail] <> null and [OwnerEmail] <> "" then [OwnerEmail] else if [OwnerAccount] <> null and Text.Contains([OwnerAccount], "|") then Text.AfterDelimiter([OwnerAccount], "|", {0, RelativePosition.FromEnd}) else "")'
      hidden: true
      description: 'The issue owner''s sign-in name, derived the same way as Person[Sign-in Name], for the Raise an action flow to set Assigned To.'
  ServiceRequest:
    # The date part of Created in the site's zone (reporting.time_zone), converted through the daylight-saving transitions the pack carries rather than truncated in UTC.
    - kind: expr
      name: CreatedDate
      type: date
      m: 'AsSiteDate([Created])'
      description: 'The date part of Created in the site''s time zone (Australia/Melbourne), converted through the daylight-saving transitions the pack carries. DateZoneResolved is false on every row where the site is set to another zone.'
    # The date part of Modified in the site's zone (reporting.time_zone), converted through the daylight-saving transitions the pack carries rather than truncated in UTC.
    - kind: expr
      name: ModifiedDate
      type: date
      m: 'AsSiteDate([Modified])'
      description: 'The date part of Modified in the site''s time zone (Australia/Melbourne), converted through the daylight-saving transitions the pack carries. DateZoneResolved is false on every row where the site is set to another zone.'
    - kind: count
      from: Action
      via: RelatedServiceRequest
      name: LinkedActionCount
      aggregate: count
      type: Int64
    - kind: expr
      name: IsLive
      type: logical
      m: 'not List.Contains({"Closed", "Withdrawn"}, [Status])'
    - kind: expr
      name: IsWithProvider
      type: logical
      m: 'List.Contains({"In progress", "Waiting on requester"}, [Status])'
    - kind: expr
      name: EscalationLevelNumber
      type: Int64
      m: 'if [EscalationLevel] = null then null else Number.From(Text.Start([EscalationLevel], 1))'
    - kind: expr
      name: IsContractualEscalation
      type: logical
      m: '[EscalationLevelNumber] <> null and [EscalationLevelNumber] >= 3'
    - kind: expr
      name: AuthorisedWithoutAuthoriser
      type: logical
      m: 'List.Contains({"Authorised", "In progress", "Waiting on requester", "Closed"}, [Status]) and [AuthorisedBy Key] = null'
    - kind: expr
      name: WorkedWithoutHandler
      type: logical
      m: 'List.Contains({"In progress", "Waiting on requester"}, [Status]) and [AssignedTo Key] = null'
    - kind: expr
      name: RaisedBySomeoneElse
      type: logical
      m: '[RequestedBy Key] <> [Created By Key]'
    - kind: expr
      name: ClosedDate
      type: date
      m: 'if [Status] = "Closed" then [ModifiedDate] else null'
    - kind: expr
      name: DaysDraftedToAuthorised
      type: Int64
      m: 'if [AuthorisedDate] = null then null else Duration.Days([AuthorisedDate] - [CreatedDate])'
    - kind: expr
      name: DaysAuthorisedToClosed
      type: Int64
      m: 'if [Status] = "Closed" and [AuthorisedDate] <> null then Duration.Days([ModifiedDate] - [AuthorisedDate]) else null'
    - kind: expr
      name: ClosedOnTime
      type: logical
      m: '[Status] = "Closed" and [ModifiedDate] <= [NeededBy]'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Update'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Update"'
      description: 'A constant link label (''Update''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  Decision:
    - kind: lookup
      from: Activity
      via: Activity
      pick:
        RouteForumKey: DecisionRoute Key
      types:
        RouteForumKey: text
      hidden: true
    - kind: lookup
      from: Stakeholder
      key: RouteForumKey
      pick:
        RouteForumTitle: Title
      types:
        RouteForumTitle: text
    - kind: count
      from: Decision
      via: SupersedesDecision
      name: SupersededByKey
      aggregate: max
      type: text
      column: Decision Key
      hidden: true
    - kind: count
      from: Action
      via: AuthorisingDecision
      name: ImplementingActionCount
      aggregate: count
      type: Int64
    - kind: count
      from: Action
      via: AuthorisingDecision
      name: ImplementingActionDoneCount
      aggregate: count
      type: Int64
      where: '[Status] = "Done"'
    - kind: count
      from: Action
      via: AuthorisingDecision
      name: FirstActionCreatedDate
      aggregate: min
      type: date
      column: Created
    - kind: expr
      name: IsProposed
      type: logical
      m: '[Status] = "Proposed"'
    - kind: expr
      name: IsOutcome
      type: logical
      m: '[Status] <> "Proposed"'
    - kind: expr
      name: IsAuthority
      type: logical
      m: 'List.Contains({"Approved", "Ratified"}, [Status])'
    - kind: expr
      name: DaysToDecide
      type: Int64
      m: 'if [DecisionDate] = null then null else Duration.Days([DecisionDate] - [RaisedDate])'
    - kind: expr
      name: RaisedAfterDecided
      type: logical
      m: '[DecisionDate] <> null and [RaisedDate] > [DecisionDate]'
    - kind: expr
      name: SelfRecommended
      type: logical
      m: '[RecommendedByForum Key] <> null and [RecommendedByForum Key] = [DecidedByForum Key]'
    - kind: expr
      name: RouteMismatch
      type: logical
      m: '[Activity Key] <> null and [RouteForumKey] <> null and [RouteForumKey] <> [DecidedByForum Key]'
    - kind: expr
      name: IsSuperseded
      type: logical
      m: '[SupersededByKey] <> null'
    - kind: expr
      name: DaysDecisionToFirstAction
      type: Int64
      m: 'if [FirstActionCreatedDate] = null or [DecisionDate] = null then null else Duration.Days([FirstActionCreatedDate] - [DecisionDate])'
    # Reads 'Decided off its route' when the deciding forum is not the activity's decision route; blank otherwise.
    - kind: expr
      name: RouteCheck
      type: text
      m: 'if [RouteMismatch] then "Decided off its route" else null'
      description: 'Reads ''Decided off its route'' when the deciding forum is not the activity''s decision route; blank otherwise.'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Decide'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Decide"'
      description: 'A constant link label (''Decide''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  Activity:
    # The date part of Modified in the site's zone (reporting.time_zone), converted through the daylight-saving transitions the pack carries rather than truncated in UTC.
    - kind: expr
      name: ModifiedDate
      type: date
      m: 'AsSiteDate([Modified])'
      description: 'The date part of Modified in the site''s time zone (Australia/Melbourne), converted through the daylight-saving transitions the pack carries. DateZoneResolved is false on every row where the site is set to another zone.'
    - kind: lookup
      from: Stakeholder
      via: AccountableForum
      pick:
        AccountableForumKind: StakeholderKind
      types:
        AccountableForumKind: text
    - kind: count
      from: Decision
      via: Activity
      name: DecisionCount
      aggregate: count
      type: Int64
    - kind: expr
      name: IsCurrent
      type: logical
      m: '[ReviewStatus] <> "Retired"'
    - kind: expr
      name: NeverConfirmed
      type: logical
      m: '[ConfirmedBy Key] = null'
    - kind: expr
      name: EditedSinceConfirmed
      type: logical
      m: '[LastConfirmed] <> null and [ModifiedDate] > [LastConfirmed]'
    - kind: expr
      name: ConfirmationCadenceMonths
      type: Int64
      m: 'if [Criticality] = "Statutory" then 6 else if [Criticality] = "High" then 12 else 24'
    - kind: expr
      name: ConfirmationDue
      type: date
      m: 'if [ConfirmationDue] <> null then [ConfirmationDue] else if [LastConfirmed] = null or [ReviewStatus] = "Retired" then null else Date.AddMonths([LastConfirmed], [ConfirmationCadenceMonths])'
      replace: true
    - kind: expr
      name: IsLeadRole
      type: logical
      m: '[ActivityRole] = "Workstream lead"'
    - kind: expr
      name: MissingEscalationRoute
      type: logical
      m: '([ActivityKind] = "Decision" or [Criticality] = "Statutory" or [ActivityRole] <> null) and Text.Length(Text.Trim([EscalationRoute] ?? "")) = 0'
    - kind: expr
      name: AccountableForumIsExternal
      type: logical
      m: '[AccountableForumKind] = "External"'
    - kind: expr
      name: SelfAccountable
      type: logical
      m: '[Responsible Key] = [Accountable Key]'
    - kind: expr
      name: CriticalityWeight
      type: Int64
      m: 'if [Criticality] = "Statutory" then 3 else if [Criticality] = "High" then 2 else 1'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Confirm'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Confirm"'
      description: 'A constant link label (''Confirm''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  Stakeholder:
    - kind: count
      from: Involvement
      via: Stakeholder
      name: InvolvementReferenceCount
      aggregate: count
      type: Int64
      hidden: true
    - kind: count
      from: Activity
      via: AccountableForum
      name: AccountableForumReferenceCount
      aggregate: count
      type: Int64
      hidden: true
    - kind: count
      from: Activity
      via: DecisionRoute
      name: DecisionRouteReferenceCount
      aggregate: count
      type: Int64
      hidden: true
    - kind: count
      from: Decision
      via: DecidedByForum
      name: DecidedByReferenceCount
      aggregate: count
      type: Int64
      hidden: true
    - kind: count
      from: Decision
      via: RecommendedByForum
      name: RecommendedByReferenceCount
      aggregate: count
      type: Int64
      hidden: true
    - kind: expr
      name: ReferenceCount
      type: Int64
      m: '[InvolvementReferenceCount] + [AccountableForumReferenceCount] + [DecisionRouteReferenceCount] + [DecidedByReferenceCount] + [RecommendedByReferenceCount]'
    - kind: expr
      name: ContactMissing
      type: logical
      m: '[Status] = "Active" and not List.Contains({"Forum", "External"}, [StakeholderKind]) and [Contact Key] = null'
    - kind: expr
      name: ServiceDeskMissing
      type: logical
      m: '[Status] = "Active" and [StakeholderKind] = "External" and Text.Length(Text.Trim([ExternalContactDetails] ?? "")) = 0'
    - kind: expr
      name: IsUnreferenced
      type: logical
      m: '[Status] = "Active" and [ReferenceCount] = 0'
    # The register gaps against this stakeholder in words: no contact, no service desk, referenced nowhere. Blank when the row is complete.
    - kind: expr
      name: RegisterGaps
      type: text
      m: 'let g = List.Select({ if [ContactMissing] then "no contact" else null, if [ServiceDeskMissing] then "no service desk" else null, if [IsUnreferenced] then "referenced nowhere" else null }, each _ <> null) in if List.IsEmpty(g) then null else Text.Combine(g, ", ")'
      description: 'The register gaps against this stakeholder in words: no contact, no service desk, referenced nowhere. Blank when the row is complete.'
    # True when the stakeholder has at least one register gap.
    - kind: expr
      name: HasRegisterGap
      type: logical
      m: '[ContactMissing] or [ServiceDeskMissing] or [IsUnreferenced]'
      description: 'True when the stakeholder has at least one register gap.'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Fix'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Fix"'
      description: 'A constant link label (''Fix''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  BusinessProcess:
    - kind: expr
      name: IsInQueue
      type: logical
      m: 'not List.Contains({"Mapped", "Out of scope"}, [MappingStatus])'
    - kind: expr
      name: ScoreBand
      type: text
      m: 'if [PriorityScore] = null then null else if [PriorityScore] >= 6 then "Now" else if [PriorityScore] >= 3 then "Next" else "Later"'
    - kind: expr
      name: PriorityDisagreesWithScore
      type: logical
      m: '[ScoreBand] <> null and [ScoreBand] <> [MappingPriority] and Text.Length(Text.Trim([PriorityNote] ?? "")) = 0'
    - kind: expr
      name: MappedWithoutLink
      type: logical
      m: '[MappingStatus] = "Mapped" and Text.Length(Text.Trim([MapUrlUrl] ?? "")) = 0'
    - kind: expr
      name: NeverSwept
      type: logical
      m: '[LastReviewedDate] = null'
    - kind: expr
      name: NextReviewDue
      type: date
      m: 'if [NextReviewDue] <> null then [NextReviewDue] else if [LastReviewedDate] = null then null else Date.AddMonths([LastReviewedDate], 12)'
      replace: true
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Update'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Update"'
      description: 'A constant link label (''Update''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  Workstream:
    - kind: count
      from: Activity
      via: Workstream
      name: CurrentLeadCount
      aggregate: count
      type: Int64
      where: '[ActivityRole] = "Workstream lead" and [ReviewStatus] = "Current"'
    # Who currently leads this workstream: the accountable person on its current Workstream lead activity. Blank means nobody holds the position. More than one name means the position is unclear.
    - kind: count
      from: Activity
      via: Workstream
      name: CurrentLead
      aggregate: names
      type: text
      column: AccountableTitle
      where: '[ActivityRole] = "Workstream lead" and [ReviewStatus] = "Current"'
      description: 'Who currently leads this workstream: the accountable person on its current Workstream lead activity. Blank means nobody holds the position. More than one name means the position is unclear.'
    - kind: expr
      name: IsClosed
      type: logical
      m: '[Phase] = "Closed"'
    # Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.
    - kind: expr
      name: ItemEditURL
      type: text
      m: 'if [ItemURL] = null then null else Text.Replace([ItemURL], "DispForm.aspx", "EditForm.aspx")'
      hidden: true
      description: 'Link to the SharePoint edit form for this item; tables show it as the link behind the Open Item column.'
    # A constant link label ('Update'): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.
    - kind: expr
      name: OpenItem
      type: text
      m: '"Update"'
      description: 'A constant link label (''Update''): in a table it opens the SharePoint edit form for the row so the register can be updated from the report.'
  Involvement:
    # Whether this involvement has actually happened. Blank on rows that predate engagement tracking, which read as not engaged until somebody sets them.
    - kind: expr
      name: IsEngaged
      type: logical
      m: '[EngagementStatus] = "Engaged"'
      description: 'Whether this involvement has actually happened. Blank on rows that predate engagement tracking, which read as not engaged until somebody sets them.'
    # An involvement the programme has agreed is necessary and has not yet had. Identified means nobody has approached them; Scheduled means a date is set.
    - kind: expr
      name: IsAwaitingEngagement
      type: logical
      m: '[EngagementStatus] = "Identified" or [EngagementStatus] = "Scheduled"'
      description: 'An involvement the programme has agreed is necessary and has not yet had. Identified means nobody has approached them; Scheduled means a date is set.'
    # Whether the row says how far the involvement has got at all. SharePoint applies a column default to new items only, so every row created before release 3.2.0 reads blank until somebody sets it.
    - kind: expr
      name: EngagementStatusRecorded
      type: logical
      m: '[EngagementStatus] <> null and [EngagementStatus] <> ""'
      description: 'Whether the row says how far the involvement has got at all. SharePoint applies a column default to new items only, so every row created before release 3.2.0 reads blank until somebody sets it.'
    # Whether a next contact date is set. A scheduled involvement with no date is a plan with no commitment.
    - kind: expr
      name: HasNextContact
      type: logical
      m: '[NextContact] <> null'
      description: 'Whether a next contact date is set. A scheduled involvement with no date is a plan with no commitment.'

# Group membership is neither declared nor reconciled by the deployer, so
# populating these is a documented post-deploy step with a release-checklist
# line. require_empty_at_deploy is deliberately NOT set on any family
# group: the next deployment would reject a correctly populated group.
