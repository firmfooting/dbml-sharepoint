notes: |
  The groups are renamed to `Managed ...`; a site holding the `dbml` groups
  gets new empty ones and must re-add its members.
  Contract register template. Bump schema_version when you change the DBML
  or mapping and redeploy. The stamp is how a live site is traced back to
  the exact schema that provisioned it.
