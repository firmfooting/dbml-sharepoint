# Contract register: physical mapping.
prefix: "CT_"

entities:
  Contract: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 100
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

calculated_formulas:
  Contract:
    TermMonths: '=IF(OR(ISBLANK([StartDate]),ISBLANK([EndDate])),"",DATEDIF([StartDate],[EndDate],"m"))'

# Security: contract data is commercially sensitive. Ordinary Members READ;
# the contract-managers group maintains rows; Full Control lives only in the
# empty-by-default admin group (operator self-enrolled per deploy run).
groups:
  - name: "CT Contract Managers"
    description: "Staff who create and maintain contract records."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "dbml List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: "dbml Enterprise Readers"
    description: "Read-only accounts for aggregated cross-site reporting. Empty by default; membership is operator-owned."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

permission_levels: []

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "CT Contract Managers" }
        level: "Contribute"
      - principal: { kind: group, name: "dbml List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Read"
      - principal: { kind: associated_owner_group }
        level: "Read"
      - principal: { kind: group, name: "dbml Enterprise Readers" }
        level: "Read"

# UI hardening (tamper-resilience): site owners/admins bypass every ACL,
# so the realistic threat is well-meaning UI tampering. Sealed columns
# block schema edits and deletion of every deployed column through the
# UI even for site admins (display-name renames stay possible: drift,
# reverted on re-paste; the deployer unseals for its own runs and
# re-seals in Phase 4.1); prevent_list_deletion blocks UI deletion of the
# list objects (rollback.js clears it per list after you confirm that
# list's deletion). Friction + tamper-evidence, not enforcement. See
# "The shared security model" in templates/README.md.
seal_columns: true
prevent_list_deletion: true

# Backend internal names stay exactly as authored in the DBML (views,
# indexes and the TermMonths formula all key on them); the deployer renames
# the display Title after create. PascalCase splitting handles every column
# here except the initialism in DocumentUrl, which auto-splits to
# "Document Url".
display_names:
  mode: auto
  overrides:
    Contract:
      DocumentUrl: "Document URL"

# Column formatting: the fleet style standard (dbml-sharepoint
# website/docs/reference/style-guide.md). Status columns render as
# SharePoint's own severity boxes with icons, consistent across every
# template. Tokens map by the ROLE a member plays in the lifecycle, never
# by its name.
column_formatting:
  Contract:
    # "In renewal" moves from neutral to warning. Neutral is the intake
    # band (a row nobody has looked at yet) and a contract in renewal
    # talks is the opposite of that: it is a decision someone is holding,
    # inside a notice window, which is the "needs attention" role.
    Status:
      style: severity
      map:
        Draft: neutral
        Active: low
        Expiring: severe
        "In renewal": warning
        Exited: muted
    # Not a lifecycle, but the one field on the form that decides whether
    # this contract can renew itself while nobody is watching. Auto-renews
    # is the state that needs attention; a fixed term cannot surprise
    # anyone, so it reads as muted.
    RenewalType:
      style: severity
      map:
        "Auto-renews": warning
        "Manual renewal": low
        "Fixed term — no renewal": muted
    # The register's deadline. Guarded on Exited: a date that keeps
    # shouting after the contract has ended trains people to ignore the
    # colour. Note the guard is NOT on Expiring: an expiring contract is
    # exactly the row the escalation is for.
    EndDate: { style: overdue-date, guard: { field: Status, not: [Exited] } }
    # Calculated whole months, so `calculated: true` (the value arrives
    # prefixed `number;#`). max 60 is five years, long enough that a
    # normal services contract reads as a partial bar and a decade-long
    # lease pins full, which is the comparison the column is for.
    TermMonths: { style: data-bar, max: 60, calculated: true }
    # AnnualValue and NoticePeriodDays are deliberately NOT data-bars.
    # A data-bar needs an explicit `max`, and neither has one that is
    # defensible across adopters: a bar scaled to someone else's contract
    # values is a bar that reads as full or empty for everyone.

# Every lens on this list shows the same five identifying columns before
# its own payload, so the spine is declared once (§1.9: a set earns its
# place at three or more repetitions; this one is used by all five views).
field_sets:
  Contract:
    identity: [Title, Counterparty, ContractType, Owner, Status]

# Declared views (deployed and reconciled by the views phase; undeclared
# views are never touched). "Live contracts" is the default working list;
# the four lenses are the ones 30-deploy/deploy.md used to ask the adopter
# to build by hand, now with filters, sorts and pixel widths. Widths are
# keyed on INTERNAL names. The build rewrites them to display titles,
# because ColumnWidth binds by display name and an internal name silently
# resets.
views:
  Contract:
    - title: "Live contracts"
      default: true
      fields: ["@identity", StartDate, EndDate, TermMonths, AnnualValue]
      where:
        - { field: Status, op: neq, value: "Exited" }
      sort:
        - { field: EndDate, direction: asc }
      widths:
        Title: 280
        Counterparty: 180
        ContractType: 130
        Owner: 160
        Status: 110
        StartDate: 160
        EndDate: 160
        TermMonths: 140
        AnnualValue: 140
    # The deadline lens. today+90 is a ROLLING window, not "next quarter":
    # CAML has no calendar predicate, and the register's own governance
    # cadence is monthly, so a rolling ninety days is the honest reading of
    # "expiring soon".
    - title: "Expiring 90 days"
      fields: ["@identity", EndDate, NoticePeriodDays, RenewalType]
      where:
        - { field: Status, op: neq, value: "Exited" }
        - { field: EndDate, op: leq, value: today+90 }
      sort:
        - { field: EndDate, direction: asc }
      widths:
        Title: 300
        Counterparty: 180
        ContractType: 130
        Owner: 160
        Status: 110
        EndDate: 160
        NoticePeriodDays: 150
        RenewalType: 220
    # The one view that exists to prevent a renewal nobody chose. The
    # notice period sits beside the end date on purpose: the last date a
    # decision can be made is EndDate minus NoticePeriodDays, and the
    # register deliberately does not calculate it. The notice window is a
    # contract term that changes at renewal, so a derived column would be
    # silently wrong on every historic row.
    - title: "Auto-renewals"
      fields: ["@identity", RenewalType, NoticePeriodDays, EndDate]
      where:
        - { field: Status, op: neq, value: "Exited" }
        - { field: RenewalType, op: eq, value: "Auto-renews" }
      sort:
        - { field: EndDate, direction: asc }
      widths:
        Title: 300
        Counterparty: 180
        ContractType: 130
        Owner: 160
        Status: 110
        RenewalType: 220
        NoticePeriodDays: 150
        EndDate: 160
    - title: "By counterparty"
      fields: ["@identity", EndDate, AnnualValue]
      where:
        - { field: Status, op: neq, value: "Exited" }
      group_by: { field: Counterparty, collapsed: true }
      sort:
        - { field: EndDate, direction: asc }
      widths:
        Title: 280
        Counterparty: 180
        ContractType: 130
        Owner: 160
        Status: 110
        EndDate: 160
        AnnualValue: 140
    - title: "Exited"
      fields: ["@identity", StartDate, EndDate, TermMonths, AnnualValue]
      where:
        - { field: Status, op: eq, value: "Exited" }
      sort:
        - { field: EndDate, direction: desc }
      widths:
        Title: 260
        Counterparty: 180
        ContractType: 130
        Owner: 160
        Status: 110
        StartDate: 160
        EndDate: 160
        TermMonths: 140
        AnnualValue: 140

# Form layouts: a strapline header and a sectioned body. Per-field
# description hints render on the NEW form only. The edit form suppresses
# column descriptions (platform limitation). Section field lists are
# authored with INTERNAL names; the build rewrites them to display titles.
form_formatting:
  Contract:
    header: formatting/contract-form-header.json
    body: formatting/contract-form-body.json

# A notice period is a term of a renewable agreement. On a fixed term with
# no renewal there is nothing to give notice of, so the field leaves the
# form there rather than sitting empty and inviting a number that means
# nothing. It pairs with the save rule below: the field is visible exactly
# when it can be mandatory.
#
# Deliberately NOT declared: any rule conditioned on TermMonths.
# Conditional show/hide cannot read a calculated column. The formula stays
# syntactically valid, so it saves, the readback compares equal and the
# phase passes, but the form never reacts. The build refuses it.
form_visibility:
  Contract:
    columns:
      NoticePeriodDays:
        when:
          - { field: RenewalType, op: neq, value: "Fixed term — no renewal" }

# Per-column save rules. Each column carries its own formula and its own
# message, and they all run, unlike list_validation, where a list has one
# ValidationFormula and every cross-column rule has to share one message.
column_validation:
  Contract:
    columns:
      # A negative notice period is a typed minus sign, and it inverts the
      # only arithmetic anyone ever does with this column.
      NoticePeriodDays:
        when:
          - { field: NoticePeriodDays, op: geq, value: 0 }
        message: "Notice period is a number of days, counted forward. Enter 0 if no notice is required."
      AnnualValue:
        when:
          - { field: AnnualValue, op: geq, value: 0 }
        message: "Annual value cannot be negative. Leave it blank if the contract has no recurring value."

# Save-time enforcement, stored on the LIST so it may reference any column.
#
# NOT enforceable here, and therefore left to the governance cadence:
# EndDate after StartDate. The condition grammar compares a column to a
# LITERAL, never to another column, so "EndDate > StartDate" has no
# spelling. See 50-govern/governance.md.
list_validation:
  Contract:
    when:
      # Written as an implication: `if A then B` is `any_of[not A, B]`.
      # An auto-renewing contract with no notice period is the exact
      # failure this register exists to prevent: the renewal happens, and
      # nobody knew when the last chance to stop it was.
      - any_of:
          - { field: RenewalType, op: neq, value: "Auto-renews" }
          - { field: NoticePeriodDays, op: is_not_null }
    message: "An auto-renewing contract needs a Notice Period Days value. That number is the only thing standing between this contract and a renewal nobody chose."

# Demo rows (emitted as demo-data.js ONLY when built with --seed). Every
# Title starts "[DEMO] ", the marker rollback.js trusts to delete
# demo-only lists without the non-empty refusal. Dates are today±N so the
# expiry surfaces land on whatever day the demo runs; "@me" is the pasting
# operator. Coverage: one row per Status member, an auto-renewer already
# inside its own notice window, and an exited contract for the history lens.
demo_items:
