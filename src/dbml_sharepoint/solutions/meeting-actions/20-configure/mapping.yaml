# Meeting actions: physical mapping.
prefix: "MA_"

entities:
  Meeting:    { kind: List, base_template: 100, site_role: default }
  Decision:   { kind: List, base_template: 100, site_role: default }
  ActionItem: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 100
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# Security: recording meetings is everyone's job. Members and Owners hold
# Contribute; Full Control confined to the empty-by-default admin group.
groups:
  - name: "dbml List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: "dbml Enterprise Readers"
    description: "Read-only accounts for aggregated cross-site reporting. Empty by default; membership is operator-owned."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

permission_levels: []

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "dbml List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Contribute"
      - principal: { kind: associated_owner_group }
        level: "Contribute"
      - principal: { kind: group, name: "dbml Enterprise Readers" }
        level: "Read"

# UI hardening (tamper-resilience): site owners/admins bypass every ACL,
# so the realistic threat is well-meaning UI tampering. Sealed columns
# block schema edits and deletion of every deployed column through the
# UI even for site admins (display-name renames stay possible: drift,
# reverted on re-paste; the deployer unseals for its own runs and
# re-seals in Phase 4.1); prevent_list_deletion blocks UI deletion of the
# list objects (rollback.js clears it per list after you confirm that
# list's deletion). Friction + tamper-evidence, not enforcement. See
# "The shared security model" in templates/README.md.
seal_columns: true
prevent_list_deletion: true

# Backend internal names stay exactly as authored in the DBML (the two
# lookups, the indexes, the views and the reporting bundle all key on
# them); the deployer renames the display Title after create. Auto
# splitting handles every column here except the URL one, which it renders
# "Minutes Url".
display_names:
  mode: auto
  overrides:
    Meeting:
      MinutesUrl: "Minutes URL"

# Column formatting: the fleet style standard (dbml-sharepoint
# website/docs/reference/style-guide.md). Status columns render as
# SharePoint's own severity boxes with icons, consistent across every
# template.
#
# Only ActionItem carries any, and the two omissions are deliberate.
# MeetingDate is when a meeting HAPPENED, not a deadline; reddening every
# past meeting would be the whole list. MeetingType is a taxonomy of
# forums rather than a lifecycle, so giving it severity tokens would hand
# the fleet's colour vocabulary a second, incompatible meaning (see the
# style guide's role-not-word rule). Decision has no column that carries a
# state at all: a decision is a fact, which is the point of the list.
column_formatting:
  ActionItem:
    Status: { style: severity, map: { Open: low, "In progress": low, Done: good, Dropped: muted } }
    DueDate: { style: overdue-date, guard: { field: Status, not: [Done, Dropped] } }

# Every action view shows the same five identifying columns and then its
# own payload, so the spine is declared once (five repetitions).
field_sets:
  ActionItem:
    action: [Title, Meeting, AssignedTo, DueDate, Status]

# Declared views (deployed and reconciled by the views phase; undeclared
# views are never touched). Widths are pixel ColumnWidth per view and the
# keys are INTERNAL names. The build rewrites them to display titles,
# because ColumnWidth binds by display name and an internal name silently
# resets.
views:
  Meeting:
    # A ROLLING NINETY DAYS, not "this quarter". CAML has no calendar
    # predicate (today±N is what exists) and the two differ on the first
    # day of a quarter, which is exactly when someone assembling a
    # committee pack will notice. The title says "Recent" rather than
    # naming a period, so it cannot lie about which.
    - title: "Recent"
      default: true
      fields: [Title, MeetingType, MeetingDate, Chair, MinutesUrl]
      where:
        - { field: MeetingDate, op: geq, value: today-90 }
      sort:
        - { field: MeetingDate, direction: desc }
      widths:
        Title: 300
        MeetingType: 200
        MeetingDate: 160
        Chair: 160
        MinutesUrl: 180
    # Deliberately unfiltered, so no meeting is ever reachable only
    # through All Items. This is where a chair reads their own forum's
    # history back, however old.
    - title: "By forum"
      fields: [Title, MeetingType, MeetingDate, Chair, MinutesUrl]
      group_by: { field: MeetingType, collapsed: true }
      sort:
        - { field: MeetingDate, direction: desc }
      widths:
        Title: 300
        MeetingType: 200
        MeetingDate: 160
        Chair: 160
        MinutesUrl: 180
  Decision:
    # "Sorted newest first" is what the published table asked for, and
    # Decision carries no date of its own; the date belongs to the
    # meeting, on the other list, which CAML cannot sort across. Created
    # is the honest proxy rather than a new column: decisions are entered
    # during or straight after the meeting (see 40-adopt/staff-guide.md),
    # so creation order IS meeting order in practice, and adding a date
    # column would ask the minute-taker to retype something the lookup
    # already knows. Shown, not just sorted on, so nobody has to guess
    # what "newest" means here.
    - title: "Decision log"
      default: true
      fields: [Title, Meeting, Created]
      sort:
        - { field: Created, direction: desc }
      widths:
        Title: 320
        Meeting: 220
        Created: 160
    - title: "By meeting"
      fields: [Title, Meeting, Created]
      group_by: { field: Meeting, collapsed: true }
      sort:
        - { field: Created, direction: desc }
      widths:
        Title: 320
        Meeting: 220
        Created: 160
  ActionItem:
    - title: "Open by person"
      default: true
      fields: ["@action", Notes]
      where:
        - { field: Status, op: in, value: ["Open", "In progress"] }
      group_by: { field: AssignedTo, collapsed: true }
      sort:
        - { field: DueDate, direction: asc }
      widths:
        Title: 280
        Meeting: 220
        AssignedTo: 160
        DueDate: 160
        Status: 120
        Notes: 200
    # 40-adopt/staff-guide.md used to say "the Open by person view
    # filtered to you", which meant filtering it by hand every time. This
    # is that view, filtered by SharePoint: AssignedTo is a person column,
    # which is exactly the case the current-user sentinel exists for.
    - title: "My actions"
      fields: ["@action", Notes]
      where:
        - { field: AssignedTo, op: eq, value: me }
        - { field: Status, op: in, value: ["Open", "In progress"] }
      sort:
        - { field: DueDate, direction: asc }
      widths:
        Title: 280
        Meeting: 220
        AssignedTo: 160
        DueDate: 160
        Status: 120
        Notes: 200
    - title: "Overdue"
      fields: ["@action", Notes]
      where:
        - { field: Status, op: in, value: ["Open", "In progress"] }
        - { field: DueDate, op: lt, value: today }
      sort:
        - { field: DueDate, direction: asc }
      widths:
        Title: 280
        Meeting: 220
        AssignedTo: 160
        DueDate: 160
        Status: 120
        Notes: 200
    # THE PUBLISHED ROW WAS "This meeting, filter by Meeting, link it
    # from the agenda". A static view cannot filter to one parent record.
    # This is one grouped view instead: open the previous meeting's group
    # as the first agenda item, which is the habit 50-govern/governance.md
    # calls the difference between a register and a graveyard. Unfiltered
    # on purpose: "did anyone do them?" needs the Done and Dropped rows
    # in the answer.
    - title: "By meeting"
      fields: ["@action", CompletedDate]
      group_by: { field: Meeting, collapsed: true }
      sort:
        - { field: DueDate, direction: asc }
      widths:
        Title: 280
        Meeting: 220
        AssignedTo: 160
        DueDate: 160
        Status: 120
        CompletedDate: 160
    - title: "Done and dropped"
      fields: ["@action", CompletedDate, Notes]
      where:
        - { field: Status, op: in, value: ["Done", "Dropped"] }
      sort:
        - { field: CompletedDate, direction: desc }
      widths:
        Title: 280
        Meeting: 220
        AssignedTo: 160
        DueDate: 160
        Status: 120
        CompletedDate: 160
        Notes: 200

# Form layouts: a strapline header and a sectioned body per list. Section
# field lists are authored with INTERNAL names; the build rewrites them to
# display titles. Per-field description hints render on the NEW form only.
# SharePoint suppresses column descriptions on the Edit form.
#
# These forms matter more than most in the library. This is the
# fastest-payback template here (three lists filled in during or straight
# after every meeting), so a form that asks one avoidable question costs
# that question at every meeting a team ever holds.
form_formatting:
  Meeting:
    header: formatting/meeting-form-header.json
    body: formatting/meeting-form-body.json
  Decision:
    header: formatting/decision-form-header.json
    body: formatting/decision-form-body.json
  ActionItem:
    header: formatting/actionitem-form-header.json
    body: formatting/actionitem-form-body.json

# A completion date only exists once the action is done, and Status
# defaults to Open, so the field is absent on the New form and appears the
# moment someone sets Status to Done. It pairs with the save rule below:
# the field is on screen exactly when it is mandatory, rather than firing a
# refusal about a field the author cannot see.
#
# Moving Status back off Done does NOT clear a date already entered
# (SharePoint has no such mechanism), so the field hides while keeping its
# value.
form_visibility:
  ActionItem:
    columns:
      CompletedDate:
        when:
          - { field: Status, op: eq, value: "Done" }

# Per-column save rules. Each column carries its own formula and its own
# message, and they all run, unlike list_validation, where a list has one
# ValidationFormula and every cross-column rule shares one message.
column_validation:
  ActionItem:
    columns:
      # An action cannot have been completed tomorrow. Left unchecked, a
      # forward-dated completion sorts to the top of "Done and dropped"
      # and reads as the most recent thing the team finished.
      CompletedDate:
        when:
          - { field: CompletedDate, op: leq, value: today }
        message: "An action cannot have been completed in the future. Use the date the work was actually finished."

# Save-time enforcement, stored on the LIST so it may reference any column.
# ONE rule, and it is the register's own data-quality rule #2 made real:
# a completion date accompanies every Done.
#
# Dropped is deliberately NOT included. 40-adopt/staff-guide.md asks for a
# note when an action is dropped, and that stays a habit rather than a
# rule: dropping an action is already the honest move against leaving it
# Open, and a template whose first act is to make the honest move harder
# than the dishonest one has got its incentives backwards.
list_validation:
  ActionItem:
    when:
      any_of:
        - { field: Status, op: neq, value: "Done" }
        - { field: CompletedDate, op: is_not_null }
    message: "An action marked Done needs a completed date. If it is finished but you cannot say when, it is still In progress."

# Demo rows (emitted as demo-data.js ONLY when built with --seed). Every
# Title starts "[DEMO] ", the marker rollback.js trusts to delete
# demo-only lists without its non-empty refusal. Dates are today±N so the
# date-derived views land correctly on whatever day the demo runs, and
# "@me" is the pasting operator.
#
# MinutesUrl is left blank on every demo meeting. A SharePoint URL column
# takes a structured SP.FieldUrlValue over REST rather than a bare string
# (see the note at generators/reportgen.py, which handles the read side of
# exactly that record) and the demo writer emits literals; seeding one
# would be a write this repository has not read back from a live list.
#
# Coverage: four meetings across four forums including one older than the
# Recent window, three decisions stated as decisions, and six actions
# spanning every status, one of them overdue and still open, which is the
# row the whole follow-up discipline is about.
demo_items:
  Meeting:
    - key: mtg-ops
      values:
        Title: "[DEMO] Ops team — this week"
        MeetingType: "Team meeting"
        MeetingDate: "today-2"
        Chair: "@me"
        Notes: "Demo row. Weekly. First agenda item is the previous meeting's actions, read straight off the By meeting view."
    - key: mtg-project
      values:
        Title: "[DEMO] Rollout project — fortnightly"
        MeetingType: "Project meeting"
        MeetingDate: "today-14"
        Chair: "@me"
    - key: mtg-leadership
      values:
        Title: "[DEMO] Leadership group — last month"
        MeetingType: "Leadership / board"
        MeetingDate: "today-28"
        Chair: "@me"
    - key: mtg-working-group
      values:
        Title: "[DEMO] Access working group — foundation meeting"
        MeetingType: "Working group"
        MeetingDate: "today-200"
        Chair: "@me"
        Notes: "Demo row. Older than the rolling ninety days, so it is absent from Recent and present in By forum, which is why By forum carries no filter."
  Decision:
    - key: dec-huddle
      values:
        Title: "[DEMO] We will move the ops huddle to 08:30 from the first of next month"
        Meeting: { demo_ref: mtg-ops }
        Detail: "Demo row. Options were 08:00, 08:30 and keeping 09:00. Night shift handover finishes 08:15, so 08:00 was never real. Two people preferred 09:00 and said so; the decision stands and is reviewed after a month."
    - key: dec-scope
      values:
        Title: "[DEMO] We will drop the reporting module from phase one"
        Meeting: { demo_ref: mtg-project }
        Detail: "Demo row. Phase one ships without reporting; the module moves to phase two with its own budget line. Recorded here so nobody rediscovers the argument in November."
    - key: dec-vendor
      values:
        Title: "[DEMO] We will extend the current vendor contract by six months"
        Meeting: { demo_ref: mtg-leadership }
        Detail: "Demo row. Extension rather than retender, to keep the rollout and the procurement off the same quarter. This log records that the decision happened; the contract itself still goes through the normal approval."
  ActionItem:
    - key: act-comms
      values:
        Title: "[DEMO] Draft the rollout comms for the phase-one scope"
        Meeting: { demo_ref: mtg-project }
        AssignedTo: "@me"
        DueDate: "today+5"
        Status: "Open"
    - key: act-roster
      values:
        Title: "[DEMO] Update the roster template for the new huddle time"
        Meeting: { demo_ref: mtg-ops }
        AssignedTo: "@me"
        DueDate: "today+9"
        Status: "In progress"
        Notes: "Draft with the roster group; back before the change takes effect."
    - key: act-vendor
      values:
        Title: "[DEMO] Send the extension paperwork to the vendor"
        Meeting: { demo_ref: mtg-leadership }
        AssignedTo: "@me"
        DueDate: "today-4"
        Status: "Open"
        Notes: "Demo row. Overdue and still Open. Its date is red everywhere it appears, and it is the row the Overdue view puts in front of the chair every week until it moves."
    - key: act-review
      values:
        Title: "[DEMO] Review the huddle time change after a month"
        Meeting: { demo_ref: mtg-ops }
        AssignedTo: "@me"
        DueDate: "today+30"
        Status: "Open"
        Notes: "The review the decision promised, an action rather than a good intention, which is the only difference that matters."
    - key: act-brief
      values:
        Title: "[DEMO] Brief the reporting stakeholders on the phase-one cut"
        Meeting: { demo_ref: mtg-project }
        AssignedTo: "@me"
        DueDate: "today-10"
        Status: "Done"
        CompletedDate: "today-9"
    - key: act-room
      values:
        Title: "[DEMO] Book a bigger room for the working group"
        Meeting: { demo_ref: mtg-working-group }
        AssignedTo: "@me"
        DueDate: "today-190"
        Status: "Dropped"
        Notes: "Demo row. The group moved online and the action stopped making sense. Dropped honestly beats Done falsely, and it beats an Open row nobody will ever close."
