# Digital innovation log: physical mapping.
prefix: "DI_"

entities:
  Pattern:     { kind: List, base_template: 100, site_role: default }
  Opportunity: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 200
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# The score orders a conversation between Now items. It is never a clinical
# or safety rating; Data Sensitivity and Review Tier carry that concern.
calculated_formulas:
  Opportunity:
    PriorityScore: '=IF(OR(ISBLANK([ValueBand]),ISBLANK([EaseBand])),"",IF([ValueBand]="Tweak",1,IF([ValueBand]="Optimiser",2,3))*IF([EaseBand]="Hard",1,IF([EaseBand]="Moderate",2,3)))'
    PriorityBand: '=IF(ISBLANK([PriorityScore]),"",IF([PriorityScore]>=6,"Prioritise",IF([PriorityScore]>=3,"Consider","Later")))'
    # Derived, so the tier can never disagree with the sensitivity flag.
    ReviewTier: '=IF([DataSensitivity]="Touches patient or clinical workflow data","Clinical or data review",IF([DataSensitivity]="Touches sensitive staff or third-party data","Security review",IF([DataSensitivity]="Not sure","Resolve sensitivity first","Standard")))'
    # Date plus days is the form Learn's common-formulas page documents for
    # a calculated column ("=[Column1]+3").
    AcknowledgeBy: '=IF(ISBLANK([CapturedDate]),"",[CapturedDate]+7)'
    # DATEDIF rejects a reversed range (audit-actions guards the same way),
    # so a date typed before capture reads blank rather than as an error.
    DaysToAcknowledge: '=IF(OR(ISBLANK([CapturedDate]),ISBLANK([AcknowledgedDate])),"",IF([AcknowledgedDate]<[CapturedDate],"",DATEDIF([CapturedDate],[AcknowledgedDate],"d")))'
    DaysToDecision: '=IF(OR(ISBLANK([CapturedDate]),ISBLANK([DecisionDate])),"",IF([DecisionDate]<[CapturedDate],"",DATEDIF([CapturedDate],[DecisionDate],"d")))'
    # Reads Status so a Not adopted outcome date never fills the adoption bar.
    DaysToAdopted: '=IF(OR([Status]<>"Adopted",ISBLANK([CapturedDate]),ISBLANK([AdoptionOutcomeDate])),"",IF([AdoptionOutcomeDate]<[CapturedDate],"",DATEDIF([CapturedDate],[AdoptionOutcomeDate],"d")))'
  Pattern:
    DaysToAvailable: '=IF(OR(ISBLANK([ProposedDate]),ISBLANK([AvailableDate])),"",IF([AvailableDate]<[ProposedDate],"",DATEDIF([ProposedDate],[AvailableDate],"d")))'
    # MIN against the day before the first of the following month holds a
    # 31st to the last real day of the target month (#418).
    # A review date earlier than availability is ignored, so a date typed
    # while the pattern was still in build cannot shorten the first interval.
    NextReviewDue: '=IF(ISBLANK([AvailableDate]),"",IF(OR(ISBLANK([LastReviewedDate]),[LastReviewedDate]<[AvailableDate]),MIN(DATE(YEAR([AvailableDate]),MONTH([AvailableDate])+12,DAY([AvailableDate])),DATE(YEAR([AvailableDate]),MONTH([AvailableDate])+13,0)),MIN(DATE(YEAR([LastReviewedDate]),MONTH([LastReviewedDate])+12,DAY([LastReviewedDate])),DATE(YEAR([LastReviewedDate]),MONTH([LastReviewedDate])+13,0))))'

# Security: everyone reads, including declined and parked rows, because a
# visible backlog is what keeps demand coming through the front door.
# Champions add and edit asks; the digital team works both lists. Neither
# level deletes: an ask that does not stay is Closed, and the route says why.
groups:
  - name: "{prefix} Champions"
    description: "Champions and business analysts who capture asks on behalf of staff and curate them before triage."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "{prefix} Digital Team"
    description: "The digital team: triage, score, decide, build patterns and check adoption."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "dbml List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: "dbml Enterprise Readers"
    description: "Read-only accounts for aggregated cross-site reporting. Empty by default; membership is operator-owned."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

permission_levels:
  # CreateAlerts and ManagePersonalViews are what the built-in Contribute
  # carries and Read does not; without them nobody on a custom level can
  # save the personal view governance asks for or set an alert on a queue.
  - name: "{prefix} Contribute No Delete"
    description: "Add, edit and read items, save personal views and alerts; no deleting and no schema rights."
    base_permissions:
      - AddListItems
      - EditListItems
      - ViewListItems
      - ViewVersions
      - ViewFormPages
      - Open
      - ViewPages
      - BrowseUserInfo
      - UseRemoteAPIs
      - CreateAlerts
      - ManagePersonalViews

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "{prefix} Champions" }
        level: "Read"
      - principal: { kind: group, name: "{prefix} Digital Team" }
        level: "{prefix} Contribute No Delete"
      - principal: { kind: group, name: "dbml List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Read"
      - principal: { kind: associated_owner_group }
        level: "Contribute"
      - principal: { kind: group, name: "dbml Enterprise Readers" }
        level: "Read"
  # Champions add and edit asks but only read the pattern catalogue.
  overrides:
    Opportunity:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Champions" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: group, name: "{prefix} Digital Team" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: associated_member_group }
          level: "Read"
        - principal: { kind: associated_owner_group }
          level: "Contribute"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"

seal_columns: true
prevent_list_deletion: true

display_names:
  mode: auto
  overrides:
    Opportunity:
      ValueBand: "Value"
      EaseBand: "Ease"
      TeamOrUnit: "Team or unit"
      TriageOutcome: "Route"
      DataSensitivity: "Sensitivity"
      HeardAt: "Heard at"
      RequestedFor: "Requested for"
      ReopenTrigger: "Reopen trigger"
      DestinationReference: "Receiving reference"
      DestinationLink: "Receiving record link"
      AcknowledgeBy: "Acknowledge by"
      DeferredUntil: "Deferred until"
      AdoptionOutcomeDate: "Outcome date"
    Pattern:
      GuideLink: "Guide or exemplar link"

# Tokens by the ROLE a value plays (website/docs/reference/style-guide.md).
# Captured is the intake state and neutral; Closed is the terminal for an
# ask that did not stay, and the Route pill beside it says whether it went
# somewhere useful or was declined.
column_formatting:
  Opportunity:
    Status:
      style: severity
      map:
        Captured: neutral
        Exploring: low
        "Awaiting decision": warning
        Accepted: low
        Adopted: good
        "Not adopted": warning
        Closed: muted
    TriageOutcome:
      style: pill
      map:
        "Explore here": low
        "Service request or fault - send to the helpdesk": neutral
        "Already available - show and train": good
        "Process change - improvement register": low
        "Project-sized - project pipeline": low
        "Incident, complaint, privacy or cyber - mandated system": severe
        "Duplicate - merge into the earlier ask": muted
        "Not now": muted
    DataSensitivity:
      style: severity
      map:
        "No patient or sensitive data": good
        "Touches patient or clinical workflow data": severe
        "Touches sensitive staff or third-party data": warning
        "Not sure": neutral
    ValueBand:
      style: pill
      map: { Tweak: neutral, Optimiser: low, "Game change": good }
    EaseBand:
      style: pill
      map: { Hard: warning, Moderate: low, Easy: good }
    Evidence:
      style: pill
      map: { Assumed: neutral, Observed: low, Measured: good }
    ReviewTier:
      style: severity
      calculated: true
      map: { Standard: neutral, "Clinical or data review": severe, "Security review": warning, "Resolve sensitivity first": severe }
    Horizon:
      style: pill
      map: { Now: good, "Next wave": low, Later: neutral, Strategic: warning }
    PriorityBand:
      style: severity
      calculated: true
      map: { Later: neutral, Consider: low, Prioritise: good }
    PriorityScore:
      style: data-bar
      max: 9
      calculated: true
      color_by:
        field: ValueBand
        map: { Tweak: neutral, Optimiser: low, "Game change": good }
    DaysToAdopted:
      style: data-bar
      max: 120
      calculated: true
      color_by:
        field: ValueBand
        map: { Tweak: neutral, Optimiser: low, "Game change": good }
    # Shouts only while the ask is still Captured: acknowledgement happens at
    # triage, and a row that has moved on has been answered.
    AcknowledgeBy:
      style: overdue-date
      calculated: true
      guard: { field: Status, not: [Exploring, "Awaiting decision", Accepted, Adopted, "Not adopted", Closed] }
    AdoptionCheckDue:
      style: overdue-date
      guard: { field: Status, not: [Captured, Exploring, "Awaiting decision", Adopted, "Not adopted", Closed] }
    # A Later ask comes back on this date; it shouts only while still open.
    DeferredUntil:
      style: overdue-date
      guard: { field: Status, not: [Captured, Accepted, Adopted, "Not adopted", Closed] }
  Pattern:
    Status:
      style: severity
      map: { Proposed: neutral, Building: low, Piloting: low, Available: good, Retired: muted }
    Readiness:
      style: pill
      map: { "Available now": good, "Later rollout wave": low, "Needs licence or approval": warning, "Not available": severe }
    EffortBand:
      style: pill
      map: { Small: good, Medium: low, Large: warning }
    GovernanceTier:
      style: pill
      map: { "Self-service": good, "Digital team build": low, "Reviewed build": warning }
    DaysToAvailable:
      style: data-bar
      max: 90
      calculated: true
      color_by:
        field: EffortBand
        map: { Small: good, Medium: low, Large: warning }
    NextReviewDue:
      style: overdue-date
      calculated: true
      guard: { field: Status, not: [Proposed, Building, Piloting, Retired] }

views:
  Opportunity:
    - title: "Needs response"
      default: true
      fields: [Title, ServiceArea, TeamOrUnit, HeardAt, DataSensitivity, Author,
               CapturedDate, AcknowledgeBy, Status]
      where:
        - { field: Status, op: eq, value: Captured }
      sort:
        - { field: CapturedDate, direction: asc }
      widths:
        Title: 320
        ServiceArea: 220
        TeamOrUnit: 180
        HeardAt: 160
        DataSensitivity: 260
        Author: 160
        CapturedDate: 150
        AcknowledgeBy: 150
        Status: 120
    - title: "Exploring"
      fields: [Title, ServiceArea, ValueBand, EaseBand, Evidence, PriorityBand,
               PriorityScore, ReviewTier, Horizon, DeferredUntil, Owner,
               DecisionDate, Status]
      where:
        - { field: Status, op: in, value: [Exploring, "Awaiting decision"] }
      group_by: { field: Horizon, collapsed: false }
      sort:
        - { field: PriorityScore, direction: desc }
      widths:
        Title: 300
        ServiceArea: 210
        ValueBand: 130
        EaseBand: 120
        Evidence: 120
        PriorityBand: 130
        PriorityScore: 140
        Horizon: 120
        DeferredUntil: 150
        Owner: 160
        DecisionDate: 150
        Status: 150
    # Every open ask whose sensitivity calls for a review, whatever its stage,
    # so a named reviewer and a signed date can be checked after acceptance.
    - title: "Review sign-off"
      fields: [Title, ServiceArea, DataSensitivity, ReviewTier, Reviewer, ReviewDate,
               Owner, Sponsor, Status]
      where:
        - { field: DataSensitivity, op: in, value: ["Touches patient or clinical workflow data", "Touches sensitive staff or third-party data", "Not sure"] }
        - { field: Status, op: not_in, value: [Captured, Closed] }
      sort:
        - { field: CapturedDate, direction: asc }
      widths:
        Title: 300
        ServiceArea: 210
        DataSensitivity: 260
        ReviewTier: 200
        Reviewer: 160
        ReviewDate: 150
        Owner: 160
        Sponsor: 160
        Status: 150
    - title: "Delivery and adoption"
      fields: [Title, ServiceArea, TeamOrUnit, Pattern, Owner, Sponsor,
               AdoptionCheckDue, Status]
      where:
        - { field: Status, op: in, value: [Accepted] }
      group_by: { field: Pattern, collapsed: false }
      sort:
        - { field: AdoptionCheckDue, direction: asc }
      widths:
        Title: 300
        ServiceArea: 210
        TeamOrUnit: 180
        Pattern: 240
        Owner: 160
        Sponsor: 160
        AdoptionCheckDue: 170
        Status: 130
    - title: "By area"
      fields: [Title, TeamOrUnit, HeardAt, TriageOutcome, PriorityBand, Horizon,
               CapturedDate, Status]
      where:
        - { field: Status, op: not_in, value: [Adopted, "Not adopted", Closed] }
      group_by: { field: ServiceArea, collapsed: true }
      sort:
        - { field: CapturedDate, direction: asc }
      widths:
        Title: 300
        TeamOrUnit: 180
        HeardAt: 160
        TriageOutcome: 300
        PriorityBand: 130
        Horizon: 120
        CapturedDate: 150
        Status: 150
    - title: "Closed and routed"
      fields: [Title, ServiceArea, TriageOutcome, Status, Pattern, Sponsor,
               DestinationReference, DestinationLink, ReopenTrigger, ValueBand,
               DecisionDate, AdoptionOutcomeDate, DaysToAdopted, AdoptionNote,
               Modified]
      where:
        - { field: Status, op: in, value: [Adopted, "Not adopted", Closed] }
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 300
        ServiceArea: 210
        TriageOutcome: 300
        Status: 130
        Pattern: 240
        Sponsor: 160
        DestinationReference: 220
        DestinationLink: 170
        ReopenTrigger: 280
        ValueBand: 130
        DecisionDate: 150
        AdoptionOutcomeDate: 150
        DaysToAdopted: 140
        AdoptionNote: 280
        Modified: 170
  Pattern:
    - title: "Catalogue"
      default: true
      fields: [Title, Workloads, Readiness, GovernanceTier, EffortBand, BuildOwner,
               GuideLink, ProposedDate, AvailableDate, DaysToAvailable, NextReviewDue,
               Status]
      where:
        - { field: Status, op: eq, value: Available }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 300
        Workloads: 240
        Readiness: 200
        GovernanceTier: 170
        EffortBand: 110
        BuildOwner: 160
        GuideLink: 170
        ProposedDate: 150
        AvailableDate: 150
        DaysToAvailable: 140
        NextReviewDue: 150
        Status: 120
    - title: "In build"
      fields: [Title, Workloads, Readiness, EffortBand, GovernanceTier, PilotTeam,
               ProposedDate, Status]
      where:
        - { field: Status, op: in, value: [Proposed, Building, Piloting] }
      group_by: { field: BuildOwner, collapsed: false }
      sort:
        - { field: ProposedDate, direction: asc }
      widths:
        Title: 300
        Workloads: 240
        Readiness: 200
        EffortBand: 110
        GovernanceTier: 170
        PilotTeam: 200
        ProposedDate: 150
        Status: 120
    - title: "Retired"
      fields: [Title, Workloads, AvailableDate, RetiredDate, RetiredReason, Status]
      where:
        - { field: Status, op: eq, value: Retired }
      sort:
        - { field: RetiredDate, direction: desc }
      widths:
        Title: 300
        Workloads: 240
        AvailableDate: 150
        RetiredDate: 150
        RetiredReason: 320
        Status: 120

# The New form is the champion's minute. Every digital-team column is off it,
# and the later blocks appear only once the row has reached them.
form_visibility:
  Opportunity:
    reconcile: exact
    columns:
      CapturedDate: { new: false }
      TriageOutcome: { new: false }
      Owner: { new: false }
      Status: { new: false }
      AcknowledgedDate: { new: false }
      ValueBand:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Explore here" }
      EaseBand:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Explore here" }
      Evidence:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Explore here" }
      Horizon:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Explore here" }
      DeferredUntil:
        new: false
        when:
          - { field: Horizon, op: eq, value: Later }
      Reviewer:
        new: false
        when:
          - { field: DataSensitivity, op: in, value: ["Touches patient or clinical workflow data", "Touches sensitive staff or third-party data"] }
      ReviewDate:
        new: false
        when:
          - { field: DataSensitivity, op: in, value: ["Touches patient or clinical workflow data", "Touches sensitive staff or third-party data"] }
      Sponsor:
        new: false
        when:
          - { field: Status, op: in, value: ["Awaiting decision", Accepted, Adopted, "Not adopted"] }
      Pattern:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted, Adopted, "Not adopted"] }
      # Always on the edit form: a reopened Not now keeps its old decision
      # until somebody clears it, and hiding the fields would hide that.
      DecisionDate: { new: false }
      DecisionRationale: { new: false }
      ReopenTrigger:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Not now" }
      DestinationReference:
        new: false
        when:
          - { field: TriageOutcome, op: in, value: ["Service request or fault - send to the helpdesk", "Already available - show and train", "Process change - improvement register", "Project-sized - project pipeline", "Incident, complaint, privacy or cyber - mandated system", "Duplicate - merge into the earlier ask"] }
      DestinationLink:
        new: false
        when:
          - { field: TriageOutcome, op: in, value: ["Service request or fault - send to the helpdesk", "Already available - show and train", "Process change - improvement register", "Project-sized - project pipeline", "Incident, complaint, privacy or cyber - mandated system", "Duplicate - merge into the earlier ask"] }
      AdoptionCheckDue:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted] }
      AdoptionOutcomeDate:
        new: false
        when:
          - { field: Status, op: in, value: [Adopted, "Not adopted"] }
      AdoptionNote:
        new: false
        when:
          - { field: Status, op: in, value: [Adopted, "Not adopted"] }
  Pattern:
    reconcile: exact
    columns:
      ProposedDate: { new: false }
      PilotTeam:
        new: false
        when:
          - { field: Status, op: in, value: [Piloting, Available, Retired] }
      AvailableDate:
        new: false
        when:
          - { field: Status, op: in, value: [Available, Retired] }
      LastReviewedDate:
        new: false
        when:
          - { field: Status, op: in, value: [Available, Retired] }
      RetiredDate:
        new: false
        when:
          - { field: Status, op: eq, value: Retired }
      RetiredReason:
        new: false
        when:
          - { field: Status, op: eq, value: Retired }

form_formatting:
  Opportunity:
    header: formatting/opportunity-form-header.json
    body: formatting/opportunity-form-body.json
  Pattern:
    header: formatting/pattern-form-header.json
    body: formatting/pattern-form-body.json

# Per-column rules. Every dated clock in this log is counted from
# CapturedDate, so a future date silently removes a row from the response
# and adoption figures. The date-versus-today rules are hoisted onto the
# list rule at build time (see the mapping reference), so their refusal shows
# the list message; only the two length rules keep a message of their own.
# Acknowledged, Decision, Deferred until and Outcome dates carry no
# future-date rule: the list formula has a 1023-character ceiling and 32
# leaves, and the review, acknowledgement and closure gates below are
# worth more. Governance reads those dates monthly instead.
column_validation:
  Opportunity:
    reconcile: exact
    columns:
      CapturedDate:
        when:
          - { field: CapturedDate, op: leq, value: today }
        message: "An ask cannot be captured in the future. Use the date it was heard, or today."
      # Of the completed-event dates, this is the one whose value gates a
      # status: a future Review Date would let a patient-data ask be accepted
      # before the review happened. Decision Date's presence gates, its value
      # does not, so its future-date rule gave way to this one (round four).
      ReviewDate:
        when:
          any_of:
            - { field: ReviewDate, op: is_null }
            - { field: ReviewDate, op: leq, value: today }
        message: "Use the date the review was signed; it cannot be in the future."
      ReopenTrigger:
        when:
          any_of:
            - { field: ReopenTrigger, op: is_null }
            - { field: ReopenTrigger, measure: length, op: gt, value: 15 }
        message: "Say specifically what would change the answer, in more than 15 characters. Not aligned with strategy tells the requester nothing."
      AdoptionNote:
        when:
          any_of:
            - { field: AdoptionNote, op: is_null }
            - { field: AdoptionNote, measure: length, op: gt, value: 10 }
        message: "Say what changed for the team, with a number where there is one."
  Pattern:
    reconcile: exact
    columns:
      ProposedDate:
        when:
          - { field: ProposedDate, op: leq, value: today }
        message: "A pattern cannot be proposed in the future. Use today's date."
      AvailableDate:
        when:
          any_of:
            - { field: AvailableDate, op: is_null }
            - { field: AvailableDate, op: leq, value: today }
        message: "Use the date the pattern actually became available; it cannot be in the future."
      RetiredDate:
        when:
          any_of:
            - { field: RetiredDate, op: is_null }
            - { field: RetiredDate, op: leq, value: today }
        message: "Use the date the pattern was retired; it cannot be in the future."
      LastReviewedDate:
        when:
          any_of:
            - { field: LastReviewedDate, op: is_null }
            - { field: LastReviewedDate, op: leq, value: today }
        message: "Use the date the review actually happened; it cannot be in the future."

# Cross-column rules on the list. Each is written as an implication:
# `if A then B` is `any_of[not A, B]`. Fast exits stay cheap: leaving
# Captured needs a route and an acknowledgement, a closed ask needs its
# receiving reference, and Not now its trigger and a date.
# The score is required from Awaiting decision on, so a row cannot skip
# straight to Accepted unscored. The clinical gate reads Data Sensitivity as
# well as Review Tier, so re-tiering an ask cannot bypass it.
#
# NOT enforceable, and 50-govern/governance.md says so:
#   - "Accepted needs a Pattern": a lookup.
#   - "A reviewed ask names a Reviewer", "an accepted ask names a Sponsor",
#     "an Exploring ask has an Owner": person columns.
#   - "Acknowledged and Decision dates are on or after Captured Date":
#     formulas here compare a column with a literal, not with another column.
#   - "A decided ask has a Decision Rationale": multi-line text.
list_validation:
  Opportunity:
    when:
      # Leaving Captured needs a route and an acknowledgement.
      - any_of:
          - { field: Status, op: eq, value: Captured }
          - all_of:
              - { field: TriageOutcome, op: is_not_null }
              - { field: AcknowledgedDate, op: is_not_null }
      # Route and status bind both ways: Closed needs a route other than
      # Explore here, and any other route allows only Captured or Closed, so
      # a mandated-system ask can never sit in delivery.
      - any_of:
          - { field: Status, op: neq, value: Closed }
          - { field: TriageOutcome, op: neq, value: "Explore here" }
      - any_of:
          - { field: TriageOutcome, op: eq, value: "Explore here" }
          - { field: Status, op: in, value: [Captured, Closed] }
      # The score, from Awaiting decision on.
      - any_of:
          - { field: Status, op: in, value: [Captured, Exploring, Closed] }
          - all_of:
              - { field: ValueBand, op: is_not_null }
              - { field: EaseBand, op: is_not_null }
              - { field: Evidence, op: is_not_null }
              - { field: Horizon, op: is_not_null }
      # Accepted and later: a decision date, a resolved sensitivity, and the
      # signed review date unless the ask touches no patient or sensitive data.
      - any_of:
          - { field: Status, op: not_in, value: [Accepted, Adopted, "Not adopted"] }
          - all_of:
              - { field: DecisionDate, op: is_not_null }
              - { field: DataSensitivity, op: neq, value: "Not sure" }
              - any_of:
                  - { field: DataSensitivity, op: eq, value: "No patient or sensitive data" }
                  - { field: ReviewDate, op: is_not_null }
      # Closing is a decision too: the date is when the ask was routed, merged
      # or declined, and the thirty-day figure is read from it. Every closed
      # route but Not now also needs the receiving reference.
      - any_of:
          - { field: Status, op: neq, value: Closed }
          - all_of:
              - { field: DecisionDate, op: is_not_null }
              - any_of:
                  - { field: TriageOutcome, op: eq, value: "Not now" }
                  - { field: DestinationReference, op: is_not_null }
      # Not now needs its trigger, whatever the status.
      - any_of:
          - { field: TriageOutcome, op: neq, value: "Not now" }
          - { field: ReopenTrigger, op: is_not_null }
      # Both adoption outcomes are dated and explained.
      - any_of:
          - { field: Status, op: not_in, value: [Adopted, "Not adopted"] }
          - all_of:
              - { field: AdoptionOutcomeDate, op: is_not_null }
              - { field: AdoptionNote, op: is_not_null }
    message: "Check this stage: leaving Captured needs a route and an acknowledged date. Only Explore here goes past Captured; every other route closes the ask. Awaiting decision and later need Value, Ease, Evidence and Horizon. Accepted and later need a decision date, a resolved sensitivity, and the signed review date when the ask touches patient or sensitive data. A closed ask needs a decision date and, unless it is Not now, its receiving reference; Not now needs its reopen trigger. Adopted and Not adopted need the outcome date and the note."
  Pattern:
    when:
      - any_of:
          - { field: Status, op: neq, value: Available }
          - { field: AvailableDate, op: is_not_null }
      - any_of:
          - { field: Status, op: neq, value: Retired }
          - all_of:
              - { field: RetiredDate, op: is_not_null }
              - { field: RetiredReason, op: is_not_null }
    message: "An Available pattern needs its Available Date; a Retired one needs its Retired Date and Reason."

