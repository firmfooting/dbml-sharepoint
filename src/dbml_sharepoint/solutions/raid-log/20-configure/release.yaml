release: "1.1.0"
date: "2026-09-04"
deployer_version: "dbml-sharepoint/0.1.0"
schema_version: "1.1.0"
notes: |
  1.1.0 splits ProjectRisk.ReviewDate into LastReviewedDate and
  NextReviewDue. One hand-set date stood for both halves of a review, so
  moving it forward destroyed the evidence that a review had happened and
  nothing could tell an on-time review from a push-out by somebody who had
  not looked. Two save rules now hold the pair: a review cannot be dated in
  the future, and the next one cannot be more than twelve months out.

  The Closed view sorts on LastReviewedDate. It used to sort on the
  forward-looking date as a proxy for the closure, because closing a risk is
  a status change with no closure date; the review at which it was closed is
  now a column rather than a stand-in.

  ReviewDate is RETIRED, not deleted. It keeps its values, drops off every
  view and the New form, and reads "Review Date (retired)". Transfer the
  values, then delete the column with the columns sidecar. Deleting the
  declaration instead would leave a live column the schema no longer knows
  about, reported as user-added drift on every report refresh.

  RAID log template. Bump schema_version on any DBML/mapping change
  before redeploying.
