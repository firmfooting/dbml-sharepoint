        EvidenceHeld: "Provider ticket or system record"
        Severity: Critical
        PeopleAffected: 60
        HoursLost: 120
        ImpactDescription: "Demo row. Front-line work stopped for two and a half hours in the busiest part of the day."
        ServiceCommitment: "[DEMO] Changes to core systems outside business hours with five days notice"
        RaisedWithProvider: "Raised through formal escalation"
        ResponseDueDate: "today-53"
        LastFollowedUp: "today-45"
        ResolvedDate: "today-59"
        OutcomeForUs: "Partially resolved"
        Status: Escalated
        ReviewedBy: "@me"
        ReviewNote: "Demo row. Accepted and escalated: the change record confirms the cause and no notice was issued."
        RelatedIssue: { demo_ref: se-issue-remedy }
    - key: se-event-unsubstantiated
      values:
