        Severity: Minor
        PeopleAffected: 1
        HoursLost: 0.5
        RaisedWithProvider: "Deliberately not raised"
        Status: "Not substantiated"
        ReviewedBy: "@me"
        ReviewNote: "Demo row. Kept, but not substantiated: nothing identifies the requests or the days. This is what an unusable row looks like, and why the form asks how you know."
    - key: se-event-closed
      values:
        Title: "[DEMO] Replacement equipment delivered four days after the agreed date"
        Provider: "[DEMO] Example Service Partner"
        EventNature: "Single occurrence"
        OccurredAt: "today-14"
