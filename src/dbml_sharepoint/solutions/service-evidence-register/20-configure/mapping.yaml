# Service evidence register: physical mapping.
#
# Access is restricted by design: no grant reaches site Members or Owners.
# A register that characterises another organisation's performance carries
# fairness and defamation exposure, and restricting it is also what makes
# people willing to write frankly in it.
prefix: "SE_"

entities:
  ServiceEvent: { kind: List, base_template: 100, site_role: default }
  FollowUp: { kind: List, base_template: 100, site_role: default }
  ServiceIssue: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 200
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# How long they took to respond about their own responsiveness. INT() rather
# than DATEDIF() because it is exact on date serials and unambiguous when one
# operand is a datetime.
calculated_formulas:
  ServiceEvent:
    # INT() rather than DATEDIF() because OccurredAt is a datetime and
    # LoggedDate a date; truncating both to their date serials avoids a
    # fractional-day result.
    DaysToLog: '=IF(OR(ISBLANK([OccurredAt]),ISBLANK([LoggedDate])),"",INT([LoggedDate])-INT([OccurredAt]))'
    RecordTimeliness: '=IF(ISBLANK([DaysToLog]),"",IF([DaysToLog]<=0,"Same day",IF([DaysToLog]<=7,"Within a week",IF([DaysToLog]<=30,"Delayed","Retrospective"))))'
    # SharePoint refuses [Today] in a calculated column, so this can only ever
    # be the closed-book figure. Blank while outstanding is the honest answer;
    # the live ageing belongs to the Outstanding and ageing view and to the
    # @now comparison in the Response Due Date formatter.
    DaysOutstanding: '=IF(OR(ISBLANK([OccurredAt]),ISBLANK([ResolvedDate])),"",INT([ResolvedDate])-INT([OccurredAt]))'
  FollowUp:
    DaysToRespond: '=IF(OR(ISBLANK([FollowUpDate]),ISBLANK([ResponseDate])),"",INT([ResponseDate])-INT([FollowUpDate]))'
  ServiceIssue:
    DaysToResponse: '=IF(OR(ISBLANK([RaisedDate]),ISBLANK([ResponseDate])),"",INT([ResponseDate])-INT([RaisedDate]))'

groups:
  - name: "SE Evidence Contributors"
    description: "Staff who log service events and their follow-ups. Can add and read; cannot edit after saving, because SE Log Only withholds Edit rather than because of any item-level setting."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
  - name: "SE Evidence Curators"
    description: "The small group that reviews events, assembles themes and decides what is raised with the provider."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
  - name: "dbml List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: "dbml Enterprise Readers"
    description: "Read-only accounts for aggregated cross-site reporting. Empty by default; membership is operator-owned."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

permission_levels:
  - name: "SE Log Only"
    description: "Add and read every item; no edit, delete or schema rights. Withholding Edit here is what makes a saved record unalterable, so no item-level setting is required."
    base_permissions:
      - AddListItems
      - ViewListItems
      - ViewVersions
      - ViewFormPages
      - Open
      - ViewPages
      - BrowseUserInfo
      - UseRemoteAPIs

# The default policy is the one ServiceEvent and FollowUp use. ServiceIssue
# overrides it below: what you intend to raise, at what level and when is not
# something everyone who can log an event should read.
list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "SE Evidence Contributors" }
        level: "SE Log Only"
      - principal: { kind: group, name: "SE Evidence Curators" }
        level: "Contribute"
      - principal: { kind: group, name: "dbml List Administrators" }
        level: "Full Control"
      - principal: { kind: group, name: "dbml Enterprise Readers" }
        level: "Read"
  overrides:
    ServiceIssue:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "SE Evidence Curators" }
          level: "Contribute"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"

seal_columns: true
prevent_list_deletion: true

display_names:
  mode: auto
  overrides:
    ServiceEvent:
      Title: "What happened"
      WhatHappened: "The account"
      BasisOfKnowledge: "How you know"
      ProviderReference: "Provider reference"
      EvidenceLink: "Evidence link"
      HoursLost: "Hours lost (estimate)"
      ImpactDescription: "Consequence"
      ServiceCommitment: "Commitment or expectation"
      RaisedWithProvider: "Raised with provider"
      OutcomeForUs: "Outcome for us"
      ReviewNote: "Reviewer's assessment"
      RelatedIssue: "Part of theme"
      DaysToLog: "Days to log"
      DaysOutstanding: "Days outstanding (once resolved)"
    FollowUp:
      Title: "What you asked for"
      RelatedEvent: "Event or request"
      ContactedRole: "Contacted (role or team)"
      WhatWeAsked: "What we asked"
      ResponseReceived: "What came back"
      CommitmentGiven: "Commitment given"
      EvidenceLink: "Evidence link"
    ServiceIssue:
      Title: "The theme"
      IssueSummary: "The pattern"
      EventCount: "Supporting events"
      CommitmentEngaged: "Commitment engaged"
      RaisedWith: "Raised with (role or forum)"
      BusinessConsequence: "Consequence for us"

column_formatting:
  ServiceEvent:
    Severity:
      style: severity
      map: { Minor: neutral, Moderate: low, Major: warning, Critical: severe }
    Status:
      style: severity
      map:
        Logged: neutral
        "Under review": low
        Accepted: good
        Escalated: warning
        Closed: muted
        "Not substantiated": muted
    EventNature:
      style: pill
      map:
        "Single occurrence": neutral
        "Unactioned request or ticket": warning
        "Ongoing or recurring condition": warning
    BasisOfKnowledge:
      style: pill
      map:
        "I observed or experienced this directly": good
        "It was reported to me by a colleague": warning
        "Taken from a system record, ticket or report": good
        "Taken from written correspondence": good
    EvidenceHeld:
      style: severity
      map:
        "Attached to this record": good
        "Provider ticket or system record": good
        "Email or written correspondence": good
        "Screenshot or document held elsewhere": low
        "Contemporaneous note only": warning
        "None - recollection only": severe
    # FailureMode is deliberately NOT formatted. It is a taxonomy rather than
    # a lifecycle or severity column, so the standard does not ask for it;
    # colouring it by badness would double-encode with Severity, which sits
    # beside it in every view that shows both; and a fourteen-member map
    # would be half again the largest in the library. The category is the
    # information here, not a colour.
    RaisedWithProvider:
      style: severity
      map:
        "Not yet raised": warning
        "Raised at the time": good
        "Raised afterwards": low
        "Raised through formal escalation": low
        "Deliberately not raised": muted
    OutcomeForUs:
      style: severity
      map:
        "Resolved satisfactorily": good
        "Resolved after escalation": low
        "Worked around locally": warning
        "Partially resolved": warning
        Unresolved: severe
        "Recurred after resolution": severe
    RecordTimeliness:
      style: severity
      calculated: true
      map:
        "Same day": good
        "Within a week": low
        Delayed: warning
        Retrospective: severe
    # PeopleAffected and HoursLost carry no data-bar, against the style
    # guide's general rule, and the reason is the same for both: a bar needs
    # an explicit max and neither has one that survives contact with a second
    # adopter. An org of twelve and an org of twelve thousand share no scale,
    # and 50-govern calls both figures honest approximations - a bar draws a
    # precision the estimate does not have. They appear in By failure mode
    # and Evidence pack, where the group TOTAL is the comparison that means
    # something, and that is declared on the view rather than on the column.
    #
    # DaysToLog and DaysOutstanding are in no declared view at all, so there
    # is nothing to format. DaysToLog would also double-encode with
    # RecordTimeliness directly above, which already bands it at 0, 7 and 30.
    # The guard cannot express "this date is not blank", so it excludes the
    # resolved outcomes instead. A blank OutcomeForUs is not one of them, so
    # an open item still shows red - which is what we want. A save rule keeps
    # ResolvedDate and the three excluded outcomes consistent in BOTH
    # directions, so the guard cannot be fooled by a resolved row with no
    # outcome recorded, nor by one of these three outcomes with no date.
    ResponseDueDate:
      style: overdue-date
      guard:
        field: OutcomeForUs
        not: ["Resolved satisfactorily", "Resolved after escalation", "Worked around locally"]
  FollowUp:
    ResponseReceived:
      style: severity
      map:
        "No response": severe
        "Acknowledged only": warning
        "Substantive response": good
        "Action taken": good
        "Referred elsewhere": warning
        "Ticket closed without resolution": severe
    EscalationLevel:
      style: pill
      map:
        "Operational contact": neutral
        "Service desk or first line": neutral
        "Service manager": low
        "Relationship or contract manager": warning
        Executive: severe
        "Formal contract mechanism": severe
    # Not a severity judgement about the person who made the call - it is
    # about how easy the chase will be to evidence in six months. A written
    # channel leaves a record; a corridor conversation does not.
    Channel:
      style: pill
      map:
        Email: good
        "Service portal or ticket update": good
        "Phone call": warning
        Meeting: low
        "Instant message or chat": warning
        "In person": warning
        "Formal letter": good
    # DaysToRespond carries no data-bar. The siblings that bar a day-duration
    # key their max to a target stated somewhere in their own template -
    # complaints-feedback to its acknowledgement and close targets, audit-
    # actions to the two months past which the committee stops asking. This
    # register ships no response SLA in days: ResponseDueDate is set per row
    # against the free-text ServiceCommitment, deliberately, because the
    # commitment is the provider's and differs per arrangement. There is no
    # number here to key a max to, and one picked to look reasonable would be
    # a scale nobody agreed.
  ServiceIssue:
    Status:
      style: severity
      map:
        Assembling: neutral
        "Ready to raise": low
        Raised: warning
        "Response received": low
        "Remedy agreed": good
        Resolved: good
        Unresolved: severe
        Closed: muted
    Materiality:
      style: severity
      map:
        Irritant: neutral
        Material: low
        Serious: warning
        "Critical to service": severe
    EscalationLevel:
      style: pill
      map:
        "Operational contact": neutral
        "Service desk or first line": neutral
        "Service manager": low
        "Relationship or contract manager": warning
        Executive: severe
        "Formal contract mechanism": severe
    RemedyDueDate:
      style: overdue-date
      guard: { field: Status, not: [Assembling, "Ready to raise", Raised, "Response received", Resolved, Closed] }
    NextReviewDue:
      style: overdue-date
      guard: { field: Status, not: [Resolved, Closed] }
    # EventCount is a count in a default view, so the style guide's rule
    # reaches it squarely - and it is the one refusal here that is a genuine
    # gap rather than a considered no. A bar needs an explicit max, and this
    # template ships no pack size: the escalation threshold in 50-govern is
    # counted in CHASES against one event, not in events against one theme,
    # and it says in terms that promotion is a curator judgement rather than
    # a number. Picking a max to satisfy the rule would invent the agreement
    # the register spends a section refusing to invent. If you set a pack
    # size for your own service reviews, write it into 50-govern and add
    # `EventCount: { style: data-bar, max: <that number> }` here.
    #
    # DaysToResponse is in no declared view, so there is nothing to format.

# Five on the event log, five on the follow-ups, four on the themes: a
# working list, the things that need chasing, and the history. There is no
# portfolio dashboard - the All Items view is the reporting surface.
views:
  ServiceEvent:
    # The default is the chase worklist, because that is the register's daily
    # job. An empty one is a welcome signal rather than a broken view.
    - title: "Outstanding and ageing"
      default: true
      fields: [Title, Provider, EventNature, ServiceAffected, FailureMode,
               OccurredAt, ResponseDueDate, LastFollowedUp, ProviderReference,
               Severity]
      where:
        - { field: ResolvedDate, op: is_null }
        - { field: EventNature, op: neq, value: "Single occurrence" }
        # A rejected or closed event usually has no Resolved Date - nothing
        # asks for one, because nothing was resolved - so without this it
        # stays in the chase queue for ever. This view does not show Status,
        # so the curator would have no way of telling from here, and the
        # register would have them chasing a provider over an allegation it
        # had already decided against.
        - { field: Status, op: not_in, value: [Closed, "Not substantiated"] }
      sort:
        - { field: OccurredAt, direction: asc }
      widths:
        Title: 300
        Provider: 170
        EventNature: 220
        ServiceAffected: 220
        FailureMode: 260
        OccurredAt: 160
        ResponseDueDate: 160
        LastFollowedUp: 160
        ProviderReference: 180
        Severity: 130
    - title: "Needs review"
      fields: [Title, Provider, FailureMode, Severity, BasisOfKnowledge,
               EvidenceHeld, RecordTimeliness, Author, Status]
      where:
        - { field: Status, op: in, value: [Logged, "Under review"] }
      sort:
        - { field: OccurredAt, direction: asc }
      widths:
        Title: 300
        Provider: 170
        FailureMode: 260
        Severity: 130
        BasisOfKnowledge: 300
        EvidenceHeld: 260
        RecordTimeliness: 150
        Author: 170
        Status: 160
    - title: "By failure mode"
      fields: [Title, Provider, ServiceAffected, Severity, OccurredAt,
               PeopleAffected, HoursLost, Status]
      group_by: { field: FailureMode, collapsed: true }
      totals:
        HoursLost: sum
      sort:
        - { field: OccurredAt, direction: desc }
      widths:
        Title: 300
        Provider: 170
        ServiceAffected: 220
        Severity: 130
        OccurredAt: 160
        PeopleAffected: 140
        HoursLost: 140
        Status: 160
    - title: "Evidence pack"
      fields: [Title, Provider, OccurredAt, FailureMode, Severity,
               ProviderReference, EvidenceHeld, RecordTimeliness, HoursLost,
               ServiceCommitment]
      where:
        - { field: Status, op: in, value: [Accepted, Escalated] }
      group_by: { field: RelatedIssue, collapsed: true }
      totals:
        HoursLost: sum
      sort:
        - { field: OccurredAt, direction: asc }
      widths:
        Title: 280
        Provider: 170
        OccurredAt: 160
        FailureMode: 260
        Severity: 130
        ProviderReference: 180
        EvidenceHeld: 260
        RecordTimeliness: 150
        HoursLost: 140
        ServiceCommitment: 280
    - title: "Closed and not substantiated"
      fields: [Title, Provider, FailureMode, Status, OutcomeForUs,
               ReviewedBy, ReviewNote, Modified]
      where:
        - { field: Status, op: in, value: [Closed, "Not substantiated"] }
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 280
        Provider: 170
        FailureMode: 260
        Status: 160
        OutcomeForUs: 200
        ReviewedBy: 170
        ReviewNote: 320
        Modified: 170
  FollowUp:
    - title: "Awaiting a response"
      default: true
      fields: [Title, RelatedEvent, FollowUpDate, Channel, ContactedRole,
               EscalationLevel, WhatWeAsked]
      where:
        - { field: ResponseReceived, op: eq, value: "No response" }
      sort:
        - { field: FollowUpDate, direction: asc }
      widths:
        Title: 300
        RelatedEvent: 300
        FollowUpDate: 150
        Channel: 220
        ContactedRole: 230
        EscalationLevel: 230
        WhatWeAsked: 320
    # The chase COUNT lives here, as SharePoint's own group count. Nothing
    # maintains it, so nothing can get it wrong - which is why there is no
    # TimesFollowedUp column on ServiceEvent.
    - title: "By event"
      fields: [Title, FollowUpDate, Channel, EscalationLevel,
               ResponseReceived, ResponseDate, DaysToRespond, CommitmentGiven]
      group_by: { field: RelatedEvent, collapsed: true }
      sort:
        - { field: FollowUpDate, direction: asc }
      widths:
        Title: 280
        FollowUpDate: 150
        Channel: 220
        EscalationLevel: 230
        ResponseReceived: 240
        ResponseDate: 150
        DaysToRespond: 150
        CommitmentGiven: 280
    - title: "Escalation trail"
      fields: [Title, RelatedEvent, FollowUpDate, EscalationLevel,
               ContactedRole, ResponseReceived, ResponseSummary]
      where:
        - { field: EscalationLevel, op: in, value: ["Relationship or contract manager", Executive, "Formal contract mechanism"] }
      sort:
        - { field: FollowUpDate, direction: desc }
      widths:
        Title: 280
        RelatedEvent: 300
        FollowUpDate: 150
        EscalationLevel: 230
        ContactedRole: 230
        ResponseReceived: 240
        ResponseSummary: 320
    - title: "Closed without resolving"
      fields: [Title, RelatedEvent, FollowUpDate, ResponseDate,
               ResponseSummary, EvidenceLink]
      where:
        - { field: ResponseReceived, op: eq, value: "Ticket closed without resolution" }
      sort:
        - { field: ResponseDate, direction: desc }
      widths:
        Title: 280
        RelatedEvent: 300
        FollowUpDate: 150
        ResponseDate: 150
        ResponseSummary: 320
        EvidenceLink: 160
    - title: "Recent follow-ups"
      fields: [Title, RelatedEvent, FollowUpDate, Channel, EscalationLevel,
               ResponseReceived, DaysToRespond]
      where:
        - { field: FollowUpDate, op: geq, value: today-90 }
      sort:
        - { field: FollowUpDate, direction: desc }
      widths:
        Title: 280
        RelatedEvent: 300
        FollowUpDate: 150
        Channel: 220
        EscalationLevel: 230
        ResponseReceived: 240
        DaysToRespond: 150
  ServiceIssue:
    - title: "Open issues"
      default: true
      fields: [Title, Provider, ServiceAffected, Materiality, Status,
               EscalationLevel, IssueOwner, EventCount, RemedyDueDate]
      where:
        - { field: Status, op: not_in, value: [Resolved, Unresolved, Closed] }
      sort:
        - { field: FirstObserved, direction: asc }
      # The template's ONE row-level signal (§1.4). Materiality rather than
      # Status = Unresolved, because Unresolved is a concluded state and the
      # wash would have landed on a history view where nobody is working.
      # Same shape as risk-register's Extreme and incident-management's
      # Critical: a severity wash on the view people actually use.
      formatting: formatting/row-issue-critical.json
      widths:
        Title: 300
        Provider: 180
        ServiceAffected: 220
        Materiality: 150
        Status: 160
        EscalationLevel: 230
        IssueOwner: 170
        EventCount: 120
        RemedyDueDate: 160
    - title: "Awaiting response"
      fields: [Title, Provider, Materiality, RaisedDate, RaisedWith,
               EscalationLevel, IssueOwner]
      where:
        - { field: Status, op: eq, value: Raised }
      sort:
        - { field: RaisedDate, direction: asc }
      widths:
        Title: 300
        Provider: 180
        Materiality: 150
        RaisedDate: 150
        RaisedWith: 240
        EscalationLevel: 230
        IssueOwner: 170
    - title: "Remedies due"
      fields: [Title, Provider, Materiality, RemedyAgreed, RemedyDueDate,
               IssueOwner, Status]
      where:
        - { field: Status, op: eq, value: "Remedy agreed" }
        - { field: RemedyDueDate, op: leq, value: today+30 }
      sort:
        - { field: RemedyDueDate, direction: asc }
      widths:
        Title: 280
        Provider: 180
        Materiality: 150
        RemedyAgreed: 300
        RemedyDueDate: 160
        IssueOwner: 170
        Status: 160
    - title: "Concluded"
      fields: [Title, Provider, ServiceAffected, Materiality, Status,
               EscalationLevel, ClosedDate, Outcome]
      where:
        - { field: Status, op: in, value: [Resolved, Unresolved, Closed] }
      sort:
        - { field: ClosedDate, direction: desc }
      widths:
        Title: 280
        Provider: 180
        ServiceAffected: 220
        Materiality: 150
        Status: 160
        EscalationLevel: 230
        ClosedDate: 150
        Outcome: 320

form_visibility:
  ServiceEvent:
    reconcile: exact
    columns:
      # The two chase fields are invisible for a single occurrence, which is
      # what keeps the one-minute capture path intact. They carry no
      # `new: false`: the person logging an unactioned request is the person
      # who knows when a response was promised, and `SE Log Only` withholds
      # Edit, so a field they cannot fill at creation they can never fill.
      #
      # Resolved Date and Outcome for us are deliberately NOT gated on
      # EventNature. A single occurrence can still be resolved - two of the
      # demo rows are - and 30-deploy/deploy.md walks the deployer through
      # filling one in.
      ResponseDueDate:
        when:
          - { field: EventNature, op: neq, value: "Single occurrence" }
      LastFollowedUp:
        when:
          - { field: EventNature, op: neq, value: "Single occurrence" }
      EvidenceLink:
        when:
          - { field: EvidenceHeld, op: in, value: ["Provider ticket or system record", "Email or written correspondence", "Screenshot or document held elsewhere"] }
      Status: { new: false }
      ReviewedBy: { new: false }
      ReviewNote:
        new: false
        when:
          - { field: Status, op: in, value: ["Under review", Accepted, Escalated, Closed, "Not substantiated"] }
      RelatedIssue:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted, Escalated] }
      LoggedDate: { new: false }
  FollowUp:
    reconcile: exact
    columns:
      # Hiding a field does not clear it: switching Response Received back to
      # "No response" leaves any date already typed in Response Date. The
      # chase queue stays honest because "Awaiting a response" filters on
      # Response Received and shows neither Response Date nor Days to
      # Respond.
      ResponseDate:
        when:
          - { field: ResponseReceived, op: neq, value: "No response" }
      ResponseSummary:
        when:
          - { field: ResponseReceived, op: neq, value: "No response" }
      CommitmentGiven:
        when:
          - { field: ResponseReceived, op: in, value: ["Substantive response", "Action taken", "Referred elsewhere"] }
  # The New theme form asks for the pattern and its weight. Everything about
  # raising it appears as the theme reaches that stage.
  ServiceIssue:
    reconcile: exact
    columns:
      Status: { new: false }
      RaisedDate:
        new: false
        when:
          - { field: Status, op: in, value: [Raised, "Response received", "Remedy agreed", Resolved, Unresolved, Closed] }
      RaisedWith:
        new: false
        when:
          - { field: Status, op: in, value: [Raised, "Response received", "Remedy agreed", Resolved, Unresolved, Closed] }
      EscalationLevel:
        new: false
        when:
          - { field: Status, op: in, value: [Raised, "Response received", "Remedy agreed", Resolved, Unresolved, Closed] }
      ResponseDate:
        new: false
        when:
          - { field: Status, op: in, value: ["Response received", "Remedy agreed", Resolved, Unresolved, Closed] }
      ResponseSummary:
        new: false
        when:
          - { field: Status, op: in, value: ["Response received", "Remedy agreed", Resolved, Unresolved, Closed] }
      RemedyAgreed:
        new: false
        when:
          - { field: Status, op: in, value: ["Remedy agreed", Resolved, Unresolved, Closed] }
      RemedyDueDate:
        new: false
        when:
          - { field: Status, op: in, value: ["Remedy agreed", Resolved, Unresolved, Closed] }
      NextReviewDue: { new: false }
      Outcome:
        new: false
        when:
          - { field: Status, op: in, value: [Resolved, Unresolved, Closed] }
      ClosedDate:
        new: false
        when:
          - { field: Status, op: in, value: [Resolved, Unresolved, Closed] }

form_formatting:
  ServiceEvent:
    header: formatting/service-event-form-header.json
    body: formatting/service-event-form-body.json
  FollowUp:
    header: formatting/follow-up-form-header.json
    body: formatting/follow-up-form-body.json
  ServiceIssue:
    header: formatting/service-issue-form-header.json
    body: formatting/service-issue-form-body.json

# TODAY() in a SharePoint validation formula is midnight. On a DATE column
# `leq today` is therefore correct, and every date column below uses it.
#
# OccurredAt is the one DATETIME here, and it takes `now`, which renders as
# NOW(), verified on a live tenant on 2026-07-29
# (test/manual/datetime-sentinel-probe.js).
#
# The whole-day alternative, `today+1`, would permit up to twenty-four
# hours of future-dating. On a register whose entire claim is
# contemporaneity, that is the wrong window to leave open.
#
# EVERY RULE BELOW IS AN UPPER BOUND, AND THAT IS A LIMIT RATHER THAN A
# CHOICE. This register carries three ordered date pairs - ResponseDate after
# FollowUpDate, ServiceIssue.ResponseDate after RaisedDate, ResolvedDate
# after OccurredAt - and none of the three can be enforced at save: the
# condition grammar compares a column to a LITERAL, never to another column,
# so "ResponseDate >= FollowUpDate" has no spelling. contract-register
# records the same limitation for EndDate/StartDate and vehicle-log for
# OdoEnd/OdoStart.
#
# Two of the three are visible rather than silent: a reversed response pair
# shows as a NEGATIVE Days to respond or Days to response on the item.
#
# ResolvedDate before OccurredAt is NOT. Days Outstanding is in no declared
# view - it is blank on an open row by construction, which is why - so a
# reversed event pair leaves a negative number nobody is looking at. It is a
# curator check in 50-govern rather than something the register surfaces,
# and saying otherwise here would have been the comment claiming a safety
# net that does not exist.
#
# Do not reach for a row colour to make any of them louder - this template
# has one row-level signal and has already spent it on ServiceIssue
# Materiality.
column_validation:
  ServiceEvent:
    reconcile: exact
    columns:
      OccurredAt:
        when:
          - { field: OccurredAt, op: leq, value: now }
        message: "Use the date and time it actually happened; it cannot be in the future. For a request that has not been actioned, use the date you raised it."
      ResolvedDate:
        when:
          any_of:
            - { field: ResolvedDate, op: is_null }
            - { field: ResolvedDate, op: leq, value: today }
        message: "Use the date it was resolved; it cannot be in the future. Leave it blank while it is still outstanding."
      # A mistyped minus sign SUBTRACTS from the group totals on By failure
      # mode and Evidence pack, which are the figures that go to a service
      # review. SharePoint accepts a negative Number by default, and an
      # understated total is the one error here nobody would question.
      PeopleAffected:
        when:
          any_of:
            - { field: PeopleAffected, op: is_null }
            - { field: PeopleAffected, op: geq, value: 0 }
        message: "People affected cannot be negative. Leave it blank if you do not know, or write 1 if it was only you."
      HoursLost:
        when:
          any_of:
            - { field: HoursLost, op: is_null }
            - { field: HoursLost, op: geq, value: 0 }
        message: "Hours lost cannot be negative. Leave it blank if you do not know."
  FollowUp:
    reconcile: exact
    columns:
      FollowUpDate:
        when:
          - { field: FollowUpDate, op: leq, value: today }
        message: "Use the date you actually followed up; it cannot be in the future."
      ResponseDate:
        when:
          any_of:
            - { field: ResponseDate, op: is_null }
            - { field: ResponseDate, op: leq, value: today }
        message: "Use the date they responded; it cannot be in the future. Leave it blank while there has been no response."
  ServiceIssue:
    reconcile: exact
    columns:
      FirstObserved:
        when:
          - { field: FirstObserved, op: leq, value: today }
        message: "Use the date of the earliest event that supports this theme; it cannot be in the future."
      RaisedDate:
        when:
          any_of:
            - { field: RaisedDate, op: is_null }
            - { field: RaisedDate, op: leq, value: today }
        message: "Use the date you actually raised it; it cannot be in the future."
      ResponseDate:
        when:
          any_of:
            - { field: ResponseDate, op: is_null }
            - { field: ResponseDate, op: leq, value: today }
        message: "Use the date they responded; it cannot be in the future. Leave it blank until they have."
      ClosedDate:
        when:
          any_of:
            - { field: ClosedDate, op: is_null }
            - { field: ClosedDate, op: leq, value: today }
        message: "Use the date this was closed; it cannot be in the future."

# Each stage needs the facts that stage is about, and nothing else. Leaving
# Assembling needs at least one supporting event, because a theme with no
# events behind it is an opinion.
#
# WHAT THIS RULE CANNOT REACH, and why the message does not claim it can:
# SharePoint refuses a validation formula that references a multi-line
# column, which the build reports as an error rather than discovering on a
# live tenant. So ResponseSummary, RemedyAgreed and Outcome cannot be
# required here even though each is the substance of its stage. Each stage
# is gated on its DATE instead (you cannot record a response date without
# having had a response), and the narrative fields are carried by the form
# notes and the review cadence in 50-govern/governance.md. A message that
# promised more than the formula enforces would be worse than the gap.
list_validation:
  # Three rules, each earning its friction.
  #
  # The second is the one worth defending. An event may be LOGGED on a
  # colleague's account with nothing behind it - that is still worth having,
  # and refusing it would teach people not to log at all. What it may not be
  # is ACCEPTED as evidence, because a second-hand account with no artefact
  # is the row a provider takes apart first, and one of those discredits the
  # forty around it.
  #
  # WhatHappened has no minimum-length rule and ReviewNote is not required
  # for "Not substantiated", both for the same platform reason recorded on
  # ServiceIssue below: SharePoint refuses a validation formula that
  # references a multi-line column. The form notes and the review cadence
  # carry those two expectations instead.
  ServiceEvent:
    when:
      - any_of:
          - { field: EventNature, op: neq, value: "Unactioned request or ticket" }
          - { field: ProviderReference, op: is_not_null }
      # Both statuses, not just Accepted. "Evidence pack" - the view that
      # goes in front of the provider - selects Accepted AND Escalated, so
      # gating only the first left the exact unsupported account this rule
      # exists to keep out reachable by setting Escalated directly, or by
      # weakening the evidence after escalating.
      - any_of:
          - { field: Status, op: not_in, value: [Accepted, Escalated] }
          - { field: BasisOfKnowledge, op: neq, value: "It was reported to me by a colleague" }
          - { field: EvidenceHeld, op: neq, value: "None - recollection only" }
      - any_of:
          - { field: ResolvedDate, op: is_null }
          - { field: OutcomeForUs, op: is_not_null }
      # The other half of that pair. A resolved OUTCOME with no resolved DATE
      # leaves the row in "Outstanding and ageing" (which filters on the null
      # date) while the Response Due Date guard above suppresses its red on
      # the strength of that outcome - one chase entry saying both things at
      # once. Only the three outcomes the guard excludes are named: Partially
      # resolved, Unresolved and Recurred after resolution suppress nothing,
      # and a still-outstanding item honestly carries one of those. The
      # leading branch compares a nullable choice against a literal, the same
      # shape risk-register uses for the nullable RiskResponse.
      - any_of:
          - { field: OutcomeForUs, op: not_in, value: ["Resolved satisfactorily", "Resolved after escalation", "Worked around locally"] }
          - { field: ResolvedDate, op: is_not_null }
    message: "Check this record: a request that has not been actioned needs the provider's reference number, because a complaint that cannot say which request is not evidence. A second-hand account with nothing behind it can be logged, but not accepted as evidence. And a resolved date needs the outcome that went with it, just as an outcome of Resolved satisfactorily, Resolved after escalation or Worked around locally needs the date it was resolved on."
  # ResponseSummary is multi-line and so cannot be required by a formula; the
  # date stands in for it, since you cannot honestly record a response date
  # without having had a response.
  FollowUp:
    when:
      - any_of:
          - { field: ResponseReceived, op: eq, value: "No response" }
          - { field: ResponseDate, op: is_not_null }
    message: "If something came back, record the date it came. A follow-up with an unrecorded response is the gap the next person to pick this up will fall into."
  ServiceIssue:
    when:
      - any_of:
          - { field: Status, op: eq, value: Assembling }
          - { field: EventCount, op: geq, value: 1 }
      - any_of:
          - { field: Status, op: in, value: [Assembling, "Ready to raise"] }
          - all_of:
              - { field: RaisedDate, op: is_not_null }
              - { field: RaisedWith, op: is_not_null }
      # Named by the stages that ATTEST a response rather than by the stages
      # that precede one. "A provider who never answered" is the whole point
      # of Unresolved, and the earlier spelling - everything after Raised
      # needs a response date - made concluding one impossible without
      # inventing the date. Closed is exempt for the same reason: it is where
      # a theme goes when it stops being worth pursuing, answered or not.
      - any_of:
          - { field: Status, op: not_in, value: ["Response received", "Remedy agreed", Resolved] }
          - { field: ResponseDate, op: is_not_null }
      - any_of:
          - { field: Status, op: neq, value: "Remedy agreed" }
          - { field: RemedyDueDate, op: is_not_null }
      - any_of:
          - { field: Status, op: not_in, value: [Resolved, Unresolved, Closed] }
          - { field: ClosedDate, op: is_not_null }
    message: "Check the stage: leaving Assembling needs at least one supporting event; Raised needs the date it was raised and the forum or role it went to; Response received, Remedy agreed and Resolved need the date they responded; Remedy agreed needs the date the remedy falls due; concluding needs a closed date. Unresolved and Closed need no response date - a provider who never answered is what Unresolved is for."

demo_items:
  # One deliberately mundane, sector-neutral story across the three lists: a
  # recurring access-provisioning failure, chased four times, escalated, and
  # partly remedied. Chosen so every declared view returns something and
  # every formatted column is seen to render.
  ServiceEvent:
    - key: se-event-ticket-open
      values:
        Title: "[DEMO] Access request for a new starter still not completed after three weeks"
        Provider: "[DEMO] Example Service Partner"
        EventNature: "Unactioned request or ticket"
        OccurredAt: "today-21"
        ServiceAffected: "Access, accounts or permissions"
        FailureMode: "No response or acknowledgement"
        WhatHappened: "Demo row. A standard access request was submitted on the date shown with the full details required. No acknowledgement was received. The person started on time and has been working from a colleague's screen since."
        BasisOfKnowledge: "I observed or experienced this directly"
        ProviderReference: "[DEMO] REQ-104882"
        EvidenceHeld: "Provider ticket or system record"
        Severity: Major
        PeopleAffected: 2
        HoursLost: 14
        ImpactDescription: "Demo row. A new starter cannot work unsupervised, and a colleague is absorbing the supervision."
        ServiceCommitment: "[DEMO] Five working days for a standard access request"
        RaisedWithProvider: "Raised at the time"
        ResponseDueDate: "today-14"
        LastFollowedUp: "today-3"
        Status: Logged
    - key: se-event-ongoing
      values:
        Title: "[DEMO] Shared drive intermittently unavailable each morning"
        Provider: "[DEMO] Example Service Partner"
        EventNature: "Ongoing or recurring condition"
        OccurredAt: "today-45"
        ServiceAffected: "Connectivity or infrastructure"
        FailureMode: "Recurrence of a previously reported problem"
        WhatHappened: "Demo row. The shared drive has been unavailable for roughly twenty minutes at the start of most days since the date shown. It was reported once, closed as resolved, and returned the following week."
        BasisOfKnowledge: "It was reported to me by a colleague"
        ProviderReference: "[DEMO] INC-99120"
        EvidenceHeld: "Email or written correspondence"
        EvidenceLink: "https://example.invalid/evidence/demo-email-thread"
        Severity: Moderate
        PeopleAffected: 18
        HoursLost: 30
        ImpactDescription: "Demo row. The first twenty minutes of the day are lost for the team that works from shared files."
        ServiceCommitment: "[DEMO] Core file services available during business hours"
        RaisedWithProvider: "Raised afterwards"
        ResponseDueDate: "today+7"
        LastFollowedUp: "today-9"
        Status: "Under review"
    - key: se-event-accepted
      values:
        Title: "[DEMO] Request closed as resolved without the work being done"
        Provider: "[DEMO] Example Service Partner"
        EventNature: "Single occurrence"
        OccurredAt: "today-30"
        ServiceAffected: "Requests or help desk"
        FailureMode: "Closed without resolving"
        WhatHappened: "Demo row. The request was marked resolved on the date shown with no contact and no change to the underlying configuration. It was re-raised the following day and the second request carries a different reference."
        BasisOfKnowledge: "Taken from a system record, ticket or report"
        ProviderReference: "[DEMO] REQ-103551"
        EvidenceHeld: "Attached to this record"
        Severity: Moderate
        PeopleAffected: 1
        HoursLost: 2
        ImpactDescription: "Demo row. The same request had to be raised twice, and the reported resolution figure counts it as one success."
        ServiceCommitment: "[DEMO] Resolution confirmed with the requester before closure"
        RaisedWithProvider: "Raised at the time"
        ResolvedDate: "today-22"
        OutcomeForUs: "Resolved after escalation"
        Status: Accepted
        ReviewedBy: "@me"
        ReviewNote: "Demo row. Verified against the provider's own ticket history: closed and re-raised, both references confirmed."
        RelatedIssue: { demo_ref: se-issue-raised }
    - key: se-event-escalated
      values:
        Title: "[DEMO] Core system taken offline during business hours without notice"
        Provider: "[DEMO] Example Service Partner"
        EventNature: "Unactioned request or ticket"
        OccurredAt: "today-60"
        ServiceAffected: "Systems, applications or tools"
        FailureMode: "Change made without notice or agreement"
        WhatHappened: "Demo row. The system became unavailable at 10:15 on the date shown with no prior notice. It returned at 12:40. A change was confirmed afterwards as the cause."
        BasisOfKnowledge: "I observed or experienced this directly"
