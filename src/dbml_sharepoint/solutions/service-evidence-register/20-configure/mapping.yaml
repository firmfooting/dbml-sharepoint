        ProviderReference: "[DEMO] REQ-105003"
        EvidenceHeld: "Screenshot or document held elsewhere"
        EvidenceLink: "https://example.invalid/evidence/demo-delivery-confirmation"
        Severity: Minor
        PeopleAffected: 1
        HoursLost: 3
        ImpactDescription: "Demo row. One person worked on a loan device for four days."
        ServiceCommitment: "[DEMO] Replacement equipment within ten working days"
        RaisedWithProvider: "Raised at the time"
        ResolvedDate: "today-8"
        OutcomeForUs: "Resolved satisfactorily"
        Status: Closed
        ReviewedBy: "@me"
        ReviewNote: "Demo row. Minor, acknowledged and resolved. Logged for completeness, so the register carries the ordinary weeks as well as the bad ones."
  FollowUp:
    - key: se-follow-first
      values:
        Title: "[DEMO] Asked for an update on the outstanding access request"
        RelatedEvent: { demo_ref: se-event-ticket-open }
        FollowUpDate: "today-14"
        Channel: "Service portal or ticket update"
        ContactedRole: "[DEMO] Service desk"
        EscalationLevel: "Service desk or first line"
        WhatWeAsked: "Demo row. Asked for a status update and an expected completion date, quoting the original reference."
        ResponseReceived: "No response"
    - key: se-follow-acknowledged
      values:
        Title: "[DEMO] Second request for a completion date"
        RelatedEvent: { demo_ref: se-event-ticket-open }
        FollowUpDate: "today-10"
        Channel: Email
        ContactedRole: "[DEMO] Service desk team mailbox"
        EscalationLevel: "Service desk or first line"
        WhatWeAsked: "Demo row. Asked again for a completion date and noted that the person had now started."
        ResponseReceived: "Acknowledged only"
        ResponseDate: "today-9"
        ResponseSummary: "Demo row. Automated acknowledgement only; no person responded and no date was given."
    - key: se-follow-closed
      values:
        Title: "[DEMO] Called about the request and found it had been closed"
        RelatedEvent: { demo_ref: se-event-ticket-open }
        FollowUpDate: "today-6"
        Channel: "Phone call"
        ContactedRole: "[DEMO] Service desk"
        EscalationLevel: "Service manager"
        WhatWeAsked: "Demo row. Asked why no date had been provided and whether the request was still open."
        ResponseReceived: "Ticket closed without resolution"
        ResponseDate: "today-6"
        ResponseSummary: "Demo row. Advised on the call that the request had been closed as no response from requester. No contact had been received at this end."
        EvidenceLink: "https://example.invalid/evidence/demo-call-note"
    - key: se-follow-escalated
      values:
        Title: "[DEMO] Escalated the unactioned request to the relationship manager"
        RelatedEvent: { demo_ref: se-event-ticket-open }
        FollowUpDate: "today-3"
        Channel: Email
        ContactedRole: "[DEMO] Relationship manager"
        EscalationLevel: "Relationship or contract manager"
        WhatWeAsked: "Demo row. Set out the three earlier follow-ups with their dates and asked for the request to be completed and for the closure to be explained."
        ResponseReceived: "No response"
    - key: se-follow-executive
      values:
        Title: "[DEMO] Raised the unnotified outage at the governance forum"
        RelatedEvent: { demo_ref: se-event-escalated }
        FollowUpDate: "today-45"
        Channel: Meeting
        ContactedRole: "[DEMO] Service governance forum"
        EscalationLevel: Executive
        WhatWeAsked: "Demo row. Asked for confirmation of what changed, why no notice was issued, and what would prevent a repeat."
        ResponseReceived: "Substantive response"
        ResponseDate: "today-43"
        ResponseSummary: "Demo row. The change was confirmed, the missing notice was accepted, and a revised change-notification step was offered."
        CommitmentGiven: "[DEMO] Revised change notification from the start of next month"
        EvidenceLink: "https://example.invalid/evidence/demo-forum-minutes"
  ServiceIssue:
    - key: se-issue-assembling
      values:
        Title: "[DEMO] Access requests for new starters are not completed before day one"
        Provider: "[DEMO] Example Service Partner"
        ServiceAffected: "Access, accounts or permissions"
        IssueSummary: "Demo row. New starters are repeatedly unable to work on their first day because access requests submitted well in advance are not completed. The pattern has held across the last quarter and is being assembled for the next service review."
        FirstObserved: "today-70"
        Materiality: Irritant
        EventCount: 3
        CommitmentEngaged: "[DEMO] Five working days for standard access requests"
