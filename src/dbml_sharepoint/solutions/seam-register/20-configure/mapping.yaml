# Seam register: physical mapping.
prefix: "SEAM_"

# Eight lists and one library. The library holds the files; a document that
# was refused or never found has no file, so the asks are a list.
entities:
  Provider:        { kind: List, base_template: 100, site_role: default }
  Service:         { kind: List, base_template: 100, site_role: default }
  Evidence:        { kind: List, base_template: 100, site_role: default }
  Seam:            { kind: List, base_template: 100, site_role: default }
  DocumentRequest: { kind: List, base_template: 100, site_role: default }
  Artefact:
    kind: DocumentLibrary
    base_template: 101
    site_role: default
    folders: [Documents, Interviews, Incidents, Invoices, System exports, Correspondence]
  Interview:       { kind: List, base_template: 100, site_role: default }
  Incident:        { kind: List, base_template: 100, site_role: default }
  WeeklyUpdate:    { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 200
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# A seam is raised on the day it is seen; the date fills itself.
default_formulas:
  Seam:
    RaisedOn: "=TODAY()"

# The two runners may delete their own mistakes; people offered rows to
# check may edit but not delete; site members read. Site Visitors get nothing.
groups:
  - name: "{prefix} Discovery Team"
    description: "The two people running the exercise: interviews, evidence, register hygiene and the weekly five lines."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "{prefix} Contributors"
    description: "People offered rows to correct, such as an ICT manager or a provider's nominated contact. Edit without delete."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "dbml List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: "dbml Enterprise Readers"
    description: "Read-only accounts for aggregated cross-site reporting. Empty by default; membership is operator-owned."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

permission_levels:
  - name: "{prefix} Contribute No Delete"
    description: "Add, edit and read items and files, save personal views and alerts; no deleting and no schema rights."
    base_permissions:
      - AddListItems
      - EditListItems
      - ViewListItems
      - OpenItems
      - ViewVersions
      - ViewFormPages
      - Open
      - ViewPages
      - BrowseUserInfo
      - UseClientIntegration
      - UseRemoteAPIs
      - CreateAlerts
      - ManagePersonalViews

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "{prefix} Discovery Team" }
        level: "Contribute"
      - principal: { kind: group, name: "{prefix} Contributors" }
        level: "{prefix} Contribute No Delete"
      - principal: { kind: group, name: "dbml List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Read"
      - principal: { kind: associated_owner_group }
        level: "Contribute"
      - principal: { kind: group, name: "dbml Enterprise Readers" }
        level: "Read"
  # Rows on four lists point at a provider, so it is retired by Status and
  # only dbml List Administrators can delete one.
  overrides:
    Provider:
      break_inheritance: true
      reconcile: exact
      assignments:
        - principal: { kind: group, name: "{prefix} Discovery Team" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: group, name: "{prefix} Contributors" }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: group, name: "dbml List Administrators" }
          level: "Full Control"
        - principal: { kind: associated_member_group }
          level: "Read"
        - principal: { kind: associated_owner_group }
          level: "{prefix} Contribute No Delete"
        - principal: { kind: group, name: "dbml Enterprise Readers" }
          level: "Read"

seal_columns: true
prevent_list_deletion: true

display_names:
  mode: auto
  overrides:
    Provider:
      Title: "Provider"
      ProviderType: "Type"
      RelationshipOwner: "Relationship owner"
      ServiceDeskContact: "Service desk contact"
      AgreementLink: "Agreement link"
      AgreementEnds: "Agreement ends"
    Service:
      RunBySide: "Run by"
      RunByProvider: "Run by provider"
      RunByTeam: "Run by team"
      SupportSide: "Support from"
      SupportProvider: "Support provider"
      SupportTeam: "Support team"
      DecidedBy: "Decided by"
      OutOfHours: "Out of hours call"
      DocumentationLink: "Documentation link"
      LastFailureDate: "Last failure date"
      LastFailure: "Last failure"
      FirstPass: "First pass"
      SinglePerson: "Single person"
    Evidence:
      EvidenceType: "Type"
      SourceSide: "Source side"
      SupportsField: "Bears on"
      EvidenceDate: "Evidence date"
      ArtefactLink: "Artefact link"
      Artefact: "Artefact file"
    Seam:
      SeamType: "Type"
      EvidenceInConflict: "Evidence in conflict"
      RaisedOn: "Raised on"
      ResolveOwner: "Resolve owner"
      ResolveBy: "Resolve by"
      ResolvedOn: "Resolved on"
    DocumentRequest:
      DocumentType: "Type"
      HolderSide: "Held by"
      HolderProvider: "Holding provider"
      AskedOn: "Asked on"
      DueOn: "Due on"
      AnsweredOn: "Answered on"
      SignedBy: "Signed by"
    Artefact:
      ArtefactType: "Type"
      SourceSide: "Source side"
      ArtefactDate: "Dated"
    Interview:
      IntervieweeSide: "Side"
      IntervieweeProvider: "Provider"
      InterviewDate: "Interview date"
