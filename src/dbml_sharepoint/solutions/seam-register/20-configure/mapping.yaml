# Unknown is severe because an unclaimed row is the exercise's reason to
# exist. Edit the side pill map at its anchor; the aliases follow.
column_formatting:
  Provider:
    Tier:
      style: pill
      map: { Strategic: warning, Tactical: low, Operational: neutral, Commodity: neutral }
    Status:
      style: severity
      map: { Active: good, Retired: muted }
    # Shouts only while the provider is still in use.
    AgreementEnds:
      style: overdue-date
      guard: { field: Status, not: [Retired] }
  Service:
    Confidence:
      style: severity
      map: { Assumed: warning, Claimed: low, Verified: good }
    RunBySide:
      style: pill
      map: &side_pill { Us: good, Provider: low, "Third party": neutral, Shared: warning, Unknown: severe }
    SupportSide:
      style: pill
      map: *side_pill
    Documentation:
      style: severity
      map: { "Not asked": neutral, "None found": severe, "Exists, not seen": warning, Held: low, Verified: good }
  Evidence:
    EvidenceType:
      style: pill
      map: { Interview: low, Document: good, "Incident data": good, Invoice: good, "System data": good, Email: neutral, Observation: low }
    SourceSide:
      style: pill
      map: *side_pill
  Seam:
    Status:
      style: severity
      map: { Open: warning, "Confirmed gap": severe, Escalated: severe, Resolved: good }
    SeamType:
      style: pill
      map: { "No owner": severe, "Disputed owner": warning, "Disputed support": warning, "Undocumented dependency": warning, "Single person": severe, "No evidence": neutral, "Contradicts document": warning }
    # Shouts only while the seam is still open.
    ResolveBy:
      style: overdue-date
      guard: { field: Status, not: [Resolved] }
  DocumentRequest:
    Status:
      style: severity
      map: { "To ask": neutral, Asked: low, Received: good, Refused: severe, "Not found": warning }
    HolderSide:
      style: pill
      map: *side_pill
    # The five-working-day date stops shouting once an answer of any kind
    # has come back, including no.
    DueOn:
      style: overdue-date
      guard: { field: Status, not: [Received, Refused, "Not found"] }
  Artefact:
    ArtefactType:
      style: pill
      map: { "Document copy": good, "Interview notes": low, "Incident export": good, "Invoice extract": good, "System export": good, Correspondence: neutral, Other: neutral }
    SourceSide:
      style: pill
      map: *side_pill
  Interview:
    Status:
      style: severity
      map: { Booked: low, Completed: good, Declined: severe, Cancelled: muted }
    IntervieweeSide:
      style: pill
      map: *side_pill
    DurationMin:
      style: data-bar
      max: 30
  Incident:
    ResolverSide:
      style: pill
      map: *side_pill
    Source:
      style: pill
      map: { "Ticket export": good, "Recalled outage": low }
  WeeklyUpdate:
    RowsVerified:
      style: data-bar
      max: 40
    SeamsFound:
      style: data-bar
      max: 20

field_sets:
  Service:
    identity: [Title, Area, RunBySide, SupportSide, Confidence]
  Artefact:
    identity: [FileLeafRef, Title, ArtefactType, SourceSide, ArtefactDate]

# The seam map is a query, not a drawing: first-pass rows grouped by who
# runs them, coloured by confidence. Unknown lands in its own group, which
# is the gutter between us and the providers.
views:
  Provider:
    - title: "Active providers"
      default: true
      fields: [Title, ProviderType, Tier, RelationshipOwner, ServiceDeskContact, AgreementEnds, Status]
      where:
        - { field: Status, op: eq, value: Active }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 260
        ProviderType: 180
        Tier: 130
        RelationshipOwner: 220
        ServiceDeskContact: 280
        AgreementEnds: 150
        Status: 120
    - title: "By tier"
      fields: [Title, ProviderType, RelationshipOwner, AgreementEnds, Status]
      group_by: { field: Tier, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 260
        ProviderType: 180
        RelationshipOwner: 220
        AgreementEnds: 150
        Status: 120
    - title: "Agreements ending"
      fields: [Title, ProviderType, Tier, AgreementEnds, AgreementLink, RelationshipOwner, Status]
      where:
        - { field: Status, op: eq, value: Active }
        - { field: AgreementEnds, op: is_not_null }
      sort:
        - { field: AgreementEnds, direction: asc }
      widths:
        Title: 260
        ProviderType: 180
        Tier: 130
        AgreementEnds: 150
        AgreementLink: 200
        RelationshipOwner: 220
        Status: 120
    - title: "Retired"
      fields: [Title, ProviderType, AgreementEnds, Status, Notes]
      where:
        - { field: Status, op: eq, value: Retired }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 260
        ProviderType: 180
        AgreementEnds: 150
        Status: 120
        Notes: 320
  Service:
    - title: "Seam map"
      default: true
      fields: ['@identity', RunByProvider, SupportTeam, Hosting, SinglePerson, Documentation]
      where:
        - { field: FirstPass, op: eq, value: true }
      group_by: { field: RunBySide, collapsed: false }
      sort:
        - { field: Area, direction: asc }
        - { field: Title, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunBySide: 160
        SupportSide: 160
        Confidence: 120
        RunByProvider: 220
        SupportTeam: 200
        Hosting: 200
        SinglePerson: 120
        Documentation: 160
    # The same register cut by provider rather than by side, so a
    # provider's whole footprint reads as one group.
    # Grouped only where the side involves a provider, so a provider left
    # hidden on a row set back to Us or Unknown does not count against it.
    - title: "By provider"
      fields: [Title, Area, RunBySide, RunByTeam, SupportProvider, Confidence]
      where:
        - { field: RunBySide, op: in, value: [Provider, "Third party", Shared] }
      group_by: { field: RunByProvider, collapsed: false }
      sort:
        - { field: Area, direction: asc }
        - { field: Title, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunBySide: 160
        RunByTeam: 200
        SupportProvider: 220
        Confidence: 120
    # A provider that supports a service it does not run belongs here.
    - title: "By support provider"
      fields: [Title, Area, SupportSide, SupportTeam, RunByProvider, Confidence]
      where:
        - { field: SupportSide, op: in, value: [Provider, "Third party", Shared] }
      group_by: { field: SupportProvider, collapsed: false }
      sort:
        - { field: Area, direction: asc }
        - { field: Title, direction: asc }
      widths:
        Title: 300
        Area: 220
        SupportSide: 160
        SupportTeam: 200
        RunByProvider: 220
        Confidence: 120
    # A save rule cannot read a lookup, so both provider gaps are found here
    # rather than refused: a side that owes a provider with none named, and
    # a provider left behind on a side that has none. The second does not
    # rest on the form keeping a held lookup visible, which is unmeasured.
    # A save rule cannot read a lookup, so a row whose side shows the
    # provider column and leaves it blank is found here rather than refused.
    - title: "Provider not named"
      fields: [Title, Area, RunBySide, RunByProvider, SupportSide, SupportProvider]
      where:
        - any_of:
            - all_of:
                - { field: RunBySide, op: in, value: [Provider, "Third party", Shared] }
                - { field: RunByProvider, op: is_null }
            - all_of:
                - { field: SupportSide, op: in, value: [Provider, "Third party", Shared] }
                - { field: SupportProvider, op: is_null }
      sort:
        - { field: Area, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunBySide: 160
        RunByProvider: 220
        SupportSide: 160
        SupportProvider: 220
    - title: "By area"
      fields: ['@identity', RunByTeam, DecidedBy, FirstPass]
      group_by: { field: Area, collapsed: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunBySide: 160
        SupportSide: 160
        Confidence: 120
        RunByTeam: 200
        DecidedBy: 220
        FirstPass: 110
    - title: "Assumed"
      fields: ['@identity', Documentation, Notes]
      where:
        - { field: Confidence, op: eq, value: Assumed }
        - { field: FirstPass, op: eq, value: true }
      sort:
        - { field: Area, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunBySide: 160
        SupportSide: 160
        Confidence: 120
        Documentation: 160
        Notes: 320
    - title: "Single person"
      fields: [Title, Area, RunByTeam, OutOfHours, Confidence]
      where:
        - { field: SinglePerson, op: eq, value: true }
      sort:
        - { field: Area, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunByTeam: 200
        OutOfHours: 260
        Confidence: 120
    - title: "Undocumented"
      fields: ['@identity', Documentation, DocumentationLink]
      where:
        - { field: Documentation, op: in, value: ["Not asked", "None found", "Exists, not seen"] }
      sort:
        - { field: Documentation, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunBySide: 160
        SupportSide: 160
        Confidence: 120
        Documentation: 160
        DocumentationLink: 200
    - title: "Failures"
      fields: [Title, Area, LastFailureDate, LastFailure, SupportSide, SupportProvider, OutOfHours]
      where:
        - { field: LastFailureDate, op: is_not_null }
      sort:
        - { field: LastFailureDate, direction: desc }
      widths:
        Title: 300
        Area: 220
        LastFailureDate: 150
        LastFailure: 320
        SupportSide: 160
        SupportProvider: 220
        OutOfHours: 260
    - title: "Backlog"
      fields: ['@identity', Notes]
      where:
        - { field: FirstPass, op: eq, value: false }
      sort:
        - { field: Area, direction: asc }
      widths:
        Title: 300
        Area: 220
        RunBySide: 160
        SupportSide: 160
        Confidence: 120
        Notes: 320
  Evidence:
    - title: "By service"
      default: true
      fields: [Title, EvidenceType, Source, SourceSide, SupportsField, Contradicts, EvidenceDate]
      group_by: { field: Service, collapsed: false }
      sort:
        - { field: EvidenceDate, direction: desc }
      widths:
        Title: 300
        EvidenceType: 130
        Source: 260
        SourceSide: 160
        SupportsField: 140
        Contradicts: 120
        EvidenceDate: 150
    - title: "Contradicting"
      fields: [Title, Service, Source, SourceSide, SupportsField, Statement, EvidenceDate]
      where:
        - { field: Contradicts, op: eq, value: true }
      sort:
        - { field: EvidenceDate, direction: desc }
      widths:
        Title: 300
        Service: 240
        Source: 260
        SourceSide: 160
        SupportsField: 140
        Statement: 320
        EvidenceDate: 150
    - title: "By source side"
      fields: [Title, Service, EvidenceType, Source, SupportsField, EvidenceDate]
      group_by: { field: SourceSide, collapsed: false }
      sort:
        - { field: EvidenceDate, direction: desc }
      widths:
        Title: 300
        Service: 240
        EvidenceType: 130
        Source: 260
        SupportsField: 140
        EvidenceDate: 150
    - title: "Recent"
      fields: [Title, Service, EvidenceType, SourceSide, Statement, EvidenceDate, ArtefactLink, Artefact]
      sort:
        - { field: EvidenceDate, direction: desc }
      widths:
        Title: 300
        Service: 240
        EvidenceType: 130
        SourceSide: 160
        Statement: 320
        EvidenceDate: 150
        ArtefactLink: 180
        Artefact: 220
  Seam:
    - title: "Open seams"
      default: true
      fields: [Title, Service, SeamType, Status, ResolveOwner, ResolveBy, RaisedOn]
      where:
        - { field: Status, op: in, value: [Open, "Confirmed gap", Escalated] }
      sort:
        - { field: RaisedOn, direction: asc }
      widths:
        Title: 300
        Service: 240
        SeamType: 200
        Status: 140
        ResolveOwner: 220
        ResolveBy: 150
        RaisedOn: 150
    - title: "Escalated"
      fields: [Title, Service, SeamType, Status, ResolveOwner, ResolveBy, Description]
      where:
        - { field: Status, op: eq, value: Escalated }
      sort:
        - { field: ResolveBy, direction: asc }
      widths:
        Title: 300
        Service: 240
        SeamType: 200
        Status: 140
        ResolveOwner: 220
        ResolveBy: 150
        Description: 320
    - title: "By type"
      fields: [Title, Service, Status, ResolveOwner, RaisedOn]
      where:
        - { field: Status, op: neq, value: Resolved }
      group_by: { field: SeamType, collapsed: false }
      sort:
        - { field: RaisedOn, direction: asc }
      widths:
        Title: 300
        Service: 240
        Status: 140
        ResolveOwner: 220
        RaisedOn: 150
    - title: "Resolved"
      fields: [Title, Service, SeamType, RaisedOn, ResolvedOn, Resolution]
      where:
        - { field: Status, op: eq, value: Resolved }
      sort:
        - { field: ResolvedOn, direction: desc }
      widths:
        Title: 300
        Service: 240
        SeamType: 200
        RaisedOn: 150
        ResolvedOn: 150
        Resolution: 320
  DocumentRequest:
    - title: "To ask and waiting"
      default: true
      fields: [Title, DocumentType, Holder, HolderSide, HolderProvider, Status, AskedOn, DueOn]
      where:
        - { field: Status, op: in, value: ["To ask", Asked] }
      sort:
        - { field: DueOn, direction: asc }
      widths:
        Title: 300
        DocumentType: 160
        Holder: 220
        HolderSide: 160
        HolderProvider: 220
        Status: 120
        AskedOn: 150
        DueOn: 150
    - title: "Received"
      fields: [Title, DocumentType, HolderSide, AnsweredOn, SignedBy, Summary, Services]
      where:
        - { field: Status, op: eq, value: Received }
      sort:
        - { field: AnsweredOn, direction: desc }
      widths:
        Title: 300
        DocumentType: 160
        HolderSide: 160
        AnsweredOn: 150
        SignedBy: 220
        Summary: 320
        Services: 240
    - title: "Refused or not found"
      fields: [Title, DocumentType, Holder, HolderSide, Status, AskedOn, AnsweredOn, Summary]
      where:
        - { field: Status, op: in, value: [Refused, "Not found"] }
      sort:
        - { field: AnsweredOn, direction: desc }
      widths:
        Title: 300
        DocumentType: 160
        Holder: 220
        HolderSide: 160
        Status: 120
        AskedOn: 150
        AnsweredOn: 150
        Summary: 320
    - title: "By holder"
      fields: [Title, DocumentType, Holder, Status, DueOn, Services]
      group_by: { field: HolderSide, collapsed: false }
      sort:
        - { field: Status, direction: asc }
      widths:
        Title: 300
        DocumentType: 160
        Holder: 220
        Status: 120
        DueOn: 150
        Services: 240
    # The same gap the service list's view catches, for this list's lookup.
    - title: "Provider not named"
      fields: [Title, DocumentType, Holder, HolderSide, HolderProvider, Status]
      where:
        - { field: HolderSide, op: in, value: [Provider, "Third party", Shared] }
        - { field: HolderProvider, op: is_null }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 300
        DocumentType: 160
        Holder: 220
        HolderSide: 160
        HolderProvider: 220
        Status: 120
  Artefact:
    - title: "Folder View"
      scope: default
      fields: ['@identity', Modified]
      sort:
        - { field: FileLeafRef, direction: asc }
      widths:
        FileLeafRef: 320
        Title: 260
        ArtefactType: 150
        SourceSide: 160
        ArtefactDate: 150
        Modified: 170
    - title: "All artefacts"
      default: true
      scope: recursive
      fields: ['@identity', Request, Services, Summary]
      sort:
        - { field: Modified, direction: desc }
      widths:
        FileLeafRef: 320
        Title: 260
        ArtefactType: 150
        SourceSide: 160
        ArtefactDate: 150
        Request: 240
        Services: 240
        Summary: 320
    # Not grouped: past 5,000 files a root-scoped group-by is refused, and
    # the folders already group by kind.
    - title: "By source side"
      scope: recursive
      fields: [FileLeafRef, Title, ArtefactType, SourceSide, ArtefactDate, Services, Summary]
      sort:
        - { field: SourceSide, direction: asc }
        - { field: ArtefactDate, direction: desc }
      widths:
        FileLeafRef: 320
        Title: 260
        ArtefactType: 150
        SourceSide: 160
        ArtefactDate: 150
        Services: 240
        Summary: 320
    - title: "Answers an ask"
      scope: recursive
      fields: ['@identity', Request, Summary]
      where:
        - { field: Request, op: is_not_null }
      sort:
        - { field: ArtefactDate, direction: desc }
      widths:
        FileLeafRef: 320
        Title: 260
        ArtefactType: 150
        SourceSide: 160
        ArtefactDate: 150
        Request: 240
        Summary: 320
  Interview:
    - title: "Booked"
      default: true
      fields: [Title, IntervieweeSide, IntervieweeProvider, InterviewDate, Status]
      where:
        - { field: Status, op: eq, value: Booked }
      sort:
        - { field: InterviewDate, direction: asc }
      widths:
        Title: 320
        IntervieweeSide: 160
        IntervieweeProvider: 220
        InterviewDate: 150
        Status: 120
    - title: "Completed"
