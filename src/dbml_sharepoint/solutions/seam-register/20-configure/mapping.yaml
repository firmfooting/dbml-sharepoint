# Fields appear once the row has reached them, and a provider column once
# the side says a provider or third party is involved. A field hidden again
# keeps its value, which is harmless: no save rule forbids a value on a
# hidden field, so the row still saves, and reporting filters by status.
form_visibility:
  Service:
    reconcile: exact
    columns:
      RunByProvider:
        when:
          - { field: RunBySide, op: in, value: [Provider, "Third party", Shared] }
      SupportProvider:
        when:
          - { field: SupportSide, op: in, value: [Provider, "Third party", Shared] }
  Seam:
    reconcile: exact
    columns:
      ResolvedOn:
        when:
          - { field: Status, op: eq, value: Resolved }
      Resolution:
        when:
          - { field: Status, op: eq, value: Resolved }
  DocumentRequest:
    reconcile: exact
    columns:
      HolderProvider:
        when:
          - { field: HolderSide, op: in, value: [Provider, "Third party", Shared] }
      AskedOn:
        when:
          - { field: Status, op: in, value: [Asked, Received, Refused, "Not found"] }
      DueOn:
        when:
          - { field: Status, op: in, value: [Asked, Received, Refused, "Not found"] }
      AnsweredOn:
        when:
          - { field: Status, op: in, value: [Received, Refused, "Not found"] }
      SignedBy:
        when:
          - { field: Status, op: eq, value: Received }
  # Everything the conversation produces shares one rule, anchored once.
  Interview:
    reconcile: exact
    columns:
      IntervieweeProvider:
        when:
          - { field: IntervieweeSide, op: in, value: [Provider, "Third party", Shared] }
      DurationMin: &after_the_conversation
        new: false
        when:
          - { field: Status, op: eq, value: Completed }
      Q1Runs: *after_the_conversation
      Q2Uses: *after_the_conversation
      Q3Call: *after_the_conversation
      Q4Decides: *after_the_conversation
      Q5AskProvider: *after_the_conversation
      Q6AskedProvider: *after_the_conversation
      Q7Auditor: *after_the_conversation
      Q8Saturday: *after_the_conversation
      RecordingLink: *after_the_conversation
      NotesFile: *after_the_conversation
      # A declined or cancelled conversation still leaves something to chase.
      FollowUps:
        new: false
        when:
          - { field: Status, op: in, value: [Completed, Declined, Cancelled] }
  Incident:
    reconcile: exact
    columns:
      ResolverProvider:
        when:
          - { field: ResolverSide, op: in, value: [Provider, "Third party", Shared] }

# Every date here records something that has happened, so none may be in
# the future; the today rules are hoisted onto each list rule at build time.
column_validation:
  Service:
    reconcile: exact
    columns:
      LastFailureDate:
        when:
          any_of:
            - { field: LastFailureDate, op: is_null }
            - { field: LastFailureDate, op: leq, value: today }
        message: "A failure is dated when it happened; it cannot be in the future."
  Evidence:
    reconcile: exact
    columns:
      EvidenceDate:
        when:
          - { field: EvidenceDate, op: leq, value: today }
        message: "Evidence is dated when the statement was made or the document was issued; it cannot be in the future."
  Seam:
    reconcile: exact
    columns:
      RaisedOn:
        when:
          - { field: RaisedOn, op: leq, value: today }
        message: "A seam is raised on the day it is seen; the date cannot be in the future."
      ResolvedOn:
        when:
          any_of:
            - { field: ResolvedOn, op: is_null }
            - { field: ResolvedOn, op: leq, value: today }
        message: "Use the date the seam actually closed; it cannot be in the future."
  DocumentRequest:
    reconcile: exact
    columns:
      AskedOn:
        when:
          any_of:
            - { field: AskedOn, op: is_null }
            - { field: AskedOn, op: leq, value: today }
        message: "Asked on is the date the ask went out; it cannot be in the future."
      AnsweredOn:
        when:
          any_of:
            - { field: AnsweredOn, op: is_null }
            - { field: AnsweredOn, op: leq, value: today }
        message: "Answered on is the date the answer came back; it cannot be in the future."
  Artefact:
    reconcile: exact
    columns:
      ArtefactDate:
        when:
          any_of:
            - { field: ArtefactDate, op: is_null }
            - { field: ArtefactDate, op: leq, value: today }
        message: "The date on an artefact cannot be in the future."
  Interview:
    reconcile: exact
    columns:
      DurationMin:
        when:
          any_of:
            - { field: DurationMin, op: is_null }
            - all_of:
                - { field: DurationMin, op: geq, value: 1 }
                - { field: DurationMin, op: leq, value: 30 }
        message: "Thirty minutes is the ceiling. If it ran over, record thirty and note the overrun in the follow-ups."
  Incident:
    reconcile: exact
    columns:
      IncidentDate:
        when:
          - { field: IncidentDate, op: leq, value: today }
        message: "An incident is dated when it happened; it cannot be in the future."
  WeeklyUpdate:
    reconcile: exact
    columns:
      WeekNo:
        when:
          all_of:
            - { field: WeekNo, op: geq, value: 1 }
            - { field: WeekNo, op: leq, value: 6 }
        message: "The exercise is six weeks. Week is 1 to 6."
      RowsVerified:
        when:
          - { field: RowsVerified, op: geq, value: 0 }
        message: "A count of rows cannot be negative."
      SeamsFound:
        when:
          - { field: SeamsFound, op: geq, value: 0 }
        message: "A count of seams cannot be negative."
      WeekEnding:
        when:
          - { field: WeekEnding, op: leq, value: today }
        message: "The five lines are written at the end of the week, not before it."

# Cross-column implications, `if A then B` as `any_of[not A, B]`; the rules
# a formula cannot hold are tabulated in 50-govern/governance.md.
list_validation:
  Service:
    when:
      # A claimed operator or supporter names a team. Unknown may stay blank.
      - any_of:
          - { field: RunBySide, op: eq, value: Unknown }
          - { field: RunByTeam, op: is_not_null }
      - any_of:
          - { field: SupportSide, op: eq, value: Unknown }
          - { field: SupportTeam, op: is_not_null }
      # Question 8 is the whole point of the single-person flag.
      - any_of:
          - { field: SinglePerson, op: eq, value: false }
          - { field: OutOfHours, op: is_not_null }
    message: "Naming a side that runs or supports this service needs the team or role beside it. A single-person service needs the out-of-hours answer."
  Seam:
    when:
      - any_of:
          - { field: Status, op: neq, value: Escalated }
          - all_of:
              - { field: ResolveOwner, op: is_not_null }
              - { field: ResolveBy, op: is_not_null }
      - any_of:
          - { field: Status, op: neq, value: Resolved }
          - { field: ResolvedOn, op: is_not_null }
    message: "Escalating a seam names who will resolve it and by when. Resolving it needs the resolved date."
  DocumentRequest:
    when:
      - any_of:
          - { field: Status, op: eq, value: "To ask" }
          - all_of:
              - { field: AskedOn, op: is_not_null }
              - { field: DueOn, op: is_not_null }
              - { field: Holder, op: is_not_null }
              - { field: HolderSide, op: neq, value: Unknown }
      - any_of:
          - { field: Status, op: in, value: ["To ask", Asked] }
          - { field: AnsweredOn, op: is_not_null }
      - any_of:
          - { field: Status, op: neq, value: Received }
          - { field: DocumentType, op: not_in, value: ["Services agreement", "Services schedule", Attestation] }
          - { field: SignedBy, op: is_not_null }
    message: "Once asked, a document says who was asked and on which side, with an asked-on date and a due date. Received, refused and not found each need the date the answer came back. A received agreement, schedule or attestation says who signed it, or Unsigned."
  Interview:
    when:
      - any_of:
          - { field: Status, op: neq, value: Completed }
          - all_of:
              - { field: DurationMin, op: is_not_null }
              - { field: InterviewDate, op: leq, value: today }
    message: "A completed interview has its duration, and its date cannot be in the future."
  Incident:
    when:
      - any_of:
          - { field: Source, op: neq, value: "Recalled outage" }
          - { field: SourceDetail, op: is_not_null }
    message: "A remembered outage says who remembered it, by role, in Source detail."

