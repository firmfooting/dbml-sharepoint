# Opportunities register — lean, health-ready physical mapping.
prefix: "OR_"

entities:
  Opportunity: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 200
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# This is a conversation-ordering score for routine opportunities, never a
# clinical-risk rating. Any safety, risk, equity, continuity, executive or
# statutory override blanks the local score and says to use the existing
# authorised priority instead.
calculated_formulas:
  Opportunity:
    PriorityScore: '=IF(AND(NOT(ISBLANK([PriorityOverride])),[PriorityOverride]<>"None"),"",IF(OR(ISBLANK([BenefitPotential]),ISBLANK([TimeCriticality])),"",IF([BenefitPotential]="Limited",1,IF([BenefitPotential]="Material",2,IF([BenefitPotential]="Major",3,4)))*IF([TimeCriticality]="Flexible",1,IF([TimeCriticality]="Within 12 months",2,IF([TimeCriticality]="Within 3 months",3,4)))))'
    PriorityBand: '=IF(AND(NOT(ISBLANK([PriorityOverride])),[PriorityOverride]<>"None"),"Use existing priority",IF(ISBLANK([PriorityScore]),"",IF([PriorityScore]>=13,"Prompt decision",IF([PriorityScore]>=9,"Prioritise",IF([PriorityScore]>=5,"Consider","Routine")))))'
    DaysToDecision: '=IF(OR(ISBLANK([IdentifiedDate]),ISBLANK([DecisionDate])),"",DATEDIF([IdentifiedDate],[DecisionDate],"d"))'

# Least privilege by default:
#   - ordinary Site Members and Owners receive no declared list grant;
#   - a small, deliberately populated Submitters group can create and read;
#   - the deployment guide makes SharePoint's manual "read own items" setting
#     a hard go-live gate, because the deployer cannot reconcile that setting;
#   - Stewards work every item without item-delete rights. ManageLists is
#     necessary to bypass SharePoint's read-own filtering; keep the group tiny
#     and retain column sealing plus list-deletion protection;
#   - Full Control stays in the administrator group.
groups:
  - name: "OR Opportunity Submitters"
    description: "Named project staff allowed to submit opportunities. Keep this group small; configure read-own item-level access before adding members."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
  - name: "OR Opportunity Stewards"
    description: "Small routing team that triages, coordinates decisions and verifies hand-offs through existing governance."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
  - name: "List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: true
    enroll_operator_during_deploy: true
  - name: "Enterprise Readers"
    description: "Read-only accounts for aggregated cross-site reporting. Empty by default; membership is operator-owned."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_enterprise_reader: true

permission_levels:
  - name: "OR Submit Only"
    description: "Submit and read according to list item-level settings; no edit, delete or schema rights."
    base_permissions:
      - AddListItems
      - ViewListItems
      - ViewVersions
      - ViewFormPages
      - Open
      - ViewPages
      - BrowseUserInfo
      - UseRemoteAPIs
  - name: "OR Steward No Delete"
    description: "Work all opportunities under read-own item settings. Includes ManageLists to bypass item filtering, but no item-delete permission; keep membership tightly controlled."
    base_permissions:
      - ManageLists
      - AddListItems
      - EditListItems
      - ViewListItems
      - ViewVersions
      - ViewFormPages
      - Open
      - ViewPages
      - BrowseUserInfo
      - UseRemoteAPIs

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "OR Opportunity Submitters" }
        level: "OR Submit Only"
      - principal: { kind: group, name: "OR Opportunity Stewards" }
        level: "OR Steward No Delete"
      - principal: { kind: group, name: "List Administrators" }
        level: "Full Control"
      - principal: { kind: group, name: "Enterprise Readers" }
        level: "Read"

seal_columns: true
prevent_list_deletion: true

display_names:
  mode: auto
  overrides:
    Opportunity:
      Title: "Problem or opportunity"
      SafetyScreen: "Safety and privacy check"
      ServiceArea: "Service or facility area"
      EvidenceLink: "Evidence or source link"
      ProjectReference: "Project link"
      ScopeBoundary: "Why the project cannot own it"
      ProjectRelationship: "Relationship to project"
      EvidenceSummary: "Triage evidence summary"
      TriageOutcome: "Triage route"
      PatientConsumerImpact: "Patient, consumer and equity consideration"
      BenefitMeasure: "Proposed benefit measure"
      PriorityOverride: "Safety, equity or authority override"
      DestinationReference: "Receiving record or control ID"
      DestinationLink: "Receiving record link"

# All visual states use the shared native SharePoint semantic styles. The
# decision-row formatter uses tenant theme classes rather than a fixed palette.
column_formatting:
  Opportunity:
    SafetyScreen:
      style: severity
      map:
        "Required pathways checked - safe to record here": good
        "Urgent, sensitive or unsure - use routing guide first": severe
    Status:
      style: severity
      map:
        Captured: neutral
        Assessing: low
        "Awaiting decision": warning
        Accepted: low
        Parked: warning
        Transferred: good
        "Not proceeding": muted
        Duplicate: muted
    TriageOutcome:
      style: pill
      map:
        "Assess here": low
        "Clinical incident or safety system": severe
        "Organisational risk system": warning
        "Complaint or open disclosure system": warning
        "Privacy or cyber process": severe
        "Project issue or change control": low
        "Direct hand-off to known owner": good
        "Duplicate or already governed": muted
        "Close after screening": muted
    BenefitPotential:
      style: pill
      map: { Limited: neutral, Material: low, Major: good, "System-wide": good }
    TimeCriticality:
      style: severity
      map: { Flexible: neutral, "Within 12 months": low, "Within 3 months": warning, "Time-sensitive": severe }
    EffortBand:
      style: pill
      map: { Unknown: neutral, Small: good, Medium: low, Large: warning }
    PriorityOverride:
      style: severity
      map:
        None: neutral
        "Existing safety or risk priority applies": severe
        "Equity or cultural safety consideration": warning
        "Service continuity consideration": warning
        "Executive or statutory direction": warning
    PriorityBand:
      style: severity
      calculated: true
      map: { Routine: neutral, Consider: low, Prioritise: warning, "Prompt decision": severe, "Use existing priority": severe }
    PriorityScore:
      style: data-bar
      max: 16
      calculated: true
      color_by:
        field: PriorityBand
        calculated: true
        map: { Routine: neutral, Consider: low, Prioritise: warning, "Prompt decision": severe, "Use existing priority": severe }
    NextActionDue:
      style: overdue-date
      guard: { field: Status, not: [Captured, Transferred, "Not proceeding", Duplicate] }
    DecisionDueDate:
      style: overdue-date
      guard: { field: Status, not: [Captured, Assessing, Accepted, Parked, Transferred, "Not proceeding", Duplicate] }
    ReviewDueDate:
      style: overdue-date
      guard: { field: Status, not: [Captured, Assessing, "Awaiting decision", Accepted, Transferred, "Not proceeding", Duplicate] }

# Five operational queues. There is deliberately no giant portfolio dashboard
# and no Quick wins view: stewards work exceptions and decision points, while
# the generated All Items view remains a hidden recovery/reporting surface.
views:
  Opportunity:
    - title: "Needs triage"
      default: true
      fields: [Title, ServiceArea, SourceProject, Author, IdentifiedDate,
               ScopeBoundary, Status]
      where:
        - { field: Status, op: eq, value: Captured }
      sort:
        - { field: IdentifiedDate, direction: asc }
      widths:
        Title: 320
        ServiceArea: 220
        SourceProject: 190
        Author: 170
        IdentifiedDate: 150
        ScopeBoundary: 300
        Status: 120
    - title: "Assessments"
      fields: [Title, ServiceArea, Theme, BenefitPotential, TimeCriticality,
               PriorityOverride, PriorityBand, EffortBand, OpportunityOwner,
               NextActionDue, Status]
      where:
        - { field: Status, op: eq, value: Assessing }
      sort:
        - { field: NextActionDue, direction: asc }
        - { field: IdentifiedDate, direction: asc }
      widths:
        Title: 300
        ServiceArea: 210
        Theme: 190
        BenefitPotential: 140
        TimeCriticality: 150
        PriorityOverride: 240
        PriorityBand: 160
        EffortBand: 110
        OpportunityOwner: 170
        NextActionDue: 160
        Status: 120
    - title: "Decisions"
      fields: [Title, ServiceArea, PriorityOverride, BenefitPotential,
               TimeCriticality, PriorityBand, PriorityScore, EffortBand,
               DecisionMaker, DecisionDueDate, Status]
      where:
        - { field: Status, op: eq, value: "Awaiting decision" }
      sort:
        - { field: DecisionDueDate, direction: asc }
      formatting: formatting/row-decision-attention.json
      widths:
        Title: 310
        ServiceArea: 210
        PriorityOverride: 240
        BenefitPotential: 140
        TimeCriticality: 150
        PriorityBand: 160
        PriorityScore: 140
        EffortBand: 110
        DecisionMaker: 170
        DecisionDueDate: 170
        Status: 150
    - title: "Handoff and deferred"
      fields: [Title, ServiceArea, Status, DeliveryRoute, OpportunityOwner,
               ReviewDueDate, NextAction, NextActionDue, DestinationReference]
      where:
        - { field: Status, op: in, value: [Accepted, Parked] }
      sort:
        - { field: NextActionDue, direction: asc }
      widths:
        Title: 290
        ServiceArea: 210
        Status: 130
        DeliveryRoute: 210
        OpportunityOwner: 170
        ReviewDueDate: 160
        NextAction: 280
        NextActionDue: 160
        DestinationReference: 230
    - title: "Closed and redirected"
      fields: [Title, ServiceArea, TriageOutcome, Status, DeliveryRoute,
               DestinationReference, DestinationLink, DecisionDate, Modified]
      where:
        - { field: Status, op: in, value: [Transferred, "Not proceeding", Duplicate] }
      sort:
        - { field: Modified, direction: desc }
      widths:
        Title: 300
        ServiceArea: 210
        TriageOutcome: 260
        Status: 150
        DeliveryRoute: 210
        DestinationReference: 230
        DestinationLink: 170
        DecisionDate: 150
        Modified: 170

# New asks for four required facts plus the mandatory stop gate. Links and the
# scope explanation are optional at intake; stewards complete everything else.
form_visibility:
  Opportunity:
    reconcile: exact
    columns:
      IdentifiedDate: { new: false }
      ProjectContact: { new: false }
      ProjectRelationship: { new: false }
      Theme: { new: false }
      AffectedGroups: { new: false }
      EvidenceSummary: { new: false }
      TriageOutcome: { new: false }
      OpportunityOwner: { new: false }
      Status: { new: false }
      NextAction: { new: false }
      NextActionDue: { new: false }
      BenefitType:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      BenefitPotential:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      TimeCriticality:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      EffortBand:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      StrategicAlignment:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      PatientConsumerImpact:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      BenefitMeasure:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      PriorityOverride:
        new: false
        when:
          - { field: TriageOutcome, op: eq, value: "Assess here" }
      DecisionMaker:
        new: false
        when:
          - { field: Status, op: in, value: [Assessing, "Awaiting decision"] }
      DecisionDueDate:
        new: false
        when:
          - { field: Status, op: eq, value: "Awaiting decision" }
      DecisionDate:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted, Parked, Transferred, "Not proceeding"] }
      DecisionRationale:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted, Parked, Transferred, "Not proceeding", Duplicate] }
      DeliveryRoute:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted, Transferred] }
      ReviewDueDate:
        new: false
        when:
          - { field: Status, op: eq, value: Parked }
      DestinationReference:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted, Transferred, Duplicate] }
      DestinationLink:
        new: false
        when:
          - { field: Status, op: in, value: [Accepted, Transferred, Duplicate] }

form_formatting:
  Opportunity:
    header: formatting/opportunity-form-header.json
    body: formatting/opportunity-form-body.json

column_validation:
  Opportunity:
    reconcile: exact
    columns:
      SafetyScreen:
        when:
          - { field: SafetyScreen, op: eq, value: "Required pathways checked - safe to record here" }
        message: "Stop and use the routing-guide link above for any urgent, sensitive or uncertain matter. Return only with a de-identified process opportunity after the required pathway has been used."
      ScopeBoundary:
        when:
          any_of:
            - { field: ScopeBoundary, op: is_null }
            - { field: ScopeBoundary, measure: length, op: gt, value: 15 }
        message: "Leave this blank for a steward to confirm, or explain the real scope, authority or funding boundary in more than 15 characters."
      BenefitMeasure:
        when:
          any_of:
            - { field: BenefitMeasure, op: is_null }
            - { field: BenefitMeasure, measure: length, op: gt, value: 10 }
        message: "Give a usable baseline, target or unit rather than only a measure label."
      DecisionDate:
        when:
          any_of:
            - { field: DecisionDate, op: is_null }
            - { field: DecisionDate, op: leq, value: today }
        message: "Use the date the decision occurred; it cannot be in the future."

# Fast exits are intentionally cheap. Full benefit data is required only when
# the register commissions a decision or accepts/parks an item. Redirects,
# direct hand-offs, screening closures, assessed no decisions and duplicates
# need only the facts relevant to that outcome. Stewards check that Status and
# Triage Outcome tell the same story; the scalar formula stays below
# SharePoint's 32-condition ceiling.
list_validation:
  Opportunity:
    when:
      - any_of:
          - { field: Status, op: eq, value: Captured }
          - all_of:
              - { field: TriageOutcome, op: is_not_null }
              - { field: ScopeBoundary, op: is_not_null }
      - any_of:
          - { field: Status, op: not_in, value: ["Awaiting decision", Accepted, Parked] }
          - all_of:
              - { field: BenefitType, op: is_not_null }
              - { field: BenefitPotential, op: is_not_null }
              - { field: TimeCriticality, op: is_not_null }
              - { field: EffortBand, op: is_not_null }
              - { field: EffortBand, op: neq, value: Unknown }
              - { field: BenefitMeasure, op: is_not_null }
      - any_of:
          - { field: Status, op: in, value: [Captured, Transferred, "Not proceeding", Duplicate] }
          - all_of:
              - { field: NextAction, op: is_not_null }
              - { field: NextActionDue, op: is_not_null }
      - any_of:
          - { field: Status, op: neq, value: "Awaiting decision" }
          - { field: DecisionDueDate, op: is_not_null }
      - any_of:
          - { field: Status, op: not_in, value: [Accepted, Parked] }
          - { field: DecisionDate, op: is_not_null }
      - any_of:
          - { field: Status, op: not_in, value: [Accepted, Transferred] }
          - { field: DeliveryRoute, op: is_not_null }
      - any_of:
          - { field: Status, op: neq, value: Parked }
          - { field: ReviewDueDate, op: is_not_null }
      - any_of:
          - { field: Status, op: not_in, value: [Transferred, Duplicate] }
          - { field: DestinationReference, op: is_not_null }
    message: "Check this stage: leaving Captured needs a triage route and confirmed project boundary. Full benefit data is needed only for Awaiting decision, Accepted or Parked. Active work needs a dated next action. Decision, parking, transfer and duplicate stages need their relevant date, route or receiving reference."

