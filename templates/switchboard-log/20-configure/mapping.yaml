# Switchboard log — physical mapping.
prefix: "SB_"

entities:
  CodeEvent:   { kind: List, base_template: 100, site_role: default }
  MessageLog:  { kind: List, base_template: 100, site_role: default }
  Key:         { kind: List, base_template: 100, site_role: default }
  KeyMovement: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 200
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# Datetime subtraction yields days; x1440 gives whole minutes.
calculated_formulas:
  CodeEvent:
    DurationMinutes: '=IF(OR(ISBLANK([AnnouncedAt]),ISBLANK([AllClearAt])),"",ROUND(([AllClearAt]-[AnnouncedAt])*1440,0))'
  MessageLog:
    MinutesToRelay: '=IF(OR(ISBLANK([TakenAt]),ISBLANK([RelayedAt])),"",ROUND(([RelayedAt]-[TakenAt])*1440,0))'

# Security — switchboard traffic is sensitive (welfare calls, police
# contact, after-hours movements): ordinary site Members have NO grant;
# operators record and maintain; Full Control confined to the empty-by-
# default admin group. Scope SITE membership to switchboard + supervisors.
groups:
  - name: "SB Switchboard Operators"
    description: "Switchboard/after-hours operators: log codes, take and relay messages, issue and receive keys."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "SB List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_operator_during_deploy: true

permission_levels: []

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "SB Switchboard Operators" }
        level: "Contribute"
      - principal: { kind: group, name: "SB List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_owner_group }
        level: "Contribute"

# UI hardening (tamper-resilience): site owners/admins bypass every ACL,
# so the realistic threat is well-meaning UI tampering. Sealed columns
# block schema edits and deletion of every deployed column through the
# UI even for site admins (display-name renames stay possible — drift,
# reverted on re-paste; the deployer unseals for its own runs and
# re-seals in Phase 4.1); prevent_list_deletion blocks UI deletion of the
# list objects (rollback.js clears it per list after you confirm that
# list's deletion). Friction + tamper-evidence, not enforcement — see
# "The shared security model" in templates/README.md.
seal_columns: true
prevent_list_deletion: true

# Internal names stay authoritative (the lookup, the indexes, both
# formulas and the reporting bundle bind to them); only display titles
# change. Two overrides: auto-splitting turns "IsDrill" into "Is Drill",
# which is a question rather than a column heading, and "CodeLocation"
# exists to keep a bare "Location" out of the DBML.
display_names:
  mode: auto
  overrides:
    CodeEvent:
      IsDrill: "Drill"
      CodeLocation: "Location"

# Column formatting: the fleet style standard (website/docs/reference/
# style-guide.md), tokens mapped by the ROLE a member plays.
#
# AllClearAt is a bespoke file, and it is the third and most consequential
# instance of this theme's blank-means-something pattern (visitor-log's
# SignedOutAt and vehicle-log's ReturnedAt are the others). A blank cell
# here is not missing data: it is a code that has not been stood down.
# Where the other two render blank in the `low` treatment — a visitor is on
# site, a car is out, both unremarkable — this one renders `severe` with a
# warning icon and the word "Running", because a code with no all-clear is
# either live or an incomplete record, and governance calls the missing
# all-clear "the classic gap".
#
# "Pending relay" was mapped `neutral` before this uplift. A message
# waiting to reach an on-call manager at 2 a.m. is the definition of needs
# attention; the role table puts Waiting on `warning`, and that is where it
# goes. "Closed - no relay needed" takes `muted` rather than a second
# green — it is a decision that no relay was required, not a relay.
#
# MinutesToRelay takes its bar fill from Urgency, so twenty minutes reads
# green on a Routine message and red on an Emergency one without the
# operator consulting the escalation table.
#
# Deliberately NOT formatted: CodeType (nine emergency codes with no
# gradient between them — a colour ladder over them would invent a
# hierarchy your procedures do not have), and the two boolean columns,
# which SharePoint renders as Yes/No and which no style in the library
# covers.
column_formatting:
  CodeEvent:
    AllClearAt: formatting/all-clear-at.json
    DurationMinutes: { style: data-bar, max: 120, calculated: true }
  MessageLog:
    Urgency:
      style: pill
      map: { "Routine": neutral, "Urgent": warning, "Emergency": blocked }
    Status:
      style: severity
      map:
        "Pending relay": warning
        "Relayed": good
        "Closed - no relay needed": muted
    MinutesToRelay:
      style: data-bar
      max: 60
      calculated: true
      color_by:
        field: Urgency
        map: { "Routine": neutral, "Urgent": warning, "Emergency": blocked }
  KeyMovement:
    Status:
      style: severity
      map: { "Out": low, "Returned": good }

# The identifying spine each list's views open with. Three of the four
# lists have three or more views sharing one, which is §1.9's threshold;
# Key has two and names its columns directly.
field_sets:
  CodeEvent:
    identity: [Title, CodeType, CodeLocation, IsDrill, AnnouncedAt, AllClearAt, AnnouncedBy]
  MessageLog:
    identity: [Title, TakenAt, CallerName, ForWhom, Urgency, Status, TakenBy]
  KeyMovement:
    identity: [Title, Key, IssuedTo, IssuedAt, Status, ReturnedAt, IssuedBy]

# Declared views (deployed and reconciled by the views phase; undeclared
# views are never touched). Twelve across four lists. Widths are pixel
# ColumnWidth per view, keyed on INTERNAL names — the build rewrites them
# to display titles, and ColumnWidth binds by display name.
views:
  CodeEvent:
    - title: "Code log"
      default: true
      fields: ["@identity", DurationMinutes, InitiatedBy]
      sort:
        - { field: AnnouncedAt, direction: desc }
      widths:
        Title: 280
        CodeType: 220
        CodeLocation: 200
        IsDrill: 110
        AnnouncedAt: 180
        AllClearAt: 180
        AnnouncedBy: 160
        DurationMinutes: 150
        InitiatedBy: 200
    - title: "Real events only"
      fields: ["@identity", DurationMinutes, InitiatedBy]
      where:
        - { field: IsDrill, op: eq, value: false }
      sort:
        - { field: AnnouncedAt, direction: desc }
      widths:
        Title: 280
        CodeType: 220
        CodeLocation: 200
        IsDrill: 110
        AnnouncedAt: 180
        AllClearAt: 180
        AnnouncedBy: 160
        DurationMinutes: 150
        InitiatedBy: 200
    # Governance asks for drill coverage per code type, and says the
    # IsDrill filter should make the coverage GAP visible in one view.
    # A flat filtered list cannot show a gap; grouping by code type can —
    # a type with no group is a type nobody has drilled.
    - title: "Drills"
      fields: ["@identity", DurationMinutes]
      where:
        - { field: IsDrill, op: eq, value: true }
      group_by: { field: CodeType, collapsed: true }
      sort:
        - { field: AnnouncedAt, direction: desc }
      widths:
        Title: 280
        CodeType: 220
        CodeLocation: 200
        IsDrill: 110
        AnnouncedAt: 180
        AllClearAt: 180
        AnnouncedBy: 160
        DurationMinutes: 150
    # The missing all-clear is what governance calls the classic gap: the
    # code ended, the operator moved on, and the row says the code is still
    # running. On a live board this view is either the current emergency or
    # this morning's tidy-up, and either way somebody has to look.
    - title: "Still running"
      fields: ["@identity", InitiatedBy]
      where:
        - { field: AllClearAt, op: is_null }
      sort:
        - { field: AnnouncedAt, direction: asc }
      widths:
        Title: 280
        CodeType: 220
        CodeLocation: 200
        IsDrill: 110
        AnnouncedAt: 180
        AllClearAt: 180
        AnnouncedBy: 160
        InitiatedBy: 200
  MessageLog:
    # The live board every operator watches, and the first thing checked at
    # handover.
    #
    # The published table asked for "Urgency then oldest". SharePoint sorts
    # a Choice column as text, and this enum sorts Emergency, Routine,
    # Urgent — so neither direction gives the intended order, and there is
    # no numeric rank column to sort on. The view sorts oldest first, and
    # urgency is carried by the pill and by the row wash instead, which is
    # the honest substitution. 30-deploy/DEPLOY.md says so.
    #
    # THE ROW WASH LIVES HERE, and it is this list's one row-level signal
    # (§1.6). An Emergency message still pending relay at 2 a.m. is the
    # drop-everything row. The formatter reads [$Urgency], so Urgency must
    # stay in this view's `fields`: a view formatter can only see the
    # columns its own view displays. It compares with `==` because Urgency
    # is a plain Choice column and a view formatter's [$Field] arrives
    # clean — the `string;#` prefix belongs to column formatting over
    # calculated columns and would be wrong here.
    - title: "Pending relay"
      default: true
      fields: ["@identity", CallerContact, RelayedTo, RelayedAt]
      where:
        - { field: Status, op: eq, value: "Pending relay" }
      sort:
        - { field: TakenAt, direction: asc }
      formatting: formatting/row-emergency.json
      widths:
        Title: 260
        TakenAt: 180
        CallerName: 200
        ForWhom: 200
        Urgency: 130
        Status: 220
        TakenBy: 160
        CallerContact: 160
        RelayedTo: 200
        RelayedAt: 180
    # The published table promised an "Overnight report" filtered to the
    # last 24 hours. CAML has no rolling-hours predicate — `today-1` is
    # midnight yesterday, so this view is the last one to two days
    # depending on when it is opened. That is right for a morning handover
    # and wrong for an exact 24-hour count; 30-deploy/DEPLOY.md says which.
    - title: "Last 24 hours"
      fields: ["@identity", CallerContact, RelayedTo, RelayedAt, MinutesToRelay]
      where:
        - { field: TakenAt, op: geq, value: today-1 }
      sort:
        - { field: TakenAt, direction: desc }
      widths:
        Title: 240
        TakenAt: 180
        CallerName: 200
        ForWhom: 200
        Urgency: 130
        Status: 220
        TakenBy: 160
        CallerContact: 160
        RelayedTo: 200
        RelayedAt: 180
        MinutesToRelay: 150
    # Governance publishes a relay target per urgency band. This is where
    # the manager finds out whether the targets are met — grouped by band,
    # rolling thirty days, with each message's own minutes and a bar. There
    # is no mean under a group: column aggregations are not a capability
    # this tool ships.
    - title: "Relay times"
      fields: ["@identity", RelayedTo, RelayedAt, MinutesToRelay]
      where:
        - { field: Status, op: eq, value: "Relayed" }
        - { field: TakenAt, op: geq, value: today-30 }
      group_by: { field: Urgency, collapsed: true }
      totals:
        MinutesToRelay: avg
      sort:
        - { field: TakenAt, direction: desc }
      widths:
        Title: 240
        TakenAt: 180
        CallerName: 200
        ForWhom: 200
        Urgency: 130
        Status: 220
        TakenBy: 160
        RelayedTo: 200
        RelayedAt: 180
        MinutesToRelay: 150
  Key:
    - title: "The key register"
      default: true
      fields: [Title, KeyRef, Covers, Restrictions, Active]
      where:
        - { field: Active, op: eq, value: true }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 260
        KeyRef: 130
        Covers: 240
        Restrictions: 280
        Active: 110
    # A lost or retired key is unticked, never deleted — the movements
    # against it are security evidence, and the lock-change decision is
    # recorded here. This is where those keys live.
    - title: "Retired and lost keys"
      fields: [Title, KeyRef, Covers, Restrictions, Active]
      where:
        - { field: Active, op: eq, value: false }
      sort:
        - { field: Title, direction: asc }
      widths:
        Title: 260
        KeyRef: 130
        Covers: 240
        Restrictions: 280
        Active: 110
  KeyMovement:
    # The glance that answers "who has it?", and the second thing checked
    # at handover.
    - title: "Keys out now"
      default: true
      fields: ["@identity", Notes]
      where:
        - { field: Status, op: eq, value: "Out" }
      sort:
        - { field: IssuedAt, direction: asc }
      widths:
        Title: 240
        Key: 220
        IssuedTo: 240
        IssuedAt: 180
        Status: 130
        ReturnedAt: 180
        IssuedBy: 160
        Notes: 200
    # Governance chases any key out longer than its purpose warrants. A key
    # issued before midnight this morning and still out is that chase list.
    - title: "Out since before today"
      fields: ["@identity", Notes]
      where:
        - { field: Status, op: eq, value: "Out" }
        - { field: IssuedAt, op: lt, value: today }
      sort:
        - { field: IssuedAt, direction: asc }
      widths:
        Title: 240
        Key: 220
        IssuedTo: 240
        IssuedAt: 180
        Status: 130
        ReturnedAt: 180
        IssuedBy: 160
        Notes: 200
    # Every movement ever, grouped under its key and collapsed. This is the
    # quarterly catalogue audit's working surface: pick the key, expand it,
    # read its whole history. A per-key FILTER is not buildable — SharePoint
    # has no per-parent view — and grouping is the idiom that replaces it
    # (§2.4), one view rather than one per key.
    - title: "By key"
      fields: ["@identity", Notes]
      group_by: { field: Key, collapsed: true }
      sort:
        - { field: IssuedAt, direction: desc }
      widths:
        Title: 240
        Key: 220
        IssuedTo: 240
        IssuedAt: 180
        Status: 130
        ReturnedAt: 180
        IssuedBy: 160
        Notes: 200

# Three of the four lists are filled in two passes, and the forms follow
# the operators' guide rather than the schema. During a code the operator's
# job is the code: two fields and save, the rest at stand-down. A message
# is taken, then relayed, then recorded. A key goes out, then comes back.
# Each second-pass field is off the New form, and the relay and return
# fields also wait until the status that gives them meaning.
#
# reconcile: exact makes this file authoritative for each list — every
# other column's conditional formula is cleared on each deploy.
form_visibility:
  CodeEvent:
    reconcile: exact
    columns:
      AllClearAt: { new: false }
      EventNotes: { new: false }
  MessageLog:
    reconcile: exact
    columns:
      RelayedTo:
        new: false
        when:
          - { field: Status, op: eq, value: "Relayed" }
      RelayedAt:
        new: false
        when:
          - { field: Status, op: eq, value: "Relayed" }
  KeyMovement:
    reconcile: exact
    columns:
      ReturnedAt:
        new: false
        when:
          - { field: Status, op: eq, value: "Returned" }

# Form layouts: a strapline header and sections on all four lists. The
# KeyMovement title line falls back to "Key movement" rather than "New key
# movement", because Title is optional there — a movement is identified by
# its key and its time, so an empty Title does not mean the row is new.
# Section field lists are authored with INTERNAL names; the build rewrites
# them to display titles.
form_formatting:
  CodeEvent:
    header: formatting/codeevent-form-header.json
    body: formatting/codeevent-form-body.json
  MessageLog:
    header: formatting/messagelog-form-header.json
    body: formatting/messagelog-form-body.json
  Key:
    header: formatting/key-form-header.json
    body: formatting/key-form-body.json
  KeyMovement:
    header: formatting/keymovement-form-header.json
    body: formatting/keymovement-form-body.json

# Per-column save rules, each with its own message. Every one of these
# columns is a DATETIME, and `now` renders as NOW() in a validation formula
# — verified on a live tenant on 2026-07-29
# (test/manual/datetime-sentinel-probe.js), against Microsoft's own formula
# reference, which says Lists do not support NOW(). True of calculated
# columns, false here.
#
# `now` rather than `today`, because TODAY() in a validation formula is
# midnight: `leq today` on a datetime rejects everything stamped after
# 00:00, which at a switchboard is everything. The whole-day alternative,
# `today+1`, permits up to twenty-four hours of future-dating.
#
# Exactness matters more here than anywhere else in the library. The
# switchboard record is only trusted because it is contemporaneous, and a
# mistyped year on a code announcement is not a cosmetic error: it moves an
# emergency activation out of the committee's monthly window entirely.
column_validation:
  CodeEvent:
    columns:
      AnnouncedAt:
        when:
          - { field: AnnouncedAt, op: leq, value: now }
        message: "A code cannot be announced in the future. Use the time the announcement was actually made."
      AllClearAt:
        when:
          - { field: AllClearAt, op: leq, value: now }
        message: "An all-clear cannot be in the future. Leave it blank until stand-down is announced."
  MessageLog:
    columns:
      TakenAt:
        when:
          - { field: TakenAt, op: leq, value: now }
        message: "A message cannot be taken in the future. Use the time the call came in."
      RelayedAt:
        when:
          - { field: RelayedAt, op: leq, value: now }
        message: "A relay cannot be in the future. Leave it blank until someone has actually received the message."
  KeyMovement:
    columns:
      IssuedAt:
        when:
          - { field: IssuedAt, op: leq, value: now }
        message: "A key cannot be issued in the future. Use the time it left the switch."
      ReturnedAt:
        when:
          - { field: ReturnedAt, op: leq, value: now }
        message: "A return cannot be in the future. Leave it blank until the key is physically back."

# Save-time enforcement, on the LIST so it may reference more than one
# column.
#
# MessageLog is governance's data-quality rule 3 — messages record who
# ACTUALLY received them, not who was attempted — and it is the rule the
# whole message book stands on. "Left voicemail" is not relayed; a message
# marked Relayed with no name and no time is a 2 a.m. call with no trail,
# which is the failure the register exists to prevent.
#
# KeyMovement: a movement marked Returned with no return time leaves the
# key register unable to say when it came back, which is the one question
# a security audit asks.
#
# Deliberately NOT declared on CodeEvent: the completeness rule the
# switchboard manager checks within a business day (times, all-clear,
# notes) is not expressible. EventNotes is rich text, which SharePoint
# validation formulas cannot reference at all; and requiring an AllClearAt
# would refuse to save the row at the moment a code is ANNOUNCED, which is
# precisely when it must be recorded. The "Still running" view is the
# control instead, and 50-govern/GOVERNANCE.md says so.
list_validation:
  MessageLog:
    when:
      any_of:
        - { field: Status, op: neq, value: "Relayed" }
        - all_of:
            - { field: RelayedTo, op: is_not_null }
            - { field: RelayedAt, op: is_not_null }
    message: "A relayed message records who actually received it and when. If you only left a voicemail, it is still Pending relay."
  KeyMovement:
    when:
      any_of:
        - { field: Status, op: neq, value: "Returned" }
        - { field: ReturnedAt, op: is_not_null }
    message: "A key marked Returned needs the time it came back."

# Demo rows (emitted as demo-data.js ONLY when built with --seed). Every
# Title starts "[DEMO] " — the marker rollback.js trusts to delete
# demo-only lists without its non-empty refusal. Keys are created before
# the movements that reference them. Coverage: every Status and Urgency
# member, real events and drills on both sides of the IsDrill filter, a
# code still running so the "Running" treatment is visible, and an
# Emergency message still pending so the row wash fires.
#
# Nothing here contains clinical detail. Operators log what switchboard
# DID; the healthcare note in 50-govern/GOVERNANCE.md is emphatic about
# that boundary and demo data that blurred it would undermine the document
# it sits beside.
demo_items:
