# Risk register — physical mapping. THE MATRIX LIVES HERE.
prefix: "RR_"

entities:
  Risk: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

indexed_columns:
  Risk: [Status, Category]

versioning:
  default:
    enable_versioning: true
    major_version_limit: 200
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# The 5x5 matrix, encoded cell-by-cell (rows = likelihood Rare..Almost
# Certain; columns = consequence Minor..Business Critical):
#
#                 Minor   Moderate  Substantial  Major    Business Critical
#  Rare           Low     Low       Low          Medium   Medium
#  Unlikely       Low     Low       Medium       Medium   High
#  Likely         Low     Medium    Medium       High     High
#  Very Likely    Medium  Medium    High         High     Extreme
#  Almost Certain Medium  High      High         Extreme  Extreme
#
# RiskScore is the matrix score 1-25 for sorting. Both are guarded on
# MatrixVersion: a row stamped to an older matrix shows blank rather than
# being silently re-rated. LevelsAboveTarget and NextReviewDue read
# ResidualRiskRating, itself calculated — SharePoint permits calc-on-calc
# and jsgen provisions them in dependency order (_order_calculated_after_
# references), so declaration order here does not matter.
#
# CHANGE CONTROL: SharePoint recalculates every existing row when a formula
# changes — read 50-govern/GOVERNANCE.md before editing these cells.
calculated_formulas:
  Risk:
    ResidualRiskRating: '=IF(OR(ISBLANK([Likelihood]),ISBLANK([Consequence]),[MatrixVersion]<>"1.0"),"",CHOOSE((IF([Likelihood]="Rare",1,IF([Likelihood]="Unlikely",2,IF([Likelihood]="Likely",3,IF([Likelihood]="Very Likely",4,5))))-1)*5+IF([Consequence]="Minor",1,IF([Consequence]="Moderate",2,IF([Consequence]="Substantial",3,IF([Consequence]="Major",4,5)))),"Low","Low","Low","Medium","Medium","Low","Low","Medium","Medium","High","Low","Medium","Medium","High","High","Medium","Medium","High","High","Extreme","Medium","High","High","Extreme","Extreme"))'
    RiskScore: '=IF(OR(ISBLANK([Likelihood]),ISBLANK([Consequence]),[MatrixVersion]<>"1.0"),"",CHOOSE((IF([Likelihood]="Rare",1,IF([Likelihood]="Unlikely",2,IF([Likelihood]="Likely",3,IF([Likelihood]="Very Likely",4,5))))-1)*5+IF([Consequence]="Minor",1,IF([Consequence]="Moderate",2,IF([Consequence]="Substantial",3,IF([Consequence]="Major",4,5)))),1,4,6,13,15,2,5,11,14,21,3,9,12,19,22,7,10,17,20,24,8,16,18,23,25))'
    LevelsAboveTarget: '=IF(OR([ResidualRiskRating]="",ISBLANK([TargetRiskRating])),"",IF([ResidualRiskRating]="Low",1,IF([ResidualRiskRating]="Medium",2,IF([ResidualRiskRating]="High",3,4)))-IF([TargetRiskRating]="Low",1,IF([TargetRiskRating]="Medium",2,IF([TargetRiskRating]="High",3,4))))'
    NextReviewDue: '=IF(OR(ISBLANK([LastReviewedDate]),[ResidualRiskRating]=""),"",DATE(YEAR([LastReviewedDate]),MONTH([LastReviewedDate])+IF(OR([ResidualRiskRating]="High",[ResidualRiskRating]="Extreme",[OverallControlEffectiveness]="Inadequate",[OverallControlEffectiveness]="Uncontrolled",AND(NOT(ISBLANK([TargetRiskRating])),IF([ResidualRiskRating]="Low",1,IF([ResidualRiskRating]="Medium",2,IF([ResidualRiskRating]="High",3,4)))-IF([TargetRiskRating]="Low",1,IF([TargetRiskRating]="Medium",2,IF([TargetRiskRating]="High",3,4)))>=2)),3,IF(OR([RiskResponse]="Manage",[RiskResponse]="Tolerate",[OverallControlEffectiveness]="Partially effective"),6,12)),DAY([LastReviewedDate])))'

# Security: risks are maintained by a managers group; everyone reads.
groups:
  - name: "RR Risk Managers"
    description: "Staff who create, rate and maintain risk records."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
  - name: "RR List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_operator_during_deploy: true

permission_levels: []

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "RR Risk Managers" }
        level: "Contribute"
      - principal: { kind: group, name: "RR List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Read"
      - principal: { kind: associated_owner_group }
        level: "Read"

# UI hardening (tamper-resilience): site owners/admins bypass every ACL,
# so the realistic threat is well-meaning UI tampering. Sealed columns
# block schema edits and deletion of every deployed column through the
# UI even for site admins (display-name renames stay possible — drift,
# reverted on re-paste; the deployer unseals for its own runs and
# re-seals in Phase 4.1); prevent_list_deletion blocks UI deletion of the
# list objects (rollback.js clears it per list after you confirm that
# list's deletion). Friction + tamper-evidence, not enforcement — see
# "The shared security model" in templates/README.md.
seal_columns: true
prevent_list_deletion: true

# Column formatting: the fleet style standard (dbml-sharepoint
# website/docs/reference/style-guide.md) — status columns render as
# SharePoint's own severity boxes with icons, consistent across every
# template.
column_formatting:
  Risk:
    Status: { style: severity, map: { Provisional: neutral, Open: low, Closed: good } }
