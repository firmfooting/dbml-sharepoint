        OdoStart: 88300
        OdoEnd: 88240
        Notes: "Demo row. Trip km comes out negative - the two readings are the wrong way round. This is the row the wash on By vehicle exists to catch."
    - key: ve-trip-commute
      values:
        Title: "[DEMO] Approved commute - on-call weekend"
        Vehicle: { demo_ref: ve-hilux }
        Driver: "@me"
        TripType: "Commute - approved"
        Purpose: "On-call weekend; vehicle garaged at home per the approved arrangement"
        DepartedAt: "today-20"
        ReturnedAt: "today-20"
