# Tiered huddle — physical mapping.
prefix: "TH_"

entities:
  Tier1Board: { kind: List, base_template: 100, site_role: default }
  Tier2Board: { kind: List, base_template: 100, site_role: default }
  Tier3Board: { kind: List, base_template: 100, site_role: default }
  Escalation: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

# Boards are filtered by date and headline status on every view; Escalation
# by queue state, due date, both tier ends and owner. BoardDate is also
# unique, which SharePoint indexes as a side effect — declared here anyway
# so the intent is visible in the manifest.
indexed_columns:
  Tier1Board: [BoardDate, OverallStatus, HuddleHeld]
  Tier2Board: [BoardDate, OverallStatus, HuddleHeld]
  Tier3Board: [BoardDate, OverallStatus, HuddleHeld]
  Escalation: [Status, DueDate, RaisedAtTier, TargetTier, Owner]

# House default, with the boards trimmed: a daily record edited several
# times a day burns versions fast, and old versions of a huddle board are
# worthless.
versioning:
  default:
    enable_versioning: true
    major_version_limit: 100
    enable_minor_versions: false
  overrides:
    Tier1Board: { major_version_limit: 50 }
    Tier2Board: { major_version_limit: 50 }
    Tier3Board: { major_version_limit: 50 }

enum_sources: {}
watched_lists: []

# Auto mode splits PascalCase into readable titles ("BoardDate" -> "Board
# Date"). Overrides only where the split reads wrong; internal names stay
# authoritative for views, formulas and reporting. Auto mode is also what
# carries the " (retired)" suffix onto a retired column's title.
display_names:
  mode: auto
  overrides:
    Tier2Board:
      DemandCapacityStatus: "Demand & Capacity Status"
      DemandCapacityNote: "Demand & Capacity Note"
    Tier3Board:
      QualitySafetyStatus: "Quality & Safety Status"
      QualitySafetyNote: "Quality & Safety Note"

# Named column lists, referenced from views with "@name". Adding or retiring
# a stream is edited HERE, once, and every view that uses the set picks it
# up. This is also why the heat grid can hold every status column and no
# note column — "fields: all" could not express that.
field_sets:
  Tier1Board:
    header:   [BoardDate, Chair, HuddleHeld, OverallStatus]
    statuses: [SafetyStatus, PeopleStatus, WorkloadStatus, EquipmentStatus, QualityStatus, ImprovementStatus]
    notes:    [SafetyNote, PeopleNote, WorkloadNote, EquipmentNote, QualityNote, ImprovementNote]
    wrapup:   [Recognition, OtherUpdates]
  Tier2Board:
    header:   [BoardDate, Chair, HuddleHeld, OverallStatus]
    statuses: [SafetyStatus, QualityStatus, WorkforceStatus, DemandCapacityStatus, EquipmentStatus, SuppliesStatus, FinanceStatus, ImprovementStatus]
    notes:    [SafetyNote, QualityNote, WorkforceNote, DemandCapacityNote, EquipmentNote, SuppliesNote, FinanceNote, ImprovementNote]
    wrapup:   [Recognition, OtherUpdates]
  Tier3Board:
    header:   [BoardDate, Chair, HuddleHeld, OverallStatus]
    statuses: [OperationsStatus, WorkforceStatus, QualitySafetyStatus, FacilitiesStatus, TechnologyStatus, FinanceStatus, SupplyChainStatus, ServiceDeliveryStatus, ComplianceStatus, CommunicationsStatus]
    notes:    [OperationsNote, WorkforceNote, QualitySafetyNote, FacilitiesNote, TechnologyNote, FinanceNote, SupplyChainNote, ServiceDeliveryNote, ComplianceNote, CommunicationsNote]
    wrapup:   [Recognition, OtherUpdates]

# Four views per board, identical everywhere. "Last 14 days" IS the wall
# chart: statuses only, newest first, so the fortnight reads as a grid.
# "Attention" filters on OverallStatus and not on the stream columns because
# view conditions are ANDed — "any stream amber or red" is not expressible,
# which is the reason OverallStatus exists as a chair-set headline.
views:
  Tier1Board:
    - title: "Last 14 days"
      default: true
      fields: ["@header", "@statuses"]
      where:
        - { field: BoardDate, op: geq, value: today-14 }
      sort:
        - { field: BoardDate, direction: desc }
    - title: "Today"
      fields: ["@header", "@statuses", "@notes", "@wrapup"]
      where:
        - { field: BoardDate, op: eq, value: today }
    - title: "Attention"
      fields: ["@header", "@statuses", "@notes"]
      where:
        - { field: BoardDate, op: geq, value: today-30 }
        - { field: OverallStatus, op: neq, value: "Green" }
      sort:
        - { field: BoardDate, direction: desc }
    - title: "Not held"
      fields: [BoardDate, Chair, HuddleHeld, StoodDownReason]
      where:
        - { field: HuddleHeld, op: neq, value: "Held" }
      sort:
        - { field: BoardDate, direction: desc }
  Tier2Board:
    - title: "Last 14 days"
      default: true
      fields: ["@header", "@statuses"]
      where:
        - { field: BoardDate, op: geq, value: today-14 }
      sort:
        - { field: BoardDate, direction: desc }
    - title: "Today"
      fields: ["@header", "@statuses", "@notes", "@wrapup"]
      where:
        - { field: BoardDate, op: eq, value: today }
    - title: "Attention"
      fields: ["@header", "@statuses", "@notes"]
      where:
        - { field: BoardDate, op: geq, value: today-30 }
        - { field: OverallStatus, op: neq, value: "Green" }
      sort:
        - { field: BoardDate, direction: desc }
    - title: "Not held"
      fields: [BoardDate, Chair, HuddleHeld, StoodDownReason]
      where:
        - { field: HuddleHeld, op: neq, value: "Held" }
      sort:
        - { field: BoardDate, direction: desc }
  Tier3Board:
    - title: "Last 14 days"
      default: true
      fields: ["@header", "@statuses"]
      where:
        - { field: BoardDate, op: geq, value: today-14 }
      sort:
        - { field: BoardDate, direction: desc }
    - title: "Today"
      fields: ["@header", "@statuses", "@notes", "@wrapup"]
      where:
        - { field: BoardDate, op: eq, value: today }
    - title: "Attention"
      fields: ["@header", "@statuses", "@notes"]
      where:
        - { field: BoardDate, op: geq, value: today-30 }
        - { field: OverallStatus, op: neq, value: "Green" }
      sort:
        - { field: BoardDate, direction: desc }
    - title: "Not held"
      fields: [BoardDate, Chair, HuddleHeld, StoodDownReason]
      where:
        - { field: HuddleHeld, op: neq, value: "Held" }
      sort:
        - { field: BoardDate, direction: desc }
  Escalation:
    - title: "Open"
      default: true
      fields: [Title, RaisedDate, RaisedAtTier, Stream, Direction, TargetTier, Owner, DueDate, Priority, Status]
      where:
        - { field: Status, op: not_in, value: ["Resolved", "Closed"] }
      sort:
        - { field: DueDate, direction: asc }
    - title: "Overdue"
      fields: [Title, RaisedDate, RaisedAtTier, Stream, Direction, TargetTier, Owner, DueDate, Priority, Status]
      where:
        - { field: Status, op: not_in, value: ["Resolved", "Closed"] }
        - { field: DueDate, op: leq, value: today }
      sort:
        - { field: DueDate, direction: asc }
    - title: "Due next 7 days"
      fields: [Title, RaisedDate, RaisedAtTier, Stream, Direction, TargetTier, Owner, DueDate, Priority, Status]
      where:
        - { field: Status, op: not_in, value: ["Resolved", "Closed"] }
        - { field: DueDate, op: leq, value: today+7 }
      sort:
        - { field: DueDate, direction: asc }
    - title: "Escalated up"
      fields: [Title, RaisedDate, RaisedAtTier, Stream, TargetTier, Owner, DueDate, Priority, Status]
      where:
        - { field: Direction, op: eq, value: "Escalated up" }
      sort:
        - { field: RaisedDate, direction: desc }
    - title: "Delegated down"
      fields: [Title, RaisedDate, RaisedAtTier, Stream, TargetTier, Owner, DueDate, Priority, Status]
      where:
        - { field: Direction, op: eq, value: "Delegated down" }
      sort:
        - { field: RaisedDate, direction: desc }
    - title: "By route"
      fields: [Title, Route, Stream, Direction, Owner, DueDate, Priority, Status]
      where:
        - { field: Status, op: neq, value: "Closed" }
      group_by: { field: Route, collapsed: true }
      sort:
        - { field: DueDate, direction: asc }

# Route exists to group the escalation queue by where things travel. Both
# operands are single-select Choice and both are declared BEFORE Route in
# the DBML. ASCII arrow so the generated formula carries no encoding
# question. Verify it renders after the first paste — see the checklist in
# 30-deploy/DEPLOY.md.
calculated_formulas:
  Escalation:
    Route: '=[RaisedAtTier]&" -> "&[TargetTier]'

# Column formatting: the fleet style standard (dbml-sharepoint
# website/docs/reference/style-guide.md) — status columns render as
# SharePoint's own severity boxes with icons, consistent across every
# template. Blank stays blank and renders grey: that grey cell is the
# unreported-stream signal the whole board design exists to give you.
# ADDING A STREAM: add its *Status column here too, or it renders as plain
# text in the grid. RETIRING one: leave the entry, so the history still
# renders in colour wherever the column is still shown.
column_formatting:
  Tier1Board:
    OverallStatus:     { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    SafetyStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    PeopleStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    WorkloadStatus:    { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    EquipmentStatus:   { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    QualityStatus:     { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    ImprovementStatus: { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
  Tier2Board:
    OverallStatus:        { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    SafetyStatus:         { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    QualityStatus:        { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    WorkforceStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    DemandCapacityStatus: { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    EquipmentStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    SuppliesStatus:       { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    FinanceStatus:        { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    ImprovementStatus:    { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
  Tier3Board:
    OverallStatus:         { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    OperationsStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    WorkforceStatus:       { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    QualitySafetyStatus:   { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    FacilitiesStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    EnvironmentStatus:     { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    TechnologyStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    FinanceStatus:         { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    SupplyChainStatus:     { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    ServiceDeliveryStatus: { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    ComplianceStatus:      { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
    CommunicationsStatus:  { style: severity, map: { Green: good, Amber: warning, Red: severe, "Not applicable": muted } }
  Escalation:
    Status:   { style: severity, map: { Open: low, "In progress": low, Resolved: good, "Returned to tier": warning, Closed: muted } }
    Priority: { style: pill, map: { Low: neutral, Medium: low, High: warning, Critical: blocked } }
    DueDate:  { style: overdue-date, guard: { field: Status, not: [Resolved, Closed] } }

# Form sections: a 20-to-30 column form is otherwise one flat scroll, and
# the chair fills it in daily. Header / Streams / Wrap-up mirrors how the
# huddle actually runs. The bodies live in formatting/ rather than inline
# because a multi-section body is long enough to drown this file. Field
# lists inside those files use INTERNAL names; the deployer rewrites them
# to display titles.
# ADDING A STREAM: add its pair to the Streams section of the matching file.
form_formatting:
  Tier1Board:
    body: formatting/tier1-form-body.json
  Tier2Board:
    body: formatting/tier2-form-body.json
  Tier3Board:
    body: formatting/tier3-form-body.json

# Ask for the stood-down reason only when there is one to give. Every other
# day the chair never sees the field, which is the whole point: the form is
# filled in daily and every avoidable question is a daily cost.
# reconcile: exact makes this file authoritative for the whole list — every
# other column's conditional formula is cleared on each deploy. That is what
# you want on a template; read the Reconciliation section of the mapping
# reference before copying the pattern onto a hand-configured list.
form_visibility:
  Tier1Board:
    reconcile: exact
    columns:
      StoodDownReason:
        when:
          - { field: HuddleHeld, op: neq, value: "Held" }
  Tier2Board:
    reconcile: exact
    columns:
      StoodDownReason:
        when:
          - { field: HuddleHeld, op: neq, value: "Held" }
  Tier3Board:
    reconcile: exact
    columns:
      StoodDownReason:
        when:
          - { field: HuddleHeld, op: neq, value: "Held" }

# Save-time enforcement, written as conditions rather than SharePoint
# syntax. Read each as an implication.
#   Boards: EITHER the huddle was held, OR there is a reason. A stood-down
#   day with no reason turns the Not held view into a list of dates with no
#   explanation, which is worse than no view at all. StoodDownReason is
#   nvarchar precisely because a validation rule cannot reference a
#   multi-line column.
#   Escalation: EITHER it is not finished, OR it says what was done and
#   when. Same constraint drives Resolution being nvarchar; the long-form
#   narrative lives in Notes.
list_validation:
  Tier1Board:
    when:
      any_of:
        - { field: HuddleHeld, op: eq, value: "Held" }
        - { field: StoodDownReason, op: is_not_null }
    message: "A huddle that was stood down or cancelled needs a reason."
  Tier2Board:
    when:
      any_of:
        - { field: HuddleHeld, op: eq, value: "Held" }
        - { field: StoodDownReason, op: is_not_null }
    message: "A huddle that was stood down or cancelled needs a reason."
  Tier3Board:
    when:
      any_of:
        - { field: HuddleHeld, op: eq, value: "Held" }
        - { field: StoodDownReason, op: is_not_null }
    message: "A huddle that was stood down or cancelled needs a reason."
  Escalation:
    when:
      any_of:
        - { field: Status, op: not_in, value: ["Resolved", "Closed"] }
        - all_of:
            - { field: Resolution, op: is_not_null }
            - { field: ResolvedDate, op: is_not_null }
    message: "Resolving or closing an escalation needs a resolution and a resolved date."

# A worked, live example of the stream lifecycle: Environment folded into
# Facilities. One entry per column is the whole edit — the pair leaves every
# view and the New form, its titles gain " (retired)", and every value ever
# recorded stays readable and stays in the reporting bundle. The DBML
# declaration stays put; deleting it is the trap 30-deploy/DEPLOY.md spells
# out.
# Deploying this template for the first time and you never ran an
# Environment stream? Then nothing exists to preserve: delete this block and
# the two columns from schema.dbml before the first paste.
retired_columns:
  Tier3Board:
    EnvironmentStatus:
      retired: "2026-07-01"
      superseded_by: FacilitiesStatus
      reason: "Environment folded into Facilities at the July board review"
    EnvironmentNote:
      retired: "2026-07-01"
      superseded_by: FacilitiesNote
      reason: "Environment folded into Facilities at the July board review"

# Demo rows (emitted as demo-data.js only when the build runs with --seed).
# The heat grid is invisible on an empty list, so the template ships a
# fortnight of Tier 3 boards and six escalations: every declared view has
# content on the day you demonstrate it. Dates are today-relative sentinels.
# Two stream columns are omitted DELIBERATELY (ComplianceStatus on th3-d03,
# SupplyChainStatus on th3-d01) so the unreported-grey cell is visible — do
# not fill them in. Every Title carries the [DEMO] marker: rows are matched
