# Visitor log — physical mapping.
prefix: "VI_"

entities:
  Visit: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

versioning:
  default:
    enable_versioning: true
    major_version_limit: 50
    enable_minor_versions: false
  overrides: {}

enum_sources: {}
watched_lists: []

# Security: sign-ins are recorded by reception and by hosts — Members and
# Owners hold Contribute; Full Control confined to the empty-by-default
# admin group. Visit rows are personal data: retention rules in 50-govern
# are load-bearing.
groups:
  - name: "VI List Administrators"
    description: "Full Control for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_operator_during_deploy: true

permission_levels: []

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "VI List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Contribute"
      - principal: { kind: associated_owner_group }
        level: "Contribute"

# UI hardening (tamper-resilience): site owners/admins bypass every ACL,
# so the realistic threat is well-meaning UI tampering. Sealed columns
# block schema edits and deletion of every deployed column through the
# UI even for site admins (display-name renames stay possible — drift,
# reverted on re-paste; the deployer unseals for its own runs and
# re-seals in Phase 4.1); prevent_list_deletion blocks UI deletion of the
# list objects (rollback.js clears it per list after you confirm that
# list's deletion). Friction + tamper-evidence, not enforcement — see
# "The shared security model" in templates/README.md.
seal_columns: true
prevent_list_deletion: true

# Internal names stay authoritative (views, indexes and the reporting
# bundle all bind to them); only the display title changes. Auto
# PascalCase splitting is right for every column here except one:
# "VisitLocation" exists to keep a bare "Location" out of the DBML, and a
# warden reading the muster list on a phone wants the column headed
# "Location".
display_names:
  mode: auto
  overrides:
    Visit:
      VisitLocation: "Location"

# Column formatting: the fleet style standard (website/docs/reference/
# style-guide.md).
#
# SignedOutAt is a bespoke file rather than a style because the shape the
# library covers is the opposite of what this column means. Everywhere
# else a blank cell is missing data; here a blank cell IS the fact — the
# person is still in the building — and it is the single fact the whole
# register exists to publish. So blank renders as an "On site" chip in the
# `low` treatment, and a filled cell renders as the plain local time they
# left. Documented sp-field-severity classes only; no hexes.
#
# Deliberately NOT declared: a row-level wash (§1.6). The worst state here
# is "signed in yesterday, still shown as on site", and that state already
# has a whole view of its own — a wash would be a second signal for a
# condition the filter has already isolated, which is the noise §1.6
# exists to prevent.
column_formatting:
  Visit:
    VisitorType:
      style: pill
      map:
        "Visitor": neutral
        "Contractor": low
        "Student / placement": low
        "Volunteer": low
        "Delivery": neutral
        "Other": muted
    SignedOutAt: formatting/signed-out-at.json

# Declared views (deployed and reconciled by the views phase; undeclared
# views are never touched). "On site now" is the default because it is the
# muster list: at the assembly point nobody should have to pick a view.
# Widths are pixel ColumnWidth per view, keyed on INTERNAL names — the
# build rewrites them to display titles, and ColumnWidth binds by display
# name.
views:
  Visit:
    - title: "On site now"
      default: true
      fields: [Title, Organisation, VisitorType, Host, VisitLocation, Purpose,
               SignedInAt, BadgeRef, InductionSighted]
      where:
        - { field: SignedOutAt, op: is_null }
      sort:
        - { field: SignedInAt, direction: asc }
      widths:
        Title: 260
        Organisation: 180
        VisitorType: 130
        Host: 160
        VisitLocation: 160
        Purpose: 200
        SignedInAt: 170
        BadgeRef: 120
        InductionSighted: 130
    # The published recommended-views table specified `SignedInAt = today`.
    # That filter returns nothing on a datetime column: CAML's <Today/> is
    # midnight, and an equality test against midnight matches only a
    # sign-in stamped at exactly 00:00. `geq today` is the same day's
    # traffic, and is what ships.
    - title: "Signed in today"
      fields: [Title, Organisation, VisitorType, Host, VisitLocation,
               SignedInAt, SignedOutAt]
      where:
        - { field: SignedInAt, op: geq, value: today }
      sort:
        - { field: SignedInAt, direction: desc }
      widths:
        Title: 280
        Organisation: 180
        VisitorType: 130
        Host: 160
        VisitLocation: 160
        SignedInAt: 170
        SignedOutAt: 170
    - title: "Contractors on site"
      fields: [Title, Organisation, VisitorType, Host, VisitLocation,
               InductionSighted, SignedInAt]
      where:
        - { field: SignedOutAt, op: is_null }
        - { field: VisitorType, op: eq, value: "Contractor" }
      sort:
        - { field: SignedInAt, direction: asc }
      widths:
        Title: 280
        Organisation: 180
        VisitorType: 130
        Host: 160
        VisitLocation: 160
        InductionSighted: 130
        SignedInAt: 170
    # The morning tidy-up. Still shown as on site, but signed in before
    # today — on a muster list that is a warden searching a building for
    # someone who went home at three yesterday afternoon.
    - title: "Never signed out"
      fields: [Title, Organisation, VisitorType, Host, VisitLocation,
               SignedInAt, BadgeRef]
      where:
        - { field: SignedOutAt, op: is_null }
        - { field: SignedInAt, op: lt, value: today }
      sort:
        - { field: SignedInAt, direction: asc }
      widths:
        Title: 280
        Organisation: 180
        VisitorType: 130
        Host: 160
        VisitLocation: 160
        SignedInAt: 170
        BadgeRef: 120

# Nobody signs out at the moment they sign in, and an induction question
# asked of a courier is a question that trains people to tick without
# reading. Both fields therefore appear only when they mean something.
#
# reconcile: exact makes this file authoritative for the whole list —
# every other column's conditional formula is cleared on each deploy. Read
# the Reconciliation section of the mapping reference before copying the
# pattern onto a hand-configured list.
form_visibility:
  Visit:
    reconcile: exact
    columns:
      SignedOutAt: { new: false }
      InductionSighted:
        when:
          - { field: VisitorType, op: in,
              value: ["Contractor", "Student / placement"] }

# Form layout: a strapline header and three sections. Per-field
# description hints render on the NEW form only — SharePoint suppresses
# column descriptions on the Edit form. Section field lists are authored
# with INTERNAL names; the build rewrites them to display titles.
form_formatting:
  Visit:
    header: formatting/visit-form-header.json
    body: formatting/visit-form-body.json

# Per-column save rules, each with its own message. Every column here is a
# DATETIME, and `now` renders as NOW() in a validation formula — verified
# against a live tenant on 2026-07-29
# (test/manual/datetime-sentinel-probe.js), against Microsoft's own formula
# reference, which says Lists do not support NOW(). That is true of
# calculated columns and false here.
#
# This used to read `today+1`, the midnight allowance, because TODAY() is
# midnight and `leq today` on a datetime rejects everything stamped after
# 00:00. The same probe confirmed that (V3) and measured what the allowance
# actually permitted (V6): up to tomorrow midnight, so between zero and
# twenty-four hours of future-dating depending on the time of day. `now`
# closes that window exactly.
column_validation:
  Visit:
    columns:
      SignedInAt:
        when:
          - { field: SignedInAt, op: leq, value: now }
        message: "A sign-in cannot be in the future. Use the time they actually arrived."
      SignedOutAt:
        when:
          - { field: SignedOutAt, op: leq, value: now }
        message: "A sign-out cannot be in the future. Leave it blank until they actually leave."

# Deliberately NOT declared: list_validation.
#
# The two cross-column rules this register wants are both unbuildable.
# "Signed out at or after signed in" needs a column-to-column comparison,
# which the condition grammar does not express — every operand is a
# literal. "Everyone but a delivery driver needs a host" needs a person
# column as an operand, which SharePoint validation formulas cannot read
# at all. Both stay governance checks; 50-govern/GOVERNANCE.md says so.

# Demo rows (emitted as demo-data.js ONLY when built with --seed). Every
# Title starts "[DEMO] " — the marker rollback.js trusts to delete
# demo-only lists without its non-empty refusal. Dates are today±N so the
# muster surfaces land correctly whenever the demo runs; "@me" is the
# pasting operator. Coverage: three people still on site (one of them
# signed in yesterday, which is what "Never signed out" exists for), a
# contractor with an induction ticked, a student, and three completed
# visits so the sign-out rendering has something to show.
demo_items:
  Visit:
    - key: vi-onsite-supplier
      values:
        Title: "[DEMO] Priya Raman"
        Organisation: "[DEMO] Northbridge Supplies"
        VisitorType: "Visitor"
        Host: "@me"
        Purpose: "Demo row. Quarterly supply review with the facilities team."
        VisitLocation: "Main building - meeting room 2"
        SignedInAt: "today"
        BadgeRef: "V-114"
