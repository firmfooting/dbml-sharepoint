        EquipmentTag: "[DEMO] FIRE-0203"
        EquipmentType: "Fire and emergency"
        EquipLocation: "Clinic wing - corridors 1 and 2"
        ServiceProvider: "Contracted fire services provider"
        FrequencyMonths: 6
        NextDueDate: "today+150"
        Status: "In service"
        Notes: "Demo row. Six-monthly under the fire-services contract."
    - key: em-testtag
      values:
        Title: "[DEMO] Portable suction unit"
        EquipmentTag: "[DEMO] ELEC-0771"
        EquipmentType: "Electrical - test and tag"
        EquipLocation: "Treatment room 2"
        ServiceProvider: "Internal maintenance team"
        FrequencyMonths: 12
        NextDueDate: "today-5"
        Status: "Out of service - awaiting maintenance"
        Notes: "Demo row. Failed its test and tag; withdrawn and physically tagged the same minute the result was recorded."
    - key: em-ahu
      values:
        Title: "[DEMO] Air handling unit - old wing"
        EquipmentTag: "[DEMO] PLANT-0012"
        EquipmentType: "Plant - HVAC / utilities"
        EquipLocation: "Old wing - roof plant"
