        EquipmentTag: "[DEMO] BIO-0118"
        EquipmentType: "Biomedical / clinical"
        EquipLocation: "Main reception - wall cabinet"
        ServiceProvider: "Regional biomedical service"
        FrequencyMonths: 12
        NextDueDate: "today+35"
