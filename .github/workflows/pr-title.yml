# The org's conventional PR title check; the check itself, and why it exists,
# live in firmfooting/.github's pr-title.yml so every repository runs the same one.
name: PR title

on:
  pull_request:
    # `edited` matters: a title fixed after the fact must re-run the check.
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    permissions: {}
    uses: firmfooting/.github/.github/workflows/pr-title.yml@d6d7bba33c7c6e73b0f4e03d6628bb7c3e6d0839 # v1.4.0
