# Docs site deploy (GitHub Pages). Publishes on every push to main that
# changes the site, so the published docs are main's docs: a page merged
# is a page live, with nobody having to remember to run this. The site is
# built from website/ alone. The API reference pages under
# website/docs/api/ are generated and COMMITTED (deterministic; drift
# shows as a git diff, and ci.yml fails on it), so a source change that
# alters them arrives here as a change under website/ too, and the build
# needs Node only. ci.yml's docs job builds the same site on every pull
# request, so a broken link is caught before it reaches main.
# workflow_dispatch stays for a republish with no change, such as after a
# Pages outage.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
