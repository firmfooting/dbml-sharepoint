# Release + publish pipeline. The PyPI trusted publisher is bound to THIS
# workflow filename (publish.yml) and the `pypi` environment, so the publish
# job must live here.
#
# Flow: conventional commits land on main -> release-please maintains a
# release PR -> merging it makes release-please (in that push's run) create
# the vX.Y.Z tag + GitHub release and set release_created=true -> the build
# and publish jobs run in the SAME workflow run. They must: releases created
# with the default GITHUB_TOKEN cannot trigger other workflows, so a separate
# on:release publish workflow would never fire.
#
# First-release bootstrap (v0.1.0): the manifest already records 0.1.0, so
# release-please only manages releases AFTER it. Create the first tag and
# release by hand, then publish that build with a manual dispatch:
#   gh release create v0.1.0 --title v0.1.0 --notes "Initial release"
#   gh workflow run publish.yml
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release tag + GitHub release
      pull-requests: write   # maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false  # release artifacts are never built from a cache
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dbml-sharepoint/
    permissions:
      id-token: write  # OIDC trusted publishing; no API token anywhere
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
