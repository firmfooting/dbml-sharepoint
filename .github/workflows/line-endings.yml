# The org's line-ending rule; the check itself, and why it exists, live in
# firmfooting/.github's line-endings.yml so every repository runs the same one.
name: Line endings

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  line-endings:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/line-endings.yml@d6d7bba33c7c6e73b0f4e03d6628bb7c3e6d0839 # v1.4.0
