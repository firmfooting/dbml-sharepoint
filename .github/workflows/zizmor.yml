# The org's workflow security audit; the check itself, and why it exists, live
# in firmfooting/.github's zizmor.yml so every repository runs the same one.
name: Workflow security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/zizmor.yml@d6d7bba33c7c6e73b0f4e03d6628bb7c3e6d0839 # v1.4.0
