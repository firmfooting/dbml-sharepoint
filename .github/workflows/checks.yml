# The org's gates (PR title, line endings, workflow security, prek) as one job,
# from firmfooting/.github. `edited` is here for the PR title check; the shared
# job skips an edit that did not change the title.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

jobs:
  checks:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/checks.yml@b42e6a19ea7bb68439f4d9a632f16f4fd6ab7338 # v1.6.0
