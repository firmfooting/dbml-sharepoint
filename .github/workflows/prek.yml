# The org's git-hook gate: every hook in .pre-commit-config.yaml over the whole
# tree. The job itself lives in firmfooting/.github's prek.yml so every
# repository runs the same one.
name: prek

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  prek:
    permissions:
      contents: read
    uses: firmfooting/.github/.github/workflows/prek.yml@d6d7bba33c7c6e73b0f4e03d6628bb7c3e6d0839 # v1.4.0
