[project]
name = "dbml-sharepoint"
version = "0.1.0"
description = "Turn a DBML schema + YAML mapping into an idempotent, fail-closed browser-console deploy.js that provisions SharePoint Online lists — no tenant admin, no premium licence, no install on the target."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Shaun Eccles-Smith" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "sharepoint",
  "dbml",
  "provisioning",
  "sharepoint-online",
  "lists",
  "schema",
  "deployment",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pydbml>=1.1.0,<2.0",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.3",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/shauneccles/dbml-sharepoint"
Documentation = "https://shauneccles.github.io/dbml-sharepoint/"
Repository = "https://github.com/shauneccles/dbml-sharepoint"
Issues = "https://github.com/shauneccles/dbml-sharepoint/issues"

[project.scripts]
dbml-sharepoint = "dbml_sharepoint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbml_sharepoint"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12",
  "j2lint>=1.2.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "test", "website/scripts"]

[[tool.mypy.overrides]]
module = "pydbml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra -q --strict-markers"
