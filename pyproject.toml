[project]
name = "dbml-sharepoint"
version = "0.1.0"
description = "Turn a DBML schema + YAML mapping into an idempotent, fail-closed browser-console deploy.js that provisions SharePoint Online lists — no tenant admin, no premium licence, no install on the target."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Shaun Eccles-Smith" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "sharepoint",
  "dbml",
  "provisioning",
  "sharepoint-online",
  "lists",
  "schema",
  "deployment",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pydbml>=1.1.0,<2.0",
  # The CLI imports pyparsing directly. PyDBML 1.2.1 also still uses its
  # pre-PEP8 aliases, which warn in 3.3 and are due for removal in 4.0.
  # Lift this cap once PyDBML has migrated to the snake_case API.
  "pyparsing>=3.0.0,<3.3",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.3",
  "typer>=0.12.0",
  "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/shauneccles/dbml-sharepoint"
Documentation = "https://shauneccles.github.io/dbml-sharepoint/"
Repository = "https://github.com/shauneccles/dbml-sharepoint"
Issues = "https://github.com/shauneccles/dbml-sharepoint/issues"

[project.scripts]
dbml-sharepoint = "dbml_sharepoint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbml_sharepoint"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.12",
  "j2lint>=1.2.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "A", "B", "C4", "DTZ", "E", "F", "FURB", "I", "ISC", "N", "PIE",
  "PTH", "RET", "RUF", "S", "SIM", "T20", "UP", "W",
]
ignore = [
  "B008",  # typer.Option in defaults is the framework idiom
  "C408",  # dict(key=...) literals are deliberate where used
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S101"]           # pytest asserts
"website/scripts/**" = ["T20"] # generator scripts report via print
"test/manual/render_probes.py" = ["T20"]     # generator script, reports via print
"test/manual/make_threshold_rows.py" = ["T20"]  # generator script, reports via print
"test/test_probes.py" = ["S603", "S607"]     # runs `node --check` on our own files

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "test", "website/scripts"]

[[tool.mypy.overrides]]
module = "pydbml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra -q --strict-markers"
filterwarnings = ["error"]
