# ============================================================================
# dbml-sharepoint example: Project Tracker — physical mapping
# ============================================================================
# Everything SharePoint-physical that does not belong in the DBML: the list
# prefix, templates, indexes, versioning, calculated-column formulas, and the
# security model (permission level, groups, per-list ACLs with exact
# allowlist reconciliation).
# ============================================================================

prefix: "PT_"

entities:
  Project: { kind: List, base_template: 100, site_role: default }
  Task:    { kind: List, base_template: 100, site_role: default }
  TimeLog: { kind: List, base_template: 100, site_role: default }

cross_site_reference_columns: []

# Indexed for the common filters: open tasks per project, time per task.
indexed_columns:
  Project: [Status]
  Task: [Status, Project]
  TimeLog: [Task, WorkDate]

versioning:
  default:
    enable_versioning: true
    major_version_limit: 100
    enable_minor_versions: false
  overrides:
    # Time entries churn; keep less history.
    TimeLog:
      major_version_limit: 25

enum_sources: {}
watched_lists: []

# Calculated columns: the DBML declares the column (calculated_text /
# calculated_number); the formula lives here. SharePoint rules apply —
# single-select Choice/Text/Number/Date references only (no Lookup, Person
# or [Today]), 1024 chars max, and the referenced columns must be declared
# BEFORE the calculated column in the DBML so they exist at creation time.
calculated_formulas:
  Project:
    BudgetHealth: '=IF(OR(ISBLANK([Budget]),ISBLANK([Spent])),"",IF([Spent]>[Budget],"Over budget",IF([Spent]>[Budget]*0.9,"At risk","Within budget")))'

# --- Security (optional — delete everything below for inherited ACLs) ------
# Model: everyone on the site works with items (Contribute), nobody can
# alter list schema; Full Control lives only in an empty-by-default admin
# group. The deploy script corrects group ownership automatically (CSOM) and
# enrols the running operator into flagged groups for the duration of the
# run, removing them at the end — so redeploys need no manual group juggling.

groups:
  - name: "PT List Administrators"
    description: "Full Control over the tracker lists for schema changes and redeploys. Empty by default; the deploy script enrols the running operator per run."
    owner_group: "Site Owners"
    allow_members_edit_membership: false
    allow_request_to_join_leave: false
    auto_accept_request_to_join_leave: false
    only_allow_members_view_membership: false
    enroll_operator_during_deploy: true

permission_levels: []

list_permissions:
  default:
    site_role: default
    break_inheritance: true
    reconcile: exact
    assignments:
      - principal: { kind: group, name: "PT List Administrators" }
        level: "Full Control"
      - principal: { kind: associated_member_group }
        level: "Contribute"
      - principal: { kind: associated_owner_group }
        level: "Contribute"
